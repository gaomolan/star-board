ger/ReDoc assets locally, with offline access, Bearer authorization and reverse-proxy path prefixes\n\n**修复 / Fixes**\n- Router：任务保留期从跨 worker 副本清理完成后开始；过期回收及 worker","release_url":"https://github.com/opendatalab/MinerU/releases/tag/mineru-4.0.12-released"},{"tag":"mineru-4.0.11-released","prerelease":false,"published_at":"2026-10-08T18:22:41Z","date":"2026-10-08","zh":"## 更新内容 / 变更说明\n\n**改进 / Improvements**\n- API：`/v1/models` 统一返回随服务版本变化的虚拟模型 ID（如 `mineru-4.0.11`），补充模型描述并保持注册时间稳定；`/v1/tiers` 的 `current_model` 同步使用该 ID，解析质量通过 `tier` 选择 / API：通过 `/v1/models` 公开单一版本化的虚拟模型 ID，添加其描述并保持注册时间戳稳定；`/v1/tiers` 的 `current_model` 使用相同的 ID，而解析质量则通过 `tier` 进行选择\n- 图像处理：移除 MinerU 生产代码中的 OpenCV 导入和调用，OCR、公式、表格及印章校正等图像操作通过 DocVortex 公共接口执行 / 图像处理：从 MinerU 生产代码中移除 OpenCV 的导入和调用，并使用 DocVortex 公共接口执行 OCR、公式、表格及印章图像操作\n\n**修复 / Fixes**\n- CLI：修复 `mineru parse` 单文件输入无法覆盖已有输出文件的问题；拒绝输出路径与输入文件相同的路径，以避免覆盖源文件；多文件输入仍要求输出为目录 / CLI：允许 `mineru parse` 在单文件输入时覆盖现有输出文件；拒绝指向输入文件的输出路径；多文件输入仍要求输出为目录\n\n**依赖 / Dependencies**\n- docvortex 最低版本提升至 0.5.12（`>=0.5.12,<1`）/ 要求 docvortex>=0.5.12,<1\n- 移除对 OpenCV 的直接依赖；Torch/full 等可选依赖配置保持不变，第三方依赖仍可能间接安装 OpenCV / Remove the direct OpenCV dependency; Torch/full extras retain their existing configuration, and third-party dependencies may still install OpenCV transitively\n\n**升级提示 / Upgrade Notes**\n- API 客户端应通过 `GET /v1/models` 获取当前虚拟模型 ID，并在服务升级后重新发现；使用 `tier` 选择解析质量，避免硬编码历史模型 ID / API 客户端应通过 `GET /v1/models` 获取当前虚拟模型 ID，并在服务器升级后刷新该 ID； 通过 `tier` 选择解析质量，而非硬编码历史模型 ID\n\n**完整变更日志**：https://github.com/opendatalab/MinerU/compare/mineru-4.0.10-released...mineru-4.0.11-released","body":"## 更新内容 / What's Changed\n\n**改进 / Improvements**\n- API：`/v1/models` 统一返回随服务版本变化的虚拟模型 ID（如 `mineru-4.0.11`），补充模型描述并保持注册时间稳定；`/v1/tiers` 的 `current_model` 同步使用该 ID，解析质量通过 `tier` 选择 / API: expose a single versioned virtual model ID through `/v1/models`, add its description and keep the registration timestamp stable; `/v1/tiers` uses the same ID for `current_model`, while parsing quality is selected through `tier`\n- 图像处理：移除 MinerU 生产代码中的 OpenCV 导入和调用，OCR、公式、表格及印章矫正等图像操作通过 DocVortex 公共接口执行 / Image processing: remove OpenCV imports and calls from MinerU production code and use public DocVortex interfaces for OCR, formula, table and seal image operations\n\n**修复 / Fixes**\n- CLI：修复 `mineru parse` 单文件输入无法覆盖已有输出文件的问题；拒绝输出路径与输入文件相同，避免覆盖源文件；多文件输入继续要求输出为目录 / CLI: allow `mineru parse` to overwrite an existing output file for a single input, reject output paths that point to the input file, and continue requiring a directory for multiple inputs\n\n**依赖 / Dependencies**\n- docvortex 最低版本提升至 0.5.12（`>=0.5.12,<1`）/ Require docvortex>=0.5.12,<1\n- 移除 OpenCV 直接依赖；Torch/full 等可选依赖配置保持原样，第三方依赖仍可能间接安装 OpenCV / Remove the direct OpenCV dependency; Torch/full extras retain their existing configuration, and third-party dependencies may still install OpenCV transitively\n\n**升级提示 / Upgrade Notes**\n- API 客户端应通过 `GET /v1/models` 获取当前虚拟模型 ID，并在服务升级后重新发现；使用 `tier` 选择解析质量，避免硬编码历史模型 ID / API clients should discover the current virtual model ID through `GET /v1/models` and refresh it after server upgrades; select parsing quality through `tier` instead of hard-coding historical model IDs\n\n**Full Changelog**: https://github.com/opendatalab/MinerU/compare/mineru-4.0.10-released...mineru-4.0.11-released","release_url":"https://github.com/opendatalab/MinerU/releases/tag/mineru-4.0.11-released"},{"tag":"mineru-4.0.10-released","prerelease":false,"published_at":"2026-09-29T07:18:10Z","date":"2026-09-29","zh":null,"body":null,"release_url":"https://github.com/opendatalab/MinerU/releases/tag/mineru-4.0.10-released"}]},{"full":"AstrBotDevs/AstrBot","url":"https://github.com/AstrBotDevs/AstrBot","desc":"AI Agent Assistant & development framework that integrates lots of IM platforms, LLMs, plugins and AI feature, and can b","lang":"Python","stars":41855,"topics":["agent","ai","astrbot","chatbot","chatgpt","discord","docker","gemini","gpt","llama","llm","mcp","openai","python","qq","qqbot","telegram"],"cats":["ai"],"primary":"ai","tags":["mcp","telegram"],"categoryConfidence":"override","tag":"v4.29.0-beta.2","prerelease":false,"published_at":"2026-10-10T16:19:27Z","date":"2026-10-10","zh":"## [4.29.0-beta.2] - 2026-10-11\n\n此预发布版本包含自 **v4.29.0-beta.1** 以来的更改。\n\n### 主要新增功能\n\n- WebUI：在选定模型旁边以及“模型/备用模型”菜单中添加了模型设置快捷方式。对于使用该模型的每个配置文件，更改将立即保存。（#10321）\n- WebUI：新增了控制台日志搜索和关键词高亮功能，为技能添加了源代码标记，在 ChatUI 中支持分阶段图像预览，并会记住上次打开的“数据与日志”标签页。（#10327、#10339、#10376、#10251）\n- WebUI：在机器人编辑器中，通过侧边抽屉新增了配置文件编辑功能。（#10310）\n- Docker：在容器内部集成了用于密码重置的 `astrbot` CLI。（#10442）\n\n### 主要优化\n\n- WebUI：通过延迟加载 VAD、Monaco、翻译内容和 ApexCharts，并启用 gzip 响应，显著降低了初始加载开销并提升了加载速度。（#10413）\n- WebUI：在滚动时保持内容边框和角部固定，在桌面端右侧和底部添加了 6px 间距，并在内容窗格滚动时固定配置/设置标题栏和分区导航。（#10480）\n- 计算机使用：明确了本地权限访问模式；当无法使用本地隔离时，保持执行和文件访问控制可见；并将设置指南链接至整合后的 Agent Sandbox 指南。(#10444, #10445, #10487)\n- 文档：更新了中文和英文版的插件及内置 AI 指南，包含最新工作流、故障排除和本地化截图；更新了 Slack 及 Lark/飞书的设置说明。(#10487, #10353, #10400)\n\n### 主要修复\n\n- Agent：停止会话现可终止其后台代理任务，并防止主代理延迟唤醒。仅清理一次会话等待器，并将异步工具生成器保留在同一任务中。（#10323, #10347, #10474）\n- 代理：当后台任务结果未发送给用户时会发出警告，并避免记录没有匹配平台的 cron 发送。（#10398, #10468）\n- 核心：在上下文摘要失败后及时回退，将命令组名称匹配为","body":"## [4.29.0-beta.2] - 2026-10-11\n\nThis prerelease includes changes since **v4.29.0-beta.1**.\n\n### Major Additions\n\n- WebUI: Added model settings shortcuts beside selected models and in model/fallback menus. Changes save immediately for every configuration profile using that model. (#10321)\n- WebUI: Added console log search and keyword highlighting, source badges for Skills, staged image previews in ChatUI, and remembered the last opened Data & Logs tab. (#10327, #10339, #10376, #10251)\n- WebUI: Added configuration profile editing in a side drawer from the bot editor. (#10310)\n- Docker: Included the `astrbot` CLI for password reset inside containers. (#10442)\n\n### Major Optimizations\n\n- WebUI: Significantly reduced initial loading overhead and improved loading speed by lazy-loading VAD, Monaco, translations, and ApexCharts, and enabling gzip responses. (#10413)\n- WebUI: Kept content borders and corners fixed while scrolling, added 6px desktop right/bottom gaps, and pinned configuration/settings headers and section navigation while the content pane scrolls. (#10480)\n- Computer Use: Clarified local permission access modes, kept execution and file access controls visible when local isolation is unavailable, and linked setup guidance to the consolidated Agent Sandbox guide. (#10444, #10445, #10487)\n- Docs: Refreshed Chinese and English plugin and built-in AI guides with current workflows, troubleshooting, and localized screenshots; updated Slack and Lark/Feishu setup instructions. (#10487, #10353, #10400)\n\n### Major Fixes\n\n- Agent: Stopping a session now stops its background agent work and prevents late main-agent wakeups. Cleaned up session waiters only once and kept async tool generators in the same task. (#10323, #10347, #10474)\n- Agent: Warned when a background task result is not delivered to the user and avoided recording cron sends without a matching platform. (#10398, #10468)\n- Core: Fell back promptly after failed context summaries, matched command group names as","release_url":"https://github.com/AstrBotDevs/AstrBot/releases/tag/v4.29.0-beta.2","releases":[{"tag":"v4.29.0-beta.2","prerelease":false,"published_at":"2026-10-10T16:19:27Z","date":"2026-10-10","zh":"## [4.29.0-beta.2] - 2026-10-11\n\n此预发布版本包含自 **v4.29.0-beta.1** 以来的更改。\n\n### 主要新增功能\n\n- WebUI：在选定模型旁边以及“模型/备用模型”菜单中添加了模型设置快捷方式。对于使用该模型的每个配置文件，更改将立即保存。（#10321）\n- WebUI：新增了控制台日志搜索和关键词高亮功能，为技能添加了源代码标记，在 ChatUI 中支持分阶段图像预览，并会记住上次打开的“数据与日志”标签页。（#10327、#10339、#10376、#10251）\n- WebUI：在机器人编辑器中，通过侧边抽屉新增了配置文件编辑功能。（#10310）\n- Docker：在容器内部集成了用于密码重置的 `astrbot` CLI。（#10442）\n\n### 主要优化\n\n- WebUI：通过延迟加载 VAD、Monaco、翻译内容和 ApexCharts，并启用 gzip 响应，显著降低了初始加载开销并提升了加载速度。（#10413）\n- WebUI：在滚动时保持内容边框和角部固定，在桌面端右侧和底部添加了 6px 间距，并在内容窗格滚动时固定配置/设置标题栏和分区导航。（#10480）\n- 计算机使用：明确了本地权限访问模式；当无法使用本地隔离时，保持执行和文件访问控制可见；并将设置指南链接至整合后的 Agent Sandbox 指南。(#10444, #10445, #10487)\n- 文档：更新了中文和英文版的插件及内置 AI 指南，包含最新工作流、故障排除和本地化截图；更新了 Slack 及 Lark/飞书的设置说明。(#10487, #10353, #10400)\n\n### 主要修复\n\n- Agent：停止会话现可终止其后台代理任务，并防止主代理延迟唤醒。仅清理一次会话等待器，并将异步工具生成器保留在同一任务中。（#10323, #10347, #10474）\n- 代理：当后台任务结果未发送给用户时会发出警告，并避免记录没有匹配平台的 cron 发送。（#10398, #10468）\n- 核心：在上下文摘要失败后及时回退，将命令组名称匹配为","body":"## [4.29.0-beta.2] - 2026-10-11\n\nThis prerelease includes changes since **v4.29.0-beta.1**.\n\n### Major Additions\n\n- WebUI: Added model settings shortcuts beside selected models and in model/fallback menus. Changes save immediately for every configuration profile using that model. (#10321)\n- WebUI: Added console log search and keyword highlighting, source badges for Skills, staged image previews in ChatUI, and remembered the last opened Data & Logs tab. (#10327, #10339, #10376, #10251)\n- WebUI: Added configuration profile editing in a side drawer from the bot editor. (#10310)\n- Docker: Included the `astrbot` CLI for password reset inside containers. (#10442)\n\n### Major Optimizations\n\n- WebUI: Significantly reduced initial loading overhead and improved loading speed by lazy-loading VAD, Monaco, translations, and ApexCharts, and enabling gzip responses. (#10413)\n- WebUI: Kept content borders and corners fixed while scrolling, added 6px desktop right/bottom gaps, and pinned configuration/settings headers and section navigation while the content pane scrolls. (#10480)\n- Computer Use: Clarified local permission access modes, kept execution and file access controls visible when local isolation is unavailable, and linked setup guidance to the consolidated Agent Sandbox guide. (#10444, #10445, #10487)\n- Docs: Refreshed Chinese and English plugin and built-in AI guides with current workflows, troubleshooting, and localized screenshots; updated Slack and Lark/Feishu setup instructions. (#10487, #10353, #10400)\n\n### Major Fixes\n\n- Agent: Stopping a session now stops its background agent work and prevents late main-agent wakeups. Cleaned up session waiters only once and kept async tool generators in the same task. (#10323, #10347, #10474)\n- Agent: Warned when a background task result is not delivered to the user and avoided recording cron sends without a matching platform. (#10398, #10468)\n- Core: Fell back promptly after failed context summaries, matched command group names as","release_url":"https://github.com/AstrBotDevs/AstrBot/releases/tag/v4.29.0-beta.2"},{"tag":"v4.29.0-beta.1","prerelease":false,"published_at":"2026-10-01T03:48:14Z","date":"2026-10-01","zh":null,"body":null,"release_url":"https://github.com/AstrBotDevs/AstrBot/releases/tag/v4.29.0-beta.1"},{"tag":"v4.28.2","prerelease":false,"published_at":"2026-09-27T15:22:07Z","date":"2026-09-27","zh":null,"body":null,"release_url":"https://github.com/AstrBotDevs/AstrBot/releases/tag/v4.28.2"}]},{"full":"crimera/piko","url":"https://github.com/crimera/piko","desc":"morphe patches for twitter and instagram","lang":"Java","stars":5648,"topics":["morphe","morphe-patches"],"cats":["social"],"primary":"social","tags":[],"categoryConfidence":"override","tag":"v3.10.0","prerelease":false,"published_at":"2026-10-10T14:58:13Z","date":"2026-10-10","zh":"## 3.10.0 (2026-10-10)\n\n### 🐛 错误修复\n\n* **ci:** 将 Crowdin 翻译导入最新开发分支 (#1890) (385a8d1)\n* **github:** 使用现有的增强功能标签，并添加缺失的 Twitter 标签 (6337845)\n* **Instagram：** 在推荐标志中添加自动滚动持久化标志（#1957）（096ea87），关闭 #1746\n* **Instagram：** 添加缺失的实体依赖关系（#1833）（a19b255）\n* **Instagram：** 统一“即时”设置与已保存查看器的样式 (#2017) (a0a3360)\n* **Instagram：** 允许在受保护的私信窗口中截图 (45fee55)\n* **Instagram：** 修正补丁状态映射 (bf4a28c)\n* **Instagram：** 更正 HDR 和自动滚动推荐标志的名称 (#2078) (8917d71)\n* **Instagram：** 填充对话框按钮上方的菜单高亮区域 (#2016) (a326e42)\n* **Instagram：** 通过其自身键查找短效媒体的过期字段 (#2046) (ff2c809)\n* **Instagram：** 修复已删除消息的处理 (4254162)\n* **Instagram：** 在“关注”信息流中隐藏广告 (7914a26)\n* **Instagram：** 对于未知好友关系状态，隐藏“非关注者”标记 (f385660)\n* **Instagram：** 在主页信息流中隐藏“转发”按钮 (ae38467)\n* **Instagram：** 在正确的接收者上调用反射方法 (#1960) (e4a9464)\n* **Instagram：** 隔离故事滤镜 urated/` 和 `derived/`，而这类数据集的视图读的是 `meta/revisions/data/`；现在放行该目录，`meta/` 下的其他文件仍不可读。\n- `cne init --profile demo` / `sample` 结束时打印可直接复制的 MCP 接入命令（带配置的绝对路径），并当场生成度量表。此前用 `cne serve` 打开 demo 湖，概览显示 0 行，并把 demo 本来就不采的数据集标成「必需数据集为空」；现在面板与 `cne status` 一致，只评估 demo 湖实际持有的数据集。\n- 湖第一次成功建好时，在终端提示一次欢迎 Star；日志、管道和定时任务不会显示。\n- 控制台切到 English 后整页都是英文：操作页的卡片标题、说明、表单项和确认语句，取数设置、定时任务、数据备份、存储运维和首次配置页面，此前都有只显示中文的文字。服务端返回的报错和诊断说明仍是中文。\n- 文档分成中英文两套独立站点：中文仍在 https://rootsunc.github.io/CNEquity/ ，英文在 `/en/`，页眉可切换语言。源文件分别在 `docs/zh/` 和 `docs/en/`，中文页原有网址不变。两套页面一一对应，英文版的 CLI 参数表、命令副作用清单、字段表和衍生品能力表与中文版一样由代码生成，CLI 帮助的英文对照放在 `scripts/dev/i18n/`。「股票池画像」补上了中文版。中文页面改动后，若英文页没有同步更新，`tests/unit/test_docs_i18n.py` 会报出落后的页面；更新英文后用 `scripts/dev/doc_translations.py --mark` 登记。\n- MCP 指南新增 Claude Code、Claude Desktop、ChatGPT、Codex、Gemini CLI、Cursor、VS Code、Windsurf 等客户端的接入写法。","release_url":"https://github.com/rootSunc/CNEquity/releases/tag/v0.16.0","releases":[{"tag":"v0.16.0","prerelease":false,"published_at":"2026-10-07T19:17:25Z","date":"2026-10-07","zh":null,"body":"CNEquity 0.16.0 已发布至 PyPI。\n\n```bash\npython -m pip install --upgrade cnequity==0.16.0\n```\n\n- **升级步骤：** `pip install -U cnequity` 后重启 `cne serve` 和已在运行的 `cne mcp`。数据集契约没有变化，不需要迁移已有数据，也不需要改配置。\n- `cne mcp --http` 用 Streamable HTTP 在 `127.0.0.1:8788/mcp` 上提供同样的六个只读工具，供只接远程网址的客户端（如 ChatGPT）配合 cloudflared、ngrok 等隧道使用。`--token` 设置后每个请求都必须带令牌（`Authorization: Bearer`、`/mcp/<令牌>` 路径或 `?token=`）；不设令牌时只接受本机直连，经隧道或代理的请求和其他站点的网页请求都返回 403。非回环地址必须配 `--token`。stdio 用法不变。\n- MCP 工具声明 `readOnlyHint`，ChatGPT 等客户端据此把它们当作只读操作。\n- 新增与 `cne` 等价的 `cnequity` 命令，`uvx cnequity mcp --config <配置>` 无需先安装即可启动 MCP 服务。仓库根目录新增 `server.json`，用于登记到官方 MCP Registry。\n- 修复 MCP 的 `run_sql` 在已发布不可变版本的数据集上一律报 `Permission Error`。查询沙箱此前只放行 `curated/` 和 `derived/`，而这类数据集的视图读的是 `meta/revisions/data/`；现在放行该目录，`meta/` 下的其他文件仍不可读。\n- `cne init --profile demo` / `sample` 结束时打印可直接复制的 MCP 接入命令（带配置的绝对路径），并当场生成度量表。此前用 `cne serve` 打开 demo 湖，概览显示 0 行，并把 demo 本来就不采的数据集标成「必需数据集为空」；现在面板与 `cne status` 一致，只评估 demo 湖实际持有的数据集。\n- 湖第一次成功建好时，在终端提示一次欢迎 Star；日志、管道和定时任务不会显示。\n- 控制台切到 English 后整页都是英文：操作页的卡片标题、说明、表单项和确认语句，取数设置、定时任务、数据备份、存储运维和首次配置页面，此前都有只显示中文的文字。服务端返回的报错和诊断说明仍是中文。\n- 文档分成中英文两套独立站点：中文仍在 https://rootsunc.github.io/CNEquity/ ，英文在 `/en/`，页眉可切换语言。源文件分别在 `docs/zh/` 和 `docs/en/`，中文页原有网址不变。两套页面一一对应，英文版的 CLI 参数表、命令副作用清单、字段表和衍生品能力表与中文版一样由代码生成，CLI 帮助的英文对照放在 `scripts/dev/i18n/`。「股票池画像」补上了中文版。中文页面改动后，若英文页没有同步更新，`tests/unit/test_docs_i18n.py` 会报出落后的页面；更新英文后用 `scripts/dev/doc_translations.py --mark` 登记。\n- MCP 指南新增 Claude Code、Claude Desktop、ChatGPT、Codex、Gemini CLI、Cursor、VS Code、Windsurf 等客户端的接入写法。","release_url":"https://github.com/rootSunc/CNEquity/releases/tag/v0.16.0"},{"tag":"v0.15.0","prerelease":false,"published_at":"2026-10-07T11:00:01Z","date":"2026-10-07","zh":null,"body":"CNEquity 0.15.0 已发布至 PyPI。\n\n```bash\npython -m pip install --upgrade cnequity==0.15.0\n```\n\n- **升级步骤：** `pip install -U cnequity` 后重启 `cne serve`。数据集契约只新增三个可选的派生数据集 `minute_bars_15m` / `minute_bars_30m` / `minute_bars_60m`，默认不计算，不需要迁移已有数据，也不需要改配置；需要时运行 `cne derive minute_bars_15m` 等入湖。\n- 新增派生数据集 `minute_bars_15m`、`minute_bars_30m`、`minute_bars_60m`。默认不计算，日更和 `cne init` 都不生成；运行 `cne derive minute_bars_15m`（30m、60m 同理）后入湖，之后可用 `load`、`cne query` 的 SQL、HTTP 接口和 MCP 的 `query_bars` 读取，`load(..., adjust=\"hfq\")` 照常复权。某只股票某天有 1m 用 1m，否则用 5m，`resampled_from` 列标明来源；缺组成 K 线的股票当天跳过并在结果里计数。不给窗口时只算还没算过、或 1m / 5m 内容与计算规则有变化的交易日；停牌（整天无成交）和盘中停复牌（只交易部分时段）单独计数，有成交而 K 线中间断档或输入无效时只跳过对应的股票当天并把运行记为降级，重算后已无数据的交易日会清空。`cne status --datasets` 和面板数据集页会提示「输入有 N 个交易日尚未重算」。面板操作页的「重算派生」可以选这三个数据集，选中后表单说明计算规则；数据集页顶部的「重算派生」直接打开预选好的表单。完整规则见文档「15 / 30 / 60 分钟线」。\n- `resample_trade_bars` 可以从 5m 重采样出 15m / 30m / 60m，历史深度和 `minute_bars_5m` 相同（约 2 年），不再受 1m 只保留约 95 个交易日的限制。5m 里未成交分钟沿用的报价已经混入开高低价，少数区间的 OHLC 会与从 1m 重采样不同；1m 覆盖到的日期仍优先用 1m。新增 `resample_minute_history`：按股票和交易日有 1m 用 1m、否则用 5m，拼出一条 15m / 30m / 60m 序列，`resampled_from` 列标明每根的来源。文档中按自然时间分组的 15m 示例改用这个函数，原示例的 60m 不按 09:30 对齐。\n- Windows 上 `cne serve` 在端口已被占用时拒绝启动。此前该平台的地址复用会让第二个监听看起来成功。\n- 修复 Windows 上杀毒、索引、同步软件或另一个读取方短暂打开文件时，`cne derive` 等长任务因 `PermissionError: [WinError 5]` 中断。限流账本、数据集进度、面板任务记录和数据分区发布都会短暂重试；释放并发名额失败只记警告，不再中断取数。\n- Windows 上文件被长时间占用（例如 Jupyter、DuckDB 正在读取数据）时，报错改为中文说明被占用的路径和处理办法。替换目录或回滚增量包失败时保留原数据备份，并在报错中给出备份位置。","release_url":"https://github.com/rootSunc/CNEquity/releases/tag/v0.15.0"},{"tag":"v0.14.1","prerelease":false,"published_at":"2026-10-04T22:40:04Z","date":"2026-10-04","zh":null,"body":null,"release_url":"https://github.com/rootSunc/CNEquity/releases/tag/v0.14.1"}]},{"full":"reeden-org/reeden-app","url":"https://github.com/reeden-org/reeden-app","desc":"Reeden 是一款功能强大的纯本地电子书阅读器，支持多种格式，提供丰富的阅读体验和个性化设置。  支持 Windows、Mac、Linux、iOS、Android 平台。","lang":"—","stars":491,"topics":["awz","books","epub","mobi","pdf","reader","reeden","txt"],"cats":["reading"],"primary":"reading","tags":["android","ebook"],"categoryConfidence":"override","tag":"v1.43.1","prerelease":false,"published_at":"2026-10-07T15:22:18Z","date":"2026-10-07","zh":"### ✨ 新闻\n- [AI] AI 助手现可整理图书系列及卷号\n- [AI] 网页搜索现已支持 AnySearch\n- [书架] 封面图库可自定义封面宽高比，书架将自动适配\n- [书架] 可一次性重命名整个系列，同时保留卷号\n- [书架] 在书架上查看书籍所属系列，轻点即可查看整套书籍，并可按系列搜索和排序\n- [书架] 长按“书架”标签页可解锁私有书籍\n- [版式] 英文文本支持字间距调整、连字和小型大写字母，更接近原书样式\n- [版式] 为全文下划线设置自定义颜色\n- [笔记] 选择下划线位于竖排文本的左侧还是右侧；默认位于右侧\n- [笔记] 新增用于 PDF 标注的直线高亮笔，可绘制整洁均匀的标记\n- [Android] [阅读] 在 iReader E-Ink 设备上反转翻页涟漪效果的方向\n- [阅读] 在底部栏添加“简体/繁体”按钮，支持一键切换\n- [阅读] 将同一字体家族的字体文件合并为一个，使用真正的斜体和粗体\n- [阅读] 支持 PDF 图片重排，即使是扫描的书籍也能自动重排以适应屏幕\n- [阅读] 离线词典保留其自身的样式、音频和链接；可管理其文件\n- [阅读] 仅为当前书籍设置翻页动画\n- [替换] 一次性将多条规则应用于本书或所有书籍，并可按本书或所有书籍的规则进行筛选\n- [替换] 在列表中显示其他书籍的替换规则，便于比较\n- [统计] 将同一本书多个版本的阅读记录合并为一个\n- [Android] [TTS] 悬浮字幕可在其他应用上显示正在朗读的句子\n\n### 🐛 修复\n- [Android] [外观] 修复了分享或导出主题时导致主题页面关闭的问题\n- [Android] [外观] 修复在菜单打开时向后滑动会导致离开当前页面或退出应用的问题\n- [外观] 修复主题数量较多时打开主题颜色页面出现卡顿的问题\n- [外观] 修复切换应用主题时会恢复已编辑或已删除的“纯白”阅读主题的问题\n- [外观] 修复切换主题时导致","body":"### ✨ News\n- [AI] The AI assistant can organize book series and volume numbers\n- [AI] Web search now supports A d\n- [Reading] Image reflow for PDFs, so even scanned books rewrap to fit the screen\n- [Reading] Offline dictionaries keep their own style, audio and links; manage their files\n- [Reading] Set a page turn animation for just the current book\n- [Replace] Change multiple rules to this book or all books at once, and filter by this book's or all-book rules\n- [Replace] Show replacement rules from other books in the list for easy comparison\n- [Statistics] Merge reading records from several editions of a book into one\n- [Android] [TTS] Floating subtitles show the sentence being read over other apps\n\n### 🐛 Fixes\n- [Android] [Appearance] Fix sharing or exporting a theme closing the theme page\n- [Android] [Appearance] Fix swiping back with a menu open leaving the page or the app\n- [Appearance] Fix lag when opening the theme color page with many themes\n- [Appearance] Fix switching app themes restoring an edited or deleted Pure White reader theme\n- [Appearance] Fix switching themes changin","release_url":"https://github.com/reeden-org/reeden-app/releases/tag/v1.43.1"},{"tag":"v1.43.1-beta","prerelease":true,"published_at":"2026-10-03T11:20:49Z","date":"2026-10-03","zh":null,"body":null,"release_url":"https://github.com/reeden-org/reeden-app/releases/tag/v1.43.1-beta"},{"tag":"v1.42.1","prerelease":false,"published_at":"2026-10-03T03:21:52Z","date":"2026-10-03","zh":null,"body":null,"release_url":"https://github.com/reeden-org/reeden-app/releases/tag/v1.42.1"}]},{"full":"fw876/helloworld","url":"https://github.com/fw876/helloworld","desc":"","lang":"C","stars":4229,"topics":[],"cats":["network"],"primary":"network","tags":[],"categoryConfidence":"override","tag":"v196.19","prerelease":false,"published_at":"2026-10-07T12:36:03Z","date":"2026-10-07","zh":"# helloworld v196.19\n\n自 v196.18 以来的变更：\n\n- luci-app-ssr-plus：修复了 Xray 解析旧版 SS 订阅的问题 (`16617be`)\n- xray-core：恢复对旧版 VMess alterId 出站支持 (`baf2040`)\n\n软件包：\n- luci-app-ssr-plus\n- xray-core\n- mihomo\n- naiveproxy","b ody":null,"release_url":"https://github.com/Monica-Pass/Monica/releases/tag/preview"},{"tag":"V1.0.319","prerelease":false,"published_at":"2026-10-13T00:28:49Z","date":"2026-10-13","zh":"# Monica for Android 1.0.319\r\n\n## 中文\r\n\n- 新增“附近设备同步”：在同一可互通 Wi-Fi／局域网中扫码或使用链接配对，加密同步本地或受支持的 MDBX 数据库，包含密码、独立验证器、Steam 本地账户、通行密钥、笔记、卡片、文件夹、标签和附件。同步库默认“本地”；Bitwarden／Vaultwarden 与 KeePass 外部库继续使用各自的同步方式。附近同步无需云中转。\r\n- 支持双向、仅发送和仅接收，可选择自动或手动同步。自动同步开关随时可切换，关闭后当前传输正常收尾；配对后也可从主要页面右上角菜单手动同步或查看进度，两端均关闭自动同步时需分别点击。\r\n- 自动同步仅在两端 Monica 均处于前台且已解锁时进行，退到后台后暂停；未发现对方时不反复探测，数据未变化时重新打开不会强制重传。系统仍有少量设备发现报文，服务发现受限时可在两端手动同步。\r\n- 同步前说明通行密钥的跨设备限制，可勾选“不再提醒”，并在诊断中查看限制及恢复提醒。签名计数非零的 Passkey 会跳过；不可导出的系统／硬件密钥仅同步凭据信息，可导出密钥在接收端重新加密保存。跨端使用需双方安装兼容版本。\r\n- 提供同步进度、连接诊断和失败处理建议；校验及保存完成后才确认成功，离线冲突保留副本。\r\n\n- 移除喵喵语、芝士雪豹语和雪豹彩蛋图标，原始语言与图标资源归档至“彩蛋语言备份”；旧语言设置自动恢复简体中文，保留升级后的正常桌面入口。\r\n\n- 修复 MDBX 格式检查遇到损坏数据库时的错误分类，并禁止 Android 默认损坏处理器删除原文件，保留后续恢复所需的数据。\r\n\n- Steam 筛选复用密码与通行密钥页面的数据库／文件夹菜单，支持本地分类、MDBX 文件夹、KeePass 分组及 Bitwarden／Vaultwarden 文件夹；记住所选文件夹，并可与搜索组合。切换同库文件夹不重复加载或同步账户，共用菜单支持从 MDBX 子文件夹逐级返回。\r\n\n- Passkey 和 Steam 支持选择数据库内的文件夹进行移动或复制，也可在当前数据库中整理归属；修复 Passkey 目标选择器未加载 MDBX 文件夹的问题。\r\n- Passkey 复制保留源记录；操作前检查绑定、引用、私钥及目标限制，遇到无法处理的条目可取消或跳过后继续，并显示逐项结果。要求凭据 ID 唯一的 KeePass／MDBX 不支持同库复制，可改选其他数据库。\r\n- Steam 复制生成独立条目，同库移动保留原记录；新增本地分类归属并迁移旧数据，修复 MDBX 后续编辑或刷新会话时回到根目录的问题。跨库移动在目标写入成功后才清理源记录。\r\n\n- 修复通行密钥本地数据库页面反复出现同步状态：按当前数据库和文件夹范围触发刷新，跳过无目标、无法读取或已更新的 KeePass 索引；本地页面不再显示其他 Bitwarden／Vaultwarden 账户的同步进度。\r\n- 缓存通行密钥的“密钥不可用”“跨端受限”等标记，返回列表或打开详情时立即复用检查结果；密钥删除、恢复、兼容性参数或解锁会话变化后重新检查，减少重复加载与标记闪烁。\r\n\n- 修复通行密钥列表进入详情后返回会重置为“全部”的问题：保留所选数据库及文件夹，重新打开后恢复上次选择，避免页面重建时用默认值覆盖筛选设置。\r\n\n- 修复旧 Passkey 在刷新或合并时可能改变已使用的备份资格标志：保留既有凭据的注册属性，冲突时保留原数据；新导入仍遵循来源标志。\r\n- 修复修改 Bitwarden／Vaultwarden Passkey 时可能覆盖同一登录项中的其他密钥、密码、网址和自定义字段；更新前读取完整条目，使用版本校验并回读确认，失败或冲突时保留本地数据；保留用户主动移动文件夹和移回根目录的操作。\r\n- 通行密钥列表在格式旁标记“仅本地”“跨端受限”或“密钥不可用”，详情解释限制原因；支持小屏及大字体换行。\r\n\n- 修复仅绑定 Bitwarden／Vaultwarden 时密码库首页和搜索可能看不到已同步条目：未保存数据库范围时默认显示“全部”，旧版省略范围的设置同步采用该默认值；明确保存的本地库或具体数据库选择继续保留，锁定库仍不参与展示与搜索。","body":"## English\r\n\n- Added Nearby device sync: pair by QR code or link on the same reachable Wi-Fi/LAN to securely sync Local or supported MDBX vaults, including passwords, standalone authenticators, local Steam accounts, Passkeys, notes, cards, folders, tags and attachments. The default sync database is Local; external Bitwarden/Vaultwarden and KeePass vaults keep their own sync mechanisms. Nearby sync needs no cloud relay.\r\n- Choose bidirectional, send-only or receive-only transfers, with automatic or manual sync. The automatic toggle works at any time; switching it off lets the current transfer finish. After pairing, main-page menus offer manual sync and progress access. When automatic sync is off on both devices, start a manual round on each.\r\n- Automatic sync runs while both Monica apps are visible and unlocked, pausing in the background. Unavailable peers are not repeatedly probed, and reopening unchanged data does not force a resend. Small system discovery messages remain; use manual sync on both devices if service discovery is restricted.\r\n- Passkey review explains cross-device restrictions, offers a persistent “Don’t show again” choice and lets you inspect limits or restore reminders in diagnostics. Passkeys with nonzero signature counters are skipped. Non-exportable system/hardware keys sync credential metadata only; exportable keys are encrypted again on receipt. Both devices need compatible app versions.\r\n- View sync progress, connection diagnostics and failure guidance. Success is confirmed after validation and saving; offline conflicts retain copies.\r\n\n- Removed the Nya and Snow Leopard Easter egg languages and Snow Leopard icon. Original resources are archived in “彩蛋语言备份”; existing selections migrate to Simplified Chinese while preserving a working launcher entry.\r\n\n- Fixed MDBX format checks misclassifying corrupt databases and prevented Android's default corruption handler from deleting the original file, preserving it for recovery.\r\n\n- Steam now shares t","release_url":"https://github.com/Monica-Pass/Monica/releases/tag/V1.0.319"},{"tag":"V1.0.318","prerelease":false,"published_at":"2026-10-08T11:22:51Z","date":"2026-10-08","zh":"# Monica for Android 1.0.318\r\n\n> 未发布 / Unreleased\r\n\n## 中文\r\n\n- 扩展常用信息输入建议：银行卡持卡人、证件及账单姓名共享已保存姓名，姓、名和中间名分别匹配；账单和证件地址支持街道、门牌、省市、邮编及国家建议，兼容独立卡包、密码内嵌内容及旧字段。保留签发机关建议，点击仅填写当前字段，不自动拆分姓名或修改其他资料。\r\n\n- 修复 KDBX 密码批量删除缓慢及条目重新出现：密码页与密码库页统一按数据库一次保存，成功后整体更新列表；原生索引在后台以事务提交，拒绝过期快照。保存失败保留列表数据，不再逐条重试；外部文件完整写入后若校验失败，保留当前文件与恢复副本，避免覆盖另一会话的写入。\r\n\n- 改善安全存储启动容错：未分类的读取异常在后台最多尝试三次，减少短暂失败直接进入保护页的情况；持续失败、密钥缺失及认证错误仍保留原数据并阻止正常启动。诊断补充失败阶段、尝试次数及异常类型，不包含密码、密钥或异常原文。\r\n\n- 卡包的银行卡和证件编辑统一使用 M3E 内容卡片：新增内容以紧凑卡片展示，支持长按拖动及菜单排序，顺序随条目保存；扩展字段、自定义字段和账单地址改用相连的填充式编辑，缩小间距并适配键盘与大字体。隐藏字段使用密码键盘。\r\n\n- 自动填充新增“保持解锁两分钟”设置，默认关闭；开启后同一应用及网站可复用验证，支持账号与密码分步填写及手动选择，连续填充不延长有效期。关闭此项、锁屏、手动锁定、移除 Monica 最近任务或进程重启均撤销临时授权。修复主应用清理后台后仍可恢复旧解锁会话的问题，自动填充操作不再延长主应用解锁时间；普通切换应用仍遵循自动锁定设置。\r\n\n- 新增常用信息输入建议：银行名称、分行代码、客服电话、凭据分组标签、网站网址及证件签发机关可匹配已保存的同类值，点击即可填入；支持项目内嵌银行卡和证件，最多显示三项，锁定或不可访问的数据源不参与建议。\r\n\n- 修复从其他应用接收 Passkey 时对空扩展和未启用支付扩展的过度拒绝，保留原始凭据及私钥；按验证码、无效数据、私钥及不支持的扩展显示跳过原因，诊断日志仅记录分类计数。含 PRF、Blob 或启用支付扩展的 Passkey 仍明确提示暂不支持，不丢弃扩展强行导入。\r\n\n- 修复导入条目中应用关联元数据被显示为普通自定义字段的问题；保留签名约束及再次导出能力，编辑或移除普通字段分组不会删除这些关联信息。\r\n\n- 优化去重合并到 Monica 本地：无附件的密码与无附件、无照片的安全条目按小批次事务写入，减少完整列表反复查询；进度在提交后更新，失败批次回滚并逐条定位，取消时停止后续处理。保留附件、MDBX 与 Passkey 的原有写入和回滚流程，减少重复分析读取及无附件条目的空查询。\r\n\n- 优化设置中的清空数据：按批次删除，减少逐条写库与列表刷新；显示当前阶段和实际已清空数量，完成或失败时保留结果提示，防止重复确认，并在页面重建后继续显示进度。保留原有类型选择及删除范围。\r\n\n- Monica CLI 同样暂不接入 Glitter：不创建、打开、编辑、导出或同步该档位，仅保留只读格式识别；即使提供正确密码和密钥也不会放行，原有数据库不变。","body":"## English\r\n\n- Extend saved-value suggestions to cardholder, identity and billing names, with separate first/middle/last-name matching. Suggest street, unit, city, region, postal code and country across wallet items, embedded content and legacy fields. Keep issuing-authority suggestions; selection fills only the active field without splitting names or changing other details.\r\n\n- Fix slow KDBX password bulk deletion and reappearing entries. Both password and vault pages save each database once and update the list after success. Apply native indexes in background transactions and reject stale snapshots. Preserve list data on save failure without per-entry retries; if verification fails after a complete external write, retain the current file and recovery copy instead of overwriting another session's changes.\r\n\n- Improve secure-storage startup handling: retry unclassified read failures up to three times in the background before showing the recovery screen. Persistent failures, missing keys and authentication errors still preserve stored data and block normal startup. Diagnostics now include the failure phase, attempt count and exception types without passwords, keys or exception messages.\r\n\n- Unify bank-card and identity-document editing with compact M3E content cards. Reorder added sections by long press or menu and save their order with the entry. Use connected filled editors for supplemental fields, custom fields and billing addresses, with tighter spacing and keyboard/large-text support. Hidden fields use password keyboards.\r\n\n- Add an optional “Keep unlocked for two minutes” autofill setting, off by default. When enabled, verification is reused within the same app and website across separate username/password steps and the manual picker, without extending the window. Turning it off, screen-off, explicit locking, removing Monica from Recents or restarting the process revokes access. Fix old main-app sessions being restored after task removal; autofill interaction n","release_url":"https://github.com/Monica-Pass/Monica/releases/tag/V1.0.318"}]},{"full":"wink-wink-wink555/MarkiNote","url":"https://github.com/wink-wink-wink555/MarkiNote","desc":"An AI Agent-powered Markdown Document Management & Reading System. The AI Agent understands your intent and autonomously","lang":"Python","stars":106,"topics":["ai-agent","ai-power function ago(ts){if(!ts)return "";var s=Math.floor((Date.now()-new Date(ts).getTime())/1000);if(s<0)return "刚刚";if(s<3600)return Math.floor(s/60)+" 分钟前";if(s<86400)return Math.floor(s/3600)+" 小时前";if(s<86400*30)return Math.floor(s/86400)+" 天前";if(s<86400*365)return Math.floor(s/86400/30)+" 个月前";return Math.floor(s/86400/365)+" 年前";}
function sectionOf(r){if(!r.published_at)return 3;var d=(Date.now()-new Date(r.published_at).getTime())/86400000;if(d<1)return 0;if(d<=7)return 1;if(d<=30)return 2;return 3;}
function isRuleSet(full,desc){var n=String(full||"").toLowerCase().split("/")[1]||"";if(/(^|[-_ ])rules?([-_ ]|$)/.test(n))return true;return /规则集|rule.?set/i.test(desc||"");}
function badge(r){if(r.isCommit||!r.tag)return "<span class=\"badge commit\">📝 仅提交</span>";if(isRuleSet(r.full,r.desc))return "<span class=\"badge ruleset\">📦 规则集</span>";return r.prerelease?"<span class=\"badge beta\">🧪 测试版</span>":"<span class=\"badge stable\">✅ 正式版</span>";}
function typeOf(r){if(!r.tag)return "commit";if(isRuleSet(r.full,r.desc))return "ruleset";return r.prerelease?"beta":"stable";}
function statsHtml(){var s=DATA.stats;if(!s)return "";function line(icon,name,o){return "<div class=\"stat\">"+icon+" "+name+"：<b>"+o.rel+"</b> 个版本更新（"+o.stable+" 正式 / "+o.beta+" 测试）</div>";}
return line("⚡","今日",s.today)+line("🔥","7 天内",s.week);}
function freshCard(r){var h="<div class=\"card\"><h3><a href=\""+r.url+"\" target=\"_blank\" rel=\"noopener\">"+esc(r.full)+"</a></h3>";h+="<div>"+badge(r)+(r.tag?" <span class=\"badge\">"+esc(r.tag)+"</span>":"")++"</div>";h+="<div class=\"rowmeta\">"+esc(r.date)+"（"+ago(r.published_at)+"） · <a href=\""+r.release_url+"\" target=\"_blank\" rel=\"noopener\">查看 Release</a></div>";if(r.zh){h+="<div class=\"zh\">"+esc(r.zh)+"</div>";if(r.body){h+="<details><summary>查看原文</summary><pre>"+esc(r.body)+"</pre></details>";}}else if(r.body){h+="<div class=\"zh\">"+esc(r.body)+"</div>";}else{h+="<div class=\"rowmeta\">（无文字更新说明，详见 Release）</div>";}return h+"</div>";}
function fmtDT(ts){if(!ts)return "—";var d=new Date(new Date(ts).getTime()+8*3600*1000);function p(n){return (n<10?"0":"")+n;}return d.getUTCFullYear()+"-"+p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate())+" · "+p(d.getUTCHours())+":"+p(d.getUTCMinutes());}
function tlItem(r){var dot=r.tag?(r.prerelease?"beta":"stable"):"commit";
var h="<div class=\"titem\"><span class=\"dot "+dot+"\"></span><div class=\"tbody\">";
h+="<div class=\"thead\"><a href=\""+r.url+"\" target=\"_blank\" rel=\"noopener\">"+esc(r.full)+"</a></div>";
h+="<div class=\"rowmeta\">"+badge(r)+(r.tag?"<span class=\"badge\">"+esc(r.tag)+"</span>":"")+(r.release_url?" <a href=\""+r.release_url+"\" target=\"_blank\" rel=\"noopener\">查看 Release</a>":"")+"</div>";h+="<div class=\"rowmeta\">"+esc(fmtDT(r.published_at))+" · ⭐ "+(r.stars||0)+"</div>";
if(r.desc){h+="<div class=\"rowmeta desc\">"+esc(r.desc)+"</div>";}
if(r.zh){h+="<details class=\"relsum\"><summary>更新内容摘要</summary><div class=\"zh\">"+esc(r.zh)+"</div>";if(r.body){h+="<details><summary>查看原文</summary><pre>"+esc(r.body)+"</pre></details>";}h+="</details>";}
else if(r.body){h+="<details class=\"relsum\"><summary>更新内容</summary><div class=\"zh\">"+esc(r.body)+"</div></details>";}
return h+"</div></div>";}
var _fCats=new Set(["ai","network","system","efficiency","social","finance"]);var _allCats=["ai","network","system","dev","efficiency","knowledge","reading","media","social","finance","rules","data","security","learning","other"];function matchFilters(r){var q=document.getElementById("q").value.toLowerCase();function catMatch(r){var cs=r.cats||["other"];for(var i=0;i<cs.length;i++){if(_fCats.has(cs[i]))return true;}return false;}
return (!q||r.full.toLowerCase().indexOf(q)>=0||(r.desc||"").toLowerCase().indexOf(q)>=0)&&(_fCats.size===0||catMatch(r));}
function flatReleases(){var out=[],ri,r,rels,i,rel;for(ri=0;ri<DATA.all.length;ri++){r=DATA.all[ri];rels=(r.releases&&r.releases.length)?r.releases:null;if(rels){for(i=0;i<rels.length;i++){rel=rels[i];out.push({full:r.full,url:r.url,desc:r.desc,lang:r.lang,stars:r.stars,cats:r.cats,primary:r.primary,tags:r.tags,tag:rel.tag,prerelease:rel.prerelease,published_at:rel.published_at,date:rel.date,zh:rel.zh,body:rel.body,release_url:rel.release_url});}}else{out.push(r);}}return out;}
function renderAll(){var list=flatReleases().filter(matchFilters);var box=document.getElementById("all");var h="",i;list.sort(function(a,b){var x=a.published_at||"",y=b.published_at||"";return x<y?1:(x>y?-1:0);});var groups=[[],[],[],[]];for(i=0;i<list.length;i++){groups[sectionOf(list[i])].push(list[i]);}for(i=0;i<4;i++){if(!groups[i].length)continue;h+="<details class=\"group\""+(i===0?" open":"")+"><summary>"+SECTIONS[i].icon+" "+SECTIONS[i].name+"（"+groups[i].length+"）</summary>";h+="<div class=\"timeline\">"+groups[i].map(tlItem).join("")+"</div></details>";}if(!list.length){h="<div class=\"empty\">没有匹配的项目</div>";}box.innerHTML=h;document.getElementById("allCount").textContent="（"+list.length+" 个版本 / "+DATA.all.length+" 个项目"+"）";}
(function(){document.getElementById("meta").textContent="共 "+DATA.all.length+" 个项目 · 生成于 "+DATA.generatedAt+" · 每 3 小时自动更新";document.getElementById("stats").innerHTML=statsHtml();var fh="";for(i=0;i<DATA.fresh.length;i++){fh+=freshCard(DATA.fresh[i]);}document.getElementById("fresh").innerHTML=fh||"<div class=\"empty\">本轮无新增</div>";document.getElementById("freshCount").textContent=DATA.fresh.length?"（"+DATA.fresh.length+"）":"";if(!DATA.fresh.length){document.getElementById("freshSec").style.display="none";}renderAll();document.getElementById("q").addEventListener("input",renderAll);document.getElementById("fCatPills").addEventListener("click",function(e){var b=e.target.closest(".pill");if(!b)return;var v=b.getAttribute("data-v");if(v===""){_fCats=new Set(_allCats);}else{if(_fCats.has(v))_fCats.delete(v);else _fCats.add(v);}var ps=this.querySelectorAll(".pill");for(var i=0;i<ps.length;i++){var pv=ps[i].getAttribute("data-v");ps[i].classList.toggle("active",pv===""?_fCats.size===_allCats.length:_fCats.has(pv));}renderAll();});})();
</script>
</body>
