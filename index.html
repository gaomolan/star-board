-10-13","zh":"- 新增中文 / English 界面语言选择功能，支持跟随 Obsidian 的界面语言设置\n- 新增「编辑选中节点」命令；创建下级节点、创建同级节点以及编辑节点的快捷键均可自定义，默认快捷键分别为 Tab、Enter 和 Space","body":"- 新增中文 / English 界面语言选择，支持跟随 Obsidian 的界面语言\n- 新增「编辑选中节点」命令；创建下级、创建同级和编辑节点的快捷键均可自定义，默认分别为 Tab、Enter 和 Space","release_url":"https://github.com/joeytoday/obsidian-canvas-enhance/releases/tag/1.0.7"},{"tag":"1.0.6","prerelease":false,"published_at":"2026-09-20T09:28:35Z","date":"2026-09-20","zh":null,"body":null,"release_url":"https://github.com/joeytoday/obsidian-canvas-enhance/releases/tag/1.0.6"}]},{"full":"dukangalex/HiClash","url":"https://github.com/dukangalex/HiClash","desc":"Mihomo（Clash Meta）覆写脚本和配置文件，无DNS泄露，内置多项分流策略、地区策略，实现全局排除节点、自动识别节点倍率功能，解决机场使用私有DNS导致无法解析节点域名的问题，支持多项自定义配置","lang":"JavaScript","stars":5,"topics":[],"cats":["network"],"primary":"network","tags":["proxy"],"categoryConfidence":"rule","tag":null,"prerelease":false,"published_at":"2026-10-13T07:33:10Z","date":"2026-10-13","zh":null,"body":null,"release_url":null,"releases":[]},{"full":"7723mod/NPatch","url":"https://github.com/7723mod/NPatch","desc":"NPatch是一个复刻自LSPatch，以LSPosed为基础的免root的Xposed框架","lang":"Kotlin","stars":2503,"topics":["lspatch","rootless","xposed"],"cats":["system"],"primary":"system","tags":["android"],"categoryConfidence":"override","tag":"v1.0.9","prerelease":false,"published_at":"2026-10-12T12:22:42Z","date":"2026-10-12","zh":"## 英文\n\n### 加载器与签名绕过功能\n\n- **崩溃修复**：修复了启动时出现的无效 JNI 本地引用导致的崩溃问题（#139）；在 SECCOMP 模式下跳过原生的 `openat` 重定向操作，以避免重复重写；现在“HIGH”级别也采用了 360 防护兼容回退机制。\n- **管理器未运行时也能启动**：当管理器未运行的情况下，加载器仅需等待 800 毫秒即可从本地快照中启动，而无需像以前那样等待 2 秒才能完成绑定。超时后，加载器会向 ConfigProvider 请求最新的模块范围信息，这样新增或移除的模块无需等待下次启动即可生效。即便查询失败，也不会覆盖原有的快照数据。\n- **EXTREME 级别的 `svc` 指令插桩**：现在可对手动编写的内联 `svc #0` 系统调用进行插桩处理（这类调用常被打包工具及反作弊程序用来绕过 libc 钩子）。该功能仅适用于 arm64 架构，且需手动开启。\n- **崩溃日志桥接功能**：恢复了模块与核心组件的崩溃日志功能；借助 Shizuku，诊断导出功能还能捕获 logcat 日志。\n\n### 管理器修复\n\n- 修复了在受限环境下模块扫描结果可能丢失的问题，该问题曾导致已配置的模块被清除。\n- 重新启用了 Companion 激活推送功能以及不依赖 Shizuku 的双通道推送机制。\n- 修复了打包多个选中的 APK 时出现白屏的现象；现在针对多个基础 APK 文件会提供选择菜单。\n\n### 管理器界面：Miuix\n\n- **Miuix 0.9.4**：管理器的用户界面已从 COUI 切换至稳定的 Miuix 0.9.4 组件库；导航功能也迁移至 `miuix-nav`，从而确保滑动返回操作流畅且统一。\n- **应用详情页**：在“管理”界面点击某个应用后，会打开专门的详情页。该页面按状态、操作、系统相关信息及危险操作分类展示内容，从而取代了原先在小屏幕上显示不全的弹出菜单。加载器版本、模块数量以及签名绕过级别等信息也会直接显示在该页面上。\n- **对话框与背景优化**：现在对话框按钮在较长语言文本环境下也不会出现排版错乱的情况；次级页面采用了纯色背景，这样自定义的背景图片也不会再透出。\n- **常驻通知功能**：新增可选的常驻通知及开机自启功能，确保相关服务持续运行。","body":"## English\n\n###  Loader & Signature Bypass\n\n- **Crash Fixes**: Fixed an invalid JNI local reference crash on launch (#139); skip the native `openat` redirect in SECCOMP mode to avoid double rewriting; HIGH level now shares the 360-protection compatibility fallback.\n- **Start with Manager Closed**: When the Manager is not running, the loader starts from the local snapshot after waiting only 800 ms instead of stalling on a 2 s bind. On timeout it asks ConfigProvider for the latest module scope, so added/removed modules take effect without waiting for the next launch. A failed query no longer overwrites the snapshot.\n- **EXTREME Level `svc` Instrumentation**: Hand-written inline `svc #0` syscalls (used by packers and anti-cheat to bypass libc hooks) are now covered, arm64 only and opt-in.\n- **Crash Log Bridge**: Module and core crash logs are restored, and diagnostic export can capture logcat through Shizuku.\n\n###  Manager Fixes\n\n- Fixed module scan results being lost in restricted environments, which could wipe configured modules.\n- Restored Companion activation push and Shizuku-independent dual-track push.\n- Fixed a white screen when packaging multiple selected APKs; multiple base APKs now offer a selection menu.\n\n###  Manager UI: Miuix\n\n- **Miuix 0.9.4**: The Manager UI moves from COUI to the stable Miuix 0.9.4 component library, with navigation migrated to miuix-nav so swipe-back is smooth and consistent.\n- **App Detail Page**: Tapping an app in Manage now opens a dedicated detail page grouped by status / actions / system / danger zone, replacing the popup menu that got clipped on small screens. Loader version, module count and signature bypass level are shown right on the page.\n- **Dialog & Background Polish**: Dialog buttons no longer break awkwardly in longer languages, and secondary pages use a solid background so a custom background image no longer bleeds through.\n- **Keep-alive Notification**: Optional persistent notification and start-on-boot support to keep","release_url":"https://github.com/7723mod/NPatch/releases/tag/v1.0.9","releases":[{"tag":"v1.0.9","prerelease":false,"published_at":"2026-10-12T12:22:42Z","date":"2026-10-12","zh":"## 英文\n\n### 加载器与签名绕过功能\n\n- **崩溃修复**：修复了启动时出现的无效 JNI 本地引用导致的崩溃问题（#139）；在 SECCOMP 模式下跳过原生的 `openat` 重定向操作，以避免重复重写；现在“HIGH”级别也采用了 360 防护兼容回退机制。\n- **管理器未运行时也能启动**：当管理器未运行的情况下，加载器仅需等待 800 毫秒即可从本地快照中启动，而无需像以前那样等待 2 秒才能完成绑定。超时后，加载器会向 ConfigProvider 请求最新的模块范围信息，这样新增或移除的模块无需等待下次启动即可生效。即便查询失败，也不会覆盖原有的快照数据。\n- **EXTREME 级别的 `svc` 指令插桩**：现在可对手动编写的内联 `svc #0` 系统调用进行插桩处理（这类调用常被打包工具及反作弊程序用来绕过 libc 钩子）。该功能仅适用于 arm64 架构，且需手动开启。\n- **崩溃日志桥接功能**：恢复了模块与核心组件的崩溃日志功能；借助 Shizuku，诊断导出功能还能捕获 logcat 日志。\n\n### 管理器修复\n\n- 修复了在受限环境下模块扫描结果可能丢失的问题，该问题曾导致已配置的模块被清除。\n- 重新启用了 Companion 激活推送功能以及不依赖 Shizuku 的双通道推送机制。\n- 修复了打包多个选中的 APK 时出现白屏的现象；现在针对多个基础 APK 文件会提供选择菜单。\n\n### 管理器界面：Miuix\n\n- **Miuix 0.9.4**：管理器的用户界面已从 COUI 切换至稳定的 Miuix 0.9.4 组件库；导航功能也迁移至 `miuix-nav`，从而确保滑动返回操作流畅且统一。\n- **应用详情页**：在“管理”界面点击某个应用后，会打开专门的详情页。该页面按状态、操作、系统相关信息及危险操作分类展示内容，从而取代了原先在小屏幕上显示不全的弹出菜单。加载器版本、模块数量以及签名绕过级别等信息也会直接显示在该页面上。\n- **对话框与背景优化**：现在对话框按钮在较长语言文本环境下也不会出现排版错乱的情况；次级页面采用了纯色背景，这样自定义的背景图片也不会再透出。\n- **常驻通知功能**：新增可选的常驻通知及开机自启功能，确保相关服务持续运行。","body":"## English\n\n###  Loader & Signature Bypass\n\n- **Crash Fixes**: Fixed an invalid JNI local reference crash on launch (#139); skip the native `openat` redirect in SECCOMP mode to avoid double rewriting; HIGH level now shares the 360-protection compatibility fallback.\n- **Start with Manager Closed**: When the Manager is not running, the loader starts from the local snapshot after waiting only 800 ms instead of stalling on a 2 s bind. On timeout it asks ConfigProvider for the latest module scope, so added/removed modules take effect without waiting for the next launch. A failed query no longer overwrites the snapshot.\n- **EXTREME Level `svc` Instrumentation**: Hand-written inline `svc #0` syscalls (used by packers and anti-cheat to bypass libc hooks) are now covered, arm64 only and opt-in.\n- **Crash Log Bridge**: Module and core crash logs are restored, and diagnostic export can capture logcat through Shizuku.\n\n###  Manager Fixes\n\n- Fixed module scan results being lost in restricted environments, which could wipe configured modules.\n- Restored Companion activation push and Shizuku-independent dual-track push.\n- Fixed a white screen when packaging multiple selected APKs; multiple base APKs now offer a selection menu.\n\n###  Manager UI: Miuix\n\n- **Miuix 0.9.4**: The Manager UI moves from COUI to the stable Miuix 0.9.4 component library, with navigation migrated to miuix-nav so swipe-back is smooth and consistent.\n- **App Detail Page**: Tapping an app in Manage now opens a dedicated detail page grouped by status / actions / system / danger zone, replacing the popup menu that got clipped on small screens. Loader version, module count and signature bypass level are shown right on the page.\n- **Dialog & Background Polish**: Dialog buttons no longer break awkwardly in longer languages, and secondary pages use a solid background so a custom background image no longer bleeds through.\n- **Keep-alive Notification**: Optional persistent notification and start-on-boot support to keep","release_url":"https://github.com/7723mod/NPatch/releases/tag/v1.0.9"},{"tag":"v1.0.8","prerelease":false,"published_at":"2026-09-27T08:23:19Z","date":"2026-09-27","zh":null,"body":null,"release_url":"https://github.com/7723mod/NPatch/releases/tag/v1.0.8"},{"tag":"Canary-762","prerelease":true,"published_at":"2026-08-21T07:29:00Z","date":"2026-08-21","zh":null,"body":null,"release_url":"https://github.com/7723mod/NPatch/releases/tag/Canary-762"}]},{"full":"x554960766/wechat-mp-tools","url":"https://github.com/x554960766/wechat-mp-tools","desc":"微信公众号采集、视频号高清视频解析、抖音全能下载、小红书下载、快手、B站批量下载","lang":"Python","stars":199,"topics":[],"cats":["data"],"primary":"data","tags":["wechat"],"categoryConfidence":"rule","tag":"v2.2.0","prerelease":false,"published_at":"2026-10-12T12:00:22Z","date":"2026-10-12","zh":"**完整更新日志**：https://github.com/x554960766/wechat-mp-tools/compare/v2.1.0...v2.2.0","body":"Release v2.2.0","release_url":"https://github.com/x554960766/wechat-mp-tools/releases/tag/v2.2.0","releases":[{"tag":"v2.2.0","prerelease":false,"published_at":"2026-10-12T12:00:22Z","date":"2026-10-12","zh":"**完整更新日志**：https://github.com/x554960766/wechat-mp-tools/compare/v2.1.0...v2.2.0","body":"Release v2.2.0","release_url":"https://github.com/x554960766/wechat-mp-tools/releases/tag/v2.2.0"},{"tag":"v2.1.0","prerelease":false,"published_at":"2026-10-10T05:47:01Z","date":"2026-10-10","zh":"发布 v2.1.0：微信公众号模块的轻量重构及抖音接口优化","body":"Release v2.1.0: 微信公众号模块轻量重构与抖音接口优化","release_url":"https://github.com/x554960766/wechat-mp-tools/releases/tag/v2.1.0"},{"tag":"v2.0.9","prerelease":false,"published_at":"2026-09-29T10:12:47Z","date":"2026-09-29","zh":null,"body":null,"release_url":"https://github.com/x554960766/wechat-mp-tools/releases/tag/v2.0.9"}]},{"full":"1zumiii/AppOpsNext","url":"https://github.com/1zumiii/AppOpsNext","desc":"Modern Android 15+ AppOps manager powered by Shizuku.","lang":"Kotlin","stars":70,"topics":[],"cats":["system"],"primary":"system","tags":["android"],"categoryConfidence":"override","tag":"v1.6.5-beta2","prerelease":true,"published_at":"2026-10-12T11:51:58Z","date":"2026-10-12","zh":"## 简体中文\r\n\n本测试版基于 1.6.5-beta1，主要改进多选、批量操作、刷新和访问监测的交互，并修复若干问题。本版本支持覆盖安装 1.6.0 和 1.6.5-beta1。\r\n\n### 新增与改进\r\n\n- 批量操作确认时显示目标模式和待修改项目清单。清单较长时默认折叠，可展开查看。\r\n- 批量操作结果新增“仅失败”筛选。失败项显示简短原因，可展开查看细节。\r\n- 模板“管理权限”、权限历史“选择要查看的权限”和访问监测的监测点列表中，已选项目优先显示，其余项目保持原有顺序。列表打开期间，勾选或取消选择不会改变排列顺序。\r\n- 模板“管理权限”显示已选数量，搜索无结果时显示提示，入口移至规则列表上方。\r\n- 应用页和“权限变更监听者”页面支持下拉刷新。监听者页面的说明移至信息按钮。\r\n- 搜索框新增清空按钮。权限历史的应用筛选支持按应用名和包名搜索。\r\n- 监测记录支持按应用和权限筛选，可与允许、拒绝筛选组合使用。\r\n- “按权限查看”中，模式为“忽略”的项目补充显示对应运行时权限的授权状态。\r\n- 优化部分 Android 16 设备上的权限修改流程。同一应用的同一项权限在确认需要兼容处理后，后续修改优先使用该方式，减少重复失败的尝试。\r\n\n### 修复\r\n\n- 修复 beta1 中权限详情页从后台返回时不刷新的问题。\r\n- 修复取消批量操作确认后已选项目被清空的问题。\r\n- 修复屏幕旋转后已选项目丢失的问题。\r\n- 没有权限规则的模板不再允许套用，并显示提示。\r\n- 修复监听者数据较多时“权限变更监听者”页面无法加载的问题。\r\n- 修复访问监测的应用搜索无结果时页面空白的问题。","body":"## English\r\n\nThis beta is based on 1.6.5-beta1. It improves interaction in multi-select, batch operations, refreshing and the access monitor, and fixes several issues. It can be installed over 1.6.0 and 1.6.5-beta1.\r\n\n### New and improved\r\n\n- Batch confirmations now show the target mode and the list of items to change. Long lists are collapsed by default and can be expanded.\r\n- Batch results add a Failures only filter. Failed items show a short reason, with details available on expansion.\r\n- Template Manage permissions, Choose permissions to show in Permission history, and the monitoring points list in Access monitor now show selected items first, with the rest in their original order. Checking or unchecking items while the list is open does not change the order.\r\n- Template Manage permissions shows the selected count and a message when a search has no results. Its entry moved above the rules list.\r\n- The Apps page and the Permission change listeners page support pull to refresh. The listeners page explanation moved behind the info button.\r\n- Search fields have a clear button. The app filter in Permission history supports searching by app name and package name.\r\n- Monitor log can be filtered by app and permission, in combination with the allowed and denied filters.\r\n- In the By permission view, items in Ignore mode also show whether the corresponding runtime permission is granted.\r\n- Improved permission changes on some Android 16 devices. Once a permission of an app is confirmed to need compatibility handling, later changes to the same permission of that app use that method first, avoiding repeated failed attempts.\r\n\n### Fixed\r\n\n- Fixed permission details not refreshing when returning from the background, introduced in beta1.\r\n- Fixed selections being cleared after cancelling a batch confirmation.\r\n- Fixed selections being lost after rotating the screen.\r\n- Templates without permission rules can no longer be applied and show a notice instead.\r\n- Fixed the Permission","release_url":"https://github.com/1zumiii/AppOpsNext/releases/tag/v1.6.5-beta2","releases":[{"tag":"v1.6.5-beta2","prerelease":true,"published_at":"2026-10-12T11:51:58Z","date":"2026-10-12","zh":"## 简体中文\r\n\n本测试版基于 1.6.5-beta1，主要改进多选、批量操作、刷新和访问监测的交互，并修复若干问题。本版本支持覆盖安装 1.6.0 和 1.6.5-beta1。\r\n\n### 新增与改进\r\n\n- 批量操作确认时显示目标模式和待修改项目清单。清单较长时默认折叠，可展开查看。\r\n- 批量操作结果新增“仅失败”筛选。失败项显示简短原因，可展开查看细节。\r\n- 模板“管理权限”、权限历史“选择要查看的权限”和访问监测的监测点列表中，已选项目优先显示，其余项目保持原有顺序。列表打开期间，勾选或取消选择不会改变排列顺序。\r\n- 模板“管理权限”显示已选数量，搜索无结果时显示提示，入口移至规则列表上方。\r\n- 应用页和“权限变更监听者”页面支持下拉刷新。监听者页面的说明移至信息按钮。\r\n- 搜索框新增清空按钮。权限历史的应用筛选支持按应用名和包名搜索。\r\n- 监测记录支持按应用和权限筛选，可与允许、拒绝筛选组合使用。\r\n- “按权限查看”中，模式为“忽略”的项目补充显示对应运行时权限的授权状态。\r\n- 优化部分 Android 16 设备上的权限修改流程。同一应用的同一项权限在确认需要兼容处理后，后续修改优先使用该方式，减少重复失败的尝试。\r\n\n### 修复\r\n\n- 修复 beta1 中权限详情页从后台返回时不刷新的问题。\r\n- 修复取消批量操作确认后已选项目被清空的问题。\r\n- 修复屏幕旋转后已选项目丢失的问题。\r\n- 没有权限规则的模板不再允许套用，并显示提示。\r\n- 修复监听者数据较多时“权限变更监听者”页面无法加载的问题。\r\n- 修复访问监测的应用搜索无结果时页面空白的问题。","body":"## English\r\n\nThis beta is based on 1.6.5-beta1. It improves interaction in multi-select, batch operations, refreshing and the access monitor, and fixes several issues. It can be installed over 1.6.0 and 1.6.5-beta1.\r\n\n### New and improved\r\n\n- Batch confirmations now show the target mode and the list of items to change. Long lists are collapsed by default and can be expanded.\r\n- Batch results add a Failures only filter. Failed items show a short reason, with details available on expansion.\r\n- Template Manage permissions, Choose permissions to show in Permission history, and the monitoring points list in Access monitor now show selected items first, with the rest in their original order. Checking or unchecking items while the list is open does not change the order.\r\n- Template Manage permissions shows the selected count and a message when a search has no results. Its entry moved above the rules list.\r\n- The Apps page and the Permission change listeners page support pull to refresh. The listeners page explanation moved behind the info button.\r\n- Search fields have a clear button. The app filter in Permission history supports searching by app name and package name.\r\n- Monitor log can be filtered by app and permission, in combination with the allowed and denied filters.\r\n- In the By permission view, items in Ignore mode also show whether the corresponding runtime permission is granted.\r\n- Improved permission changes on some Android 16 devices. Once a permission of an app is confirmed to need compatibility handling, later changes to the same permission of that app use that method first, avoiding repeated failed attempts.\r\n\n### Fixed\r\n\n- Fixed permission details not refreshing when returning from the background, introduced in beta1.\r\n- Fixed selections being cleared after cancelling a batch confirmation.\r\n- Fixed selections being lost after rotating the screen.\r\n- Templates without permission rules can no longer be applied and show a notice instead.\r\n- Fixed the Permission","release_url":"https://github.com/1zumiii/AppOpsNext/releases/tag/v1.6.5-beta2"},{"tag":"v1.6.5-beta1","prerelease":true,"published_at":"2026-10-07T13:13:08Z","date":"2026-10-07","zh":"## 简体中文\r\n\n本测试版基于 1.6.0，新增按权限查看和全选功能，并修复部分 Android 16 设备上的运行时权限修改失败问题。可直接覆盖安装 1.6.0，已保存的模板和设置不受影响。\r\n\n### 兼容性说明\r\n\n部分 Android 16 设备会限制相机、麦克风和位置等运行时权限的 AppOps 修改。遇到此类限制时，AppOpsNext 通过设置兼容撤销标记（REVOKED_COMPAT）实现“忽略”。\r\n\n这种方式保留应用已获得的权限，不会结束应用进程。系统权限页面可能仍显示为“已允许”。\r\n\n在此类设备上，受影响的权限不支持“拒绝”模式。选择“拒绝”时，AppOpsNext 会自动改用“忽略”。\r\n\n### 新增与改进\r\n\n- 应用页新增“按应用”和“按权限”两个标签页。选择一项权限后，可查看各应用的权限模式，支持单项修改和多选批量修改。\r\n- 应用页、应用详情页和权限详情页的多选模式新增“全选”。全选仅作用于当前显示的项目，搜索或筛选前的选择会保留。\r\n- 为权限列表中的常见权限补充图标映射。\r\n\n### 修复\r\n\n修复部分 Android 16 设备上从“拒绝”自动改用“忽略”后，修改仍然失败的问题。此修复适用于单项修改、批量操作和模板应用。\r\n\n### 验证范围\r\n\n按权限查看功能目前仅在 ASUS AI2302（Android 15）上验证。反馈者已在 realme RMX3370（Android 16）上确认兼容撤销标记生效。","body":"## English\r\n\nThis beta is based on 1.6.0. It adds a by-permission view and Select all, and fixes runtime permission changes that fail on some Android 16 devices. It can be installed over 1.6.0 without affecting saved templates or settings.\r\n\n### Compatibility notes\r\n\nSome Android 16 devices restrict AppOps changes for runtime permissions such as camera, microphone and location. When these restrictions apply, AppOpsNext uses the compatibility revocation flag (REVOKED_COMPAT) to enforce Ignore.\r\n\nThis method preserves the app's granted permission and does not terminate its process. The system permission settings may still show the permission as allowed.\r\n\nDeny is unavailable for the affected permissions on these devices. Selecting Deny automatically falls back to Ignore.\r\n\n### New and improved\r\n\n- Added By app and By permission tabs to the Apps page. Selecting a permission shows each app's permission mode, with support for individual and batch changes.\r\n- Added Select all to multi-select mode on the Apps page, app details and permission details. It applies only to currently displayed items and preserves selections made before a search or filter.\r\n- Added dedicated icons for common permissions in permission lists.\r\n\n### Fixed\r\n\nFixed permission changes that still failed after falling back from Deny to Ignore on some Android 16 devices. The fix applies to individual changes, batch operations and template application.\r\n\n### Verification scope\r\n\nThe by-permission view has currently been verified only on an ASUS AI2302 running Android 15. A reporter confirmed that the compatibility revocation flag takes effect on a realme RMX3370 running Android 16.\r\n\nSHA-256 (AppOpsNext-v1.6.5-beta1.apk): `ab35efeae54502efd94ddd069533f1c24cdf68ca914f5c6b000701007c975d86`","release_url":"https://github.com/1zumiii/AppOpsNext/releases/tag/v1.6.5-beta1"},{"tag":"v1.6.0","prerelease":false,"published_at":"2026-09-25T16:57:11Z","date":"2026-09-25","zh":null,"body":null,"release_url":"https://github.com/1zumiii/AppOpsNext/releases/tag/v1.6.0"}]},{"full":"t59688/newsnook","url":"https://github.com/t59688/newsnook","desc":"你的开箱即用，唯一资讯，RSS，LinuxDO  新闻，知乎APP","lang":"TypeScript","stars":304,"topics":["android","app","ios","news","rss"],"cats":["reading"],"primary":"reading","tags":["android","rss","ios"],"categoryConfidence":"override","tag":"v1.8.12-beta.6","prerelease":true,"published_at":"2026-10-12T06:10:00Z","date":"2026-10-12","zh":"## 有所闻 NewsNook v1.8.12-beta.6\n\n### 阅读与媒体\n- 列表页与正文页现在能更一致地显示文章预览图，缓存内容也会包含封面信息。\n- 当文章没有封面时，会显示编辑风格的占位图，从而避免出现空白卡片。\n- 从阅读页返回时，滚动位置能更稳定地恢复；从右侧边缘向右滑动返回时也不再出现短暂闪烁现象。\n\n### 订阅与站点\n- 场景预设现在以网格卡片形式呈现，长按即可进行管理操作。\n- 支持对 CMS 源进行重命名与移动操作，同步过程中也会保留用户自定义的排列顺序。\n- 支持将 CMS 文章设为精选内容进行展示。\n\n### 外观与交互\n- 桌面端布局新增功能引导说明：针对侧栏与预设切换操作，会根据当前使用的是桌面端还是移动端给出相应的操作步骤指引。\n\n### 其它\n- 补充了 Android Debug 包的构建命令（仅用于开发调试用途，可与正式安装包同时存在，其包名带有特定后缀）。\n- 当前版本号为 1.8.12-beta.6；此版本属于 Beta 测试版。","body":"## 有所闻 NewsNook v1.8.12-beta.6\n\n### 阅读与媒体\n- 列表与正文更一致地使用文章预览图，缓存也会带上封面。\n- 没有封面时显示编辑风格占位图，避免空白卡片。\n- 从阅读页返回时滚动位置恢复更稳，边缘右滑返回减少闪一下。\n\n### 订阅与站点\n- 场景预设改为网格卡片，长按即可管理。\n- CMS 源支持重命名与移动，同步时保留自定义顺序。\n- CMS 文章支持精选展示。\n\n### 外观与交互\n- 桌面布局补上功能引导：侧栏与预设切换会按桌面/手机给出不同步骤。\n\n### 其它\n- 补充 Android Debug 包构建命令（仅开发调试，与正式安装包并存、包名带后缀）。\n- 版本号 1.8.12-beta.6；本版本为 Beta 测试版。","release_url":"https://github.com/t59688/newsnook/releases/tag/v1.8.12-beta.6","releases":[{"tag":"v1.8.12-beta.6","prerelease":true,"published_at":"2026-10-12T06:10:00Z","date":"2026-10-12","zh":"## 有所闻 NewsNook v1.8.12-beta.6\n\n### 阅读与媒体\n- 列表页与正文页现在能更一致地显示文章预览图，缓存内 's Changed\n\n**改进 / Improvements**\n- API：`/v1/models` 统一返回随服务版本变化的虚拟模型 ID（如 `mineru-4.0.11`），补充模型描述并保持注册时间稳定；`/v1/tiers` 的 `current_model` 同步使用该 ID，解析质量通过 `tier` 选择 / API: expose a single versioned virtual model ID through `/v1/models`, add its description and keep the registration timestamp stable; `/v1/tiers` uses the same ID for `current_model`, while parsing quality is selected through `tier`\n- 图像处理：移除 MinerU 生产代码中的 OpenCV 导入和调用，OCR、公式、表格及印章矫正等图像操作通过 DocVortex 公共接口执行 / Image processing: remove OpenCV imports and calls from MinerU production code and use public DocVortex interfaces for OCR, formula, table and seal image operations\n\n**修复 / Fixes**\n- CLI：修复 `mineru parse` 单文件输入无法覆盖已有输出文件的问题；拒绝输出路径与输入文件相同，避免覆盖源文件；多文件输入继续要求输出为目录 / CLI: allow `mineru parse` to overwrite an existing output file for a single input, reject output paths that point to the input file, and continue requiring a directory for multiple inputs\n\n**依赖 / Dependencies**\n- docvortex 最低版本提升至 0.5.12（`>=0.5.12,<1`）/ Require docvortex>=0.5.12,<1\n- 移除 OpenCV 直接依赖；Torch/full 等可选依赖配置保持原样，第三方依赖仍可能间接安装 OpenCV / Remove the direct OpenCV dependency; Torch/full extras retain their existing configuration, and third-party dependencies may still install OpenCV transitively\n\n**升级提示 / Upgrade Notes**\n- API 客户端应通过 `GET /v1/models` 获取当前虚拟模型 ID，并在服务升级后重新发现；使用 `tier` 选择解析质量，避免硬编码历史模型 ID / API clients should discover the current virtual model ID through `GET /v1/models` and refresh it after server upgrades; select parsing quality through `tier` instead of hard-coding historical model IDs","release_url":"https://github.com/opendatalab/MinerU/releases/tag/mineru-4.0.11-released"},{"tag":"mineru-4.0.10-released","prerelease":false,"published_at":"2026-09-29T07:18:10Z","date":"2026-09-29","zh":null,"body":null,"release_url":"https://github.com/opendatalab/MinerU/releases/tag/mineru-4.0.10-released"}]},{"full":"crimera/piko","url":"https://github.com/crimera/piko","desc":"morphe patches for twitter and instagram", ，当前生成的译文仍可阅读。\n\n## 体验优化\n\n- **页面切换更轻盈**：减小页面返回时的缩放与位移，调整同层级内容切换、菜单和图片查看的过渡效果。\n- **状态变化更清晰**：调整来源分组展开、未读数量、文章已读与收藏、阅读工具栏以及设置项的反馈；同步时连续变化的未读数量会合并显示，减少频繁闪动。\n- **获取全文时继续阅读**：同一篇文章请求全文期间保留已有正文并显示进度，加载完成后更新内容，减少阅读画面被加载状态打断。\n- **大屏阅读与 AI 面板过渡优化**：双栏布局中切换来源与文章列表时保留各自页面状态；AI 侧栏打开和收起时避免正文宽度逐帧变化。新聊天消息加入进入效果，查看历史消息时不重复播放。\n\n## 问题修复\n\n- 修正 Feedburner 订阅失败时被误判为可订阅网站的问题，保留实际请求或解析错误；辅助网页探测失败不再覆盖最初的 Feed 错误。\n- 修正返回来源页或快速切换来源时，来源标题漂移到首页标题区域、原位置短暂缺失的问题。\n- 修正取消侧滑仍可能执行操作的问题；侧滑回位可被下一次手势打断，上下拉切换文章的同一次释放不再重复触发操作。\n- 修正文章加载完成或内容更新后，阅读画面仍可能停留在旧状态的问题；切换动画中即将离开的文章保留自己的内容。\n- 修正切换文章后原文引用定位可能失效的问题，避免旧阅读画面退出时清除当前文章的定位状态。\n- 修正翻译完成期间切换账户可能导致译文保存归属错误的问题；译文按文章所属账户保存，旧账户结果不会覆盖当前阅读状态。","body":"## New Features\n\n- **Translate list titles and previews**: Tap the translation button in the article list's bottom bar to translate loaded titles and previews starting at your current position, up to 50 articles per request. Long-press to choose a configured translation service or AI model. Choose translated text or bilingual display in Settings → Translation settings → Translation display mode. Tap again while translating to stop and keep completed results. Switching lists, opening an article, or putting the app in the background stops the current task.\n- **Resume reading saved translations**: Completed list and full-article translations are saved on your device along with your original/translated display choice. Reopening a page restores matching results without another translation request. Results are retained for up to 30 days; older results are removed first when storage reaches its limit. Removing an article, source, or account also removes its translations. If saving fails, an explicit notice appears and the newly translated text remains readable.\n\n## Experience Improvements\n\n- **Lighter page transitions**: Reduced scaling and movement when returning to a page, and adjusted transitions for peer content, menus, and the image viewer.\n- **Clearer state feedback**: Updated feedback for source //github.com/Significant-Gravitas/AutoGPT/releases/tag/preview-seed-fixture","releases":[{"tag":"preview-seed-fixture","prerelease":true,"published_at":"2026-08-06T04:50:42Z","date":"2026-08-06","zh":null,"body":null,"release_url":"https://github.com/Significant-Gravitas/AutoGPT/releases/tag/preview-seed-fixture"},{"tag":"autogpt-platform-beta-v0.8.3","prerelease":false,"published_at":"2026-10-08T05:35:51Z","date":"2026-10-08","zh":"# 发布 `autogpt-platform-beta-v0.8.3`\n\n**发布日期：** 2026年10月\n\n---\n\n## 有哪些新内容？\n\n### 新功能\n- **#14990** - 将 OAuth 启动情况及交换失败信息上报给 PostHog（作者：@kcze）\n- **#15052** - 允许用户在问题卡片中编辑并合并系统推荐的回答内容（作者：@0ubbe）\n- **#15069** - 由 Discord、Slack、Teams 或 Telegram 服务器驱动的聊天功能，会在对应频道中以原生按钮形式显示审批卡片（作者：@Pwuts）\n- **#15138** - 新增 `ENABLE_USER_NOTIFICATIONS` 开关，便于生产环境仅发送身份验证类邮件（作者：@Bentlybro）\n- **#15145** - 为第33位专家添加 Clip 的头像及专属标识贴纸（作者：@ntindle）\n- **#15146** - 为第33位专家添加 Clip 的头像及专属标识贴纸（热修复版本）（作者：@ntindle）\n- **#14951** - 将官方的 PayPal MCP 服务器添加至 MCP 目录中（作者：@ntindle）\n- **#15070** - 将 GPT-6.1 Sol 模型添加至大语言模型目录中（作者：@ntindle）\n- **#14836** - 将注册、引导流程、支付及用户流失相关事件上报给 PostHog（作者：@kcze）\n- **#15134** - 将官方的 Canva MCP 服务器添加至 MCP 目录中（作者：@ntindle）\n- **#15053** - 常规沙盒操作无需用户授权；但涉及对外发送指令或未经请求删除用户文件的操作仍需获得授权（作者：@Pwuts）\n- **#15203** - 新增 Mistral Large 4 模型（作者：@ntindle）\n- **#15210** - 新增 Mistral Medium 3.5、Small 4 及 Ministral 3 模型，同时停用 Medium 3.1 与 Small 3.2 模型（作者：@Pwuts）\n- **#15188** - 新增 GitHub 仓库流量统计模块（可查看浏览量、克隆次数、流量来源及热门内容）（作者：@ntindle）\n- **#15191** - 新增 Hacker News 搜索、相关故事、内容条目及用户信息查询模块（作者：@ntindle）\n- **#15135** - 用户首次登录前必须完成邮箱验证，注册时即自动创建平台账号（作者：@Bentlybro）\n- **#15152** - 新增注册同意条款说明、营销信息订阅选项以及 MailerLite 订阅入口（作者：@itsababseh）\n- **#15035** - 在主页上合并展示新任务及任务总结内容（作者：@0ubbe）\n- **#15201** - 简化未登录状态下的侧边栏布局，并突出展示免费试用服务（作者：@Torantulino）\n- **#15084** - 为每条流数据条目添加唯一标识，每次数据持久化时生成检查点，同时支持基于光标位置恢复对话进程（作者：@Pwuts）","body":"#  Release `autogpt-platform-beta-v0.8.3`\r\n\n**Date:** October 2026\r\n\n---\r\n\n##  What's New?\r\n\n### New Features\r\n- **#14990** - Report OAuth starts and exchange failures to PostHog (by @kcze)\r\n- **#15052** - Let users edit and combine suggested answers in question cards (by @0ubbe)\r\n- **#15069** - A chat driven from a linked Discord, Slack, Teams or Telegram server gets its approval cards in the channel as native buttons (by @Pwuts)\r\n- **#15138** - `ENABLE_USER_NOTIFICATIONS` switch so prod can send auth emails only (by @Bentlybro)\r\n- **#15145** - Add Clip's avatar and roster pins for the 33rd roster expert (by @ntindle)\r\n- **#15146** - Add Clip's avatar and roster pins for the 33rd roster expert (hotfix) (by @ntindle)\r\n- **#14951** - Add official PayPal MCP Server to MCP catalog (by @ntindle)\r\n- **#15070** - Add GPT-6.1 Sol to the LLM catalog (by @ntindle)\r\n- **#14836** - Send signup, onboarding, checkout and churn events to PostHog (by @kcze)\r\n- **#15134** - Add official Canva MCP Server to MCP catalog (by @ntindle)\r\n- **#15053** - Ordinary sandbox work never asks; outward commands and unrequested deletes of the user's files still do (by @Pwuts)\r\n- **#15203** - Add Mistral Large 4 (by @ntindle)\r\n- **#15210** - Add Mistral Medium 3.5, Small 4 and Ministral 3, and retire Medium 3.1 and Small 3.2 (by @Pwuts)\r\n- **#15188** - Add GitHub repository traffic block (views, clones, referrers, popular content) (by @ntindle)\r\n- **#15191** - Add Hacker News search, stories, item and user blocks (by @ntindle)\r\n- **#15135** - Require a verified email before the first session, and provision the platform User at sign-up (by @Bentlybro)\r\n- **#15152** - Signup consent line, marketing opt-out, and MailerLite gate (by @itsababseh)\r\n- **#15035** - Combine new tasks and recap on home (by @0ubbe)\r\n- **#15201** - Simplify logged-out sidebar and promote free trial (by @Torantulino)\r\n- **#15084** - ID every stream entry, checkpoint every persist, and resume a turn from a cursor (by @Pwuts)\r\n-","release_url":"https://github.com/Significant-Gravitas/AutoGPT/releases/tag/autogpt-platform-beta-v0.8.3"},{"tag":"autogpt-platform-beta-v0.8.2","prerelease":false,"published_at":"2026-09-30T05:25:31Z","date":"2026-09-30","zh":null,"body":null,"release_url":"https://github.com/Significant-Gravitas/AutoGPT/releases/tag/autogpt-platform-beta-v0.8.2"}]},{"full":"zjssun/TradeMirror","url":"https://github.com/zjssun/TradeMirror","desc":"Connect with MT5, transform trading data, and turn it into AI-powered trading insights.","lang":"Python","stars":15,"topics":[],"cats":["finance"],"primary":"finance","tags":[],"categoryConfidence":"override","tag":"v1.2","prerelease":false,"published_at":"2026-08-04T09:55:34Z","date":"2026-08-04","zh":null,"body":null,"release_url":"https://github.com/zjssun/TradeMirror/releases/tag/v1.2","releases":[{"tag":"v1.2","prerelease":false,"published_at":"2026-08-04T09:55:34Z","date":"2026-08-04","zh":null,"body":null,"release_url":"https://github.com/zjssun/TradeMirror/releases/tag/v1.2"},{"tag":"v1.1","prerelease":false,"published_at":"2026-08-03T16:59:05Z","date":"2026-08-03","zh":null,"body":null,"release_url":"https://github.com/zjssun/TradeMirror/releases/tag/v1.1"},{"tag":"v1.0.0","prerelease":false,"published_at":"2026-08-02T10:40:07Z","date":"2026-08-02","zh":null,"body":null,"release_url":"https://github.com/zjssun/TradeMirror/releases/tag/v1.0.0"}]},{"full":"bojieli/ai-agent-book","url":"https://github.com/bojieli/ai-agent-book","desc":"《深入理解 AI Agent：设计原理与工程实践》（李博杰 著）开源主仓库：全书正文、编译版 PDF 与按章配套代码","lang":"Python","stars":54162,"topics":["agent","agent-memory","ai-agent","book","coding-agent","context-engineering","large-language-models","llm","mcp","multi-agent","multimodal","rag","reinforcement-learning"],"cats":["learning"],"primary":"learning","tags":["mcp"],"categoryConfidence":"override","tag":"latest","prerelease":true,"published_at":"2026-07-21T03:27:58Z","date":"2026-07-21","zh":null,"body":null,"release_url":"https://github.com/bojieli/ai-agent-book/releases/tag/latest","releases":[{"tag":"latest","prerelease":true,"published_ 复提醒。签名计数非零的 Passkey 会跳过；不可导出的系统／硬件密钥仅同步凭据信息，可导出密钥在接收端重新加密保存。跨端使用需双方安装兼容版本。\r\n- 提供同步进度、连接诊断和失败处理建议；校验及保存完成后才确认成功，离线冲突保留副本。\r\n\n- 移除喵喵语、芝士雪豹语和雪豹彩蛋图标，原始语言与图标资源归档至“彩蛋语言备份”；旧语言设置自动恢复简体中文，保留升级后的正常桌面入口。\r\n\n- 修复 MDBX 格式检查遇到损坏数据库时的错误分类，并禁止 Android 默认损坏处理器删除原文件，保留后续恢复所需的数据。\r\n\n- Steam 筛选复用密码与通行密钥页面的数据库／文件夹菜单，支持本地分类、MDBX 文件夹、KeePass 分组及 Bitwarden／Vaultwarden 文件夹；记住所选文件夹，并可与搜索组合。切换同库文件夹不重复加载或同步账户，共用菜单支持从 MDBX 子文件夹逐级返回。\r\n\n- Passkey 和 Steam 支持选择数据库内的文件夹进行移动或复制，也可在当前数据库中整理归属；修复 Passkey 目标选择器未加载 MDBX 文件夹的问题。\r\n- Passkey 复制保留源记录；操作前检查绑定、引用、私钥及目标限制，遇到无法处理的条目可取消或跳过后继续，并显示逐项结果。要求凭据 ID 唯一的 KeePass／MDBX 不支持同库复制，可改选其他数据库。\r\n- Steam 复制生成独立条目，同库移动保留原记录；新增本地分类归属并迁移旧数据，修复 MDBX 后续编辑或刷新会话时回到根目录的问题。跨库移动在目标写入成功后才清理源记录。\r\n\n- 修复通行密钥本地数据库页面反复出现同步状态：按当前数据库和文件夹范围触发刷新，跳过无目标、无法读取或已更新的 KeePass 索引；本地页面不再显示其他 Bitwarden／Vaultwarden 账户的同步进度。\r\n- 缓存通行密钥的“密钥不可用”“跨端受限”等标记，返回列表或打开详情时立即复用检查结果；密钥删除、恢复、兼容性参数或解锁会话变化后重新检查，减少重复加载与标记闪烁。\r\n\n- 修复通行密钥列表进入详情后返回会重置为“全部”的问题：保留所选数据库及文件夹，重新打开后恢复上次选择，避免页面重建时用默认值覆盖筛选设置。\r\n\n- 修复旧 Passkey 在刷新或合并时可能改变已使用的备份资格标志：保留既有凭据的注册属性，冲突时保留原数据；新导入仍遵循来源标志。\r\n- 修复修改 Bitwarden／Vaultwarden Passkey 时可能覆盖同一登录项中的其他密钥、密码、网址和自定义字段；更新前读取完整条目，使用版本校验并回读确认，失败或冲突时保留本地数据；保留用户主动移动文件夹和移回根目录的操作。\r\n- 通行密钥列表在格式旁标记“仅本地”“跨端受限”或“密钥不可用”，详情解释限制原因；支持小屏及大字体换行。\r\n\n- 修复仅绑定 Bitwarden／Vaultwarden 时密码库首页和搜索可能看不到已同步条目：未保存数据库范围时默认显示“全部”，旧版省略范围的设置同步采用该默认值；明确保存的本地库或具体数据库选择继续保留，锁定库仍不参与展示与搜索。","body":"## English\r\n\n- Added Nearby device sync: pair by QR code or link on the same reachable Wi-Fi/LAN to securely sync Local or supported MDBX vaults, including passwords, standalone authenticators, local Steam accounts, Passkeys, notes, cards, folders, tags and attachments. The default sync database is Local; external Bitwarden/Vaultwarden and KeePass vaults keep their own sync mechanisms. Nearby sync needs no cloud relay.\r\n- Choose bidirectional, send-only or receive-only transfers, with automatic or manual sync. The automatic toggle works at any time; switching it off lets the current transfer finish. After pairing, main-page menus offer manual sync and progress access. When automatic sync is off on both devices, start a manual round on each.\r\n- Automatic sync runs while both Monica apps are visible and unlocked, pausing in the background. Unavailable peers are not repeatedly probed, and reopening unchanged data does not force a resend. Small system discovery messages remain; use manual sync on both devices if service discovery is restricted.\r\n- Passkey review explains cross-device restrictions, offers a persistent “Don’t show again” choice and lets you inspect limits or restore reminders in diagnostics. Passkeys with nonzero signature counters are skipped. Non-exportable system/hardware keys sync credential metadata only; exportable keys are encrypted again on receipt. Both devices need compatible app versions.\r\n- View sync progress, connection diagnostics and failure guidance. Success is confirmed after validation and saving; offline conflicts retain copies.\r\n\n- Removed the Nya and Snow Leopard Easter egg languages and Snow Leopard icon. Original resources are archived in “彩蛋语言备份”; existing selections migrate to Simplified Chinese while preserving a working launcher entry.\r\n\n- Fixed MDBX format checks misclassifying corrupt databases and prevented Android's default corruption handler from deleting the original file, preserving it for recovery.\r\n\n- Steam now shares t","release_url":"https://github.com/Monica-Pass/Monica/releases/tag/V1.0.319"},{"tag":"V1.0.318","prerelease":false,"published_at":"2026-10-08T11:22:51Z","date":"2026-10-08","zh":"# Monica for Android 1.0.318\r\n\n> 未发布 / Unreleased\r\n\n## 中文\r\n\n- 扩展常用信息输入建议：银行卡持卡人、证件及账单姓名共享已保存姓名，姓、名和中间名分别匹配；账单和证件地址支持街道、门牌、省市、邮编及国家建议，兼容独立卡包、密码内嵌内容及旧字段。保留签发机关建议，点击仅填写当前字段，不自动拆分姓名或修改其他资料。\r\n\n- 修复 KDBX 密码批量删除缓慢及条目重新出现：密码页与密码库页统一按数据库一次保存，成功后整体更新列表；原生索引在后台以事务提交，拒绝过期快照。保存失败保留列表数据，不再逐条重试；外部文件完整写入后若校验失败，保留当前文件与恢复副本，避免覆盖另一会话的写入。\r\n\n- 改善安全存储启动容错：未分类的读取异常在后台最多尝试三次，减少短暂失败直接进入保护页的情况；持续失败、密钥缺失及认证错误仍保留原数据并阻止正常启动。诊断补充失败阶段、尝试次数及异常类型，不包含密码、密钥或异常原文。\r\n\n- 卡包的银行卡和证件编辑统一使用 M3E 内容卡片：新增内容以紧凑卡片展示，支持长按拖动及菜单排序，顺序随条目保存；扩展字段、自定义字段和账单地址改用相连的填充式编辑，缩小间距并适配键盘与大字体。隐藏字段使用密码键盘。\r\n\n- 自动填充新增“保持解锁两分钟”设置，默认关闭；开启后同一应用及网站可复用验证，支持账号与密码分步填写及手动选择，连续填充不延长有效期。关闭此项、锁屏、手动锁定、移除 Monica 最近任务或进程重启均撤销临时授权。修复主应用清理后台后仍可恢复旧解锁会话的问题，自动填充操作不再延长主应用解锁时间；普通切换应用仍遵循自动锁定设置。\r\n\n- 新增常用信息输入建议：银行名称、分行代码、客服电话、凭据分组标签、网站网址及证件签发机关可匹配已保存的同类值，点击即可填入；支持项目内嵌银行卡和证件，最多显示三项，锁定或不可访问的数据源不参与建议。\r\n\n- 修复从其他应用接收 Passkey 时对空扩展和未启用支付扩展的过度拒绝，保留原始凭据及私钥；按验证码、无效数据、私钥及不支持的扩展显示跳过原因，诊断日志仅记录分类计数。含 PRF、Blob 或启用支付扩展的 Passkey 仍明确提示暂不支持，不丢弃扩展强行导入。\r\n\n- 修复导入条目中应用关联元数据被显示为普通自定义字段的问题；保留签名约束及再次导出能力，编辑或移除普通字段分组不会删除这些关联信息。\r\n\n- 优化去重合并到 Monica 本地：无附件的密码与无附件、无照片的安全条目按小批次事务写入，减少完整列表反复查询；进度在提交后更新，失败批次回滚并逐条定位，取消时停止后续处理。保留附件、MDBX 与 Passkey 的原有写入和回滚流程，减少重复分析读取及无附件条目的空查询。\r\n\n- 优化设置中的清空数据：按批次删除，减少逐条写库与列表刷新；显示当前阶段和实际已清空数量，完成或失败时保留结果提示，防止重复确认，并在页面重建后继续显示进度。保留原有类型选择及删除范围。\r\n\n- Monica CLI 同样暂不接入 Glitter：不创建、打开、编辑、导出或同步该档位，仅保留只读格式识别；即使提供正确密码和密钥也不会放行，原有数据库不变。","body":"## English\r\n\n- Extend saved-value suggestions to cardholder, identity and billing names, with separate first/middle/last-name matching. Suggest street, unit, city, region, postal code and country across wallet items, embedded content and legacy fields. Keep issuing-authority suggestions; selection fills only the active field without splitting names or changing other details.\r\n\n- Fix slow KDBX password bulk deletion and reappearing entries. Both password and vault pages save each database once and update the list after success. Apply native indexes in background transactions and reject stale snapshots. Preserve list data on save failure without per-entry retries; if verification fails after a complete external write, retain the current file and recovery copy instead of overwriting another session's changes.\r\n\n- Improve secure-storage startup handling: retry unclassified read failures up to three times in the background before showing the recovery screen. Persistent failures, missing keys and auth function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function ago(ts){if(!ts)return "";var s=Math.floor((Date.now()-new Date(ts).getTime())/1000);if(s<0)return "刚刚";if(s<3600)return Math.floor(s/60)+" 分钟前";if(s<86400)return Math.floor(s/3600)+" 小时前";if(s<86400*30)return Math.floor(s/86400)+" 天前";if(s<86400*365)return Math.floor(s/86400/30)+" 个月前";return Math.floor(s/86400/365)+" 年前";}
function sectionOf(r){if(!r.published_at)return 3;var d=(Date.now()-new Date(r.published_at).getTime())/86400000;if(d<1)return 0;if(d<=7)return 1;if(d<=30)return 2;return 3;}
function isRuleSet(full,desc){var n=String(full||"").toLowerCase().split("/")[1]||"";if(/(^|[-_ ])rules?([-_ ]|$)/.test(n))return true;return /规则集|rule.?set/i.test(desc||"");}
function badge(r){if(r.isCommit||!r.tag)return "<span class=\"badge commit\">📝 仅提交</span>";if(isRuleSet(r.full,r.desc))return "<span class=\"badge ruleset\">📦 规则集</span>";return r.prerelease?"<span class=\"badge beta\">🧪 测试版</span>":"<span class=\"badge stable\">✅ 正式版</span>";}

function fmtDT(ts){if(!ts)return "—";var d=new Date(new Date(ts).getTime()+8*3600*1000);function p(n){return (n<10?"0":"")+n;}return d.getUTCFullYear()+"-"+p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate())+" · "+p(d.getUTCHours())+":"+p(d.getUTCMinutes());}

return h+"</div></div>";}
