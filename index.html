not the complete 0.102 versus 0.101 changelog. This is not the final stable release.\r\n\n## Highlights\r\n\n- **Advanced Paste**: Added a headless CLI for built-in and saved custom actions, with file, stdin, and clipboard workflows.\r\n- **Command Palette**: Added a full-screen preview picker for compact-mode vertical positioning.\r\n- **Command Palette**: Fixed startup failures in launched apps caused by an inherited Windows App SDK runtime-directory override.\r\n- **Command Palette**: Fixed blank details panes when extensions replace a content page's details.\r\n- **New+**: Fixed context-menu memory leaks and improved template destination and path handling.\r\n- **Settings**: Preserved module enablement preferences when modules cannot load or settings reads fail.\r\n\n## Advanced Paste\r\n\n- Added a headless CLI to run built-in and saved custom actions without opening the UI, with file, stdin, or clipboard input and file, clipboard, or text-only stdout output; AI actions use providers configured in Settings and honor existing policies in #50834 by @MuyuanMS and @Copilot\r\n- Updated the Advanced Paste CLI for System.CommandLine 2.0, preserving existing commands, aliases, output formats, and help-like option values in #51230 by @LegendaryBlair and @Copilot\r\n\n## Command Palette\r\n\n- Replaced compact mode's vertical-position slider with a full-screen preview picker supporting drag, scroll, and keyboard controls, while reserving room for expanded search results in #51011 by @jiripolasek\r\n- Fixed blank details panes when extensions replace a content page's details, initializing new content and detaching the previous details in #51231\r\n- Fixed startup failures in applications launched from Command Palette by preventing them from inheriting its Windows App SDK runtime-dire","release_url":"https://github.com/microsoft/PowerToys/releases/tag/v0.102.2862.0","releases":[{"tag":"v0.102.2862.0","prerelease":true,"published_at":"2026-10-14T06:37:56Z","date":"2026-10-14","zh":"# PowerToys 预览版 v0.102.2862.0\n\n这是 **PowerToys 0.102 发布系列** 的预览通道版本，基于 `stable` 分支构建。 该版本继 v0.102.2851.0 之后发布；下文所述内容仅描述自该预览版以来的变更，而非 0.102 与 0.101 版本间的完整变更日志。此版本并非最终稳定版。\n\n## 亮点\r\n\n- **高级粘贴**：为内置和已保存的自定义操作添加了无界面命令行界面（CLI），支持文件、标准输入（stdin）和剪贴板工作流。\n- **命令面板**：为紧凑模式的垂直布局添加了全屏预览选择器。\r\n- **命令面板**：修复了因继承自 Windows App SDK 的运行时目录覆盖导致的已启动应用启动失败问题。\n- **命令面板**：修复了当扩展程序替换内容页面的详细信息时，详细信息窗格显示为空的问题。\r\n- **New+**：修复了上下文菜单的内存泄漏问题，并改进了模板目标和路径的处理。\n- **设置**：当模块无法加载或设置读取失败时，保留模块启用偏好设置。\n\n## 高级粘贴\r\n\n- 添加了无界面命令行工具（CLI），可在不打开用户界面的情况下运行内置和已保存的自定义操作，支持文件、标准输入（stdin）或剪贴板输入，以及文件、剪贴板或纯文本标准输出（stdout）；AI 操作使用“设置”中配置的提供程序，并遵循 @MuyuanMS 和 @Copilot 在 #50834 中提出的现有策略\r\n- 更新了“高级粘贴”CLI 以适配 System.CommandLine 2.0，保留了现有命令、别名、输出格式以及 @LegendaryBlair 和 @Copilot 在 #51230 中提出的类似帮助文档的选项值\n\n## 命令面板\r\n\n- 将紧凑模式中的垂直位置滑块替换为支持拖动、滚动和键盘控制的全屏预览选择器，同时为展开的搜索结果预留空间（参见 #51011，由 @jiripolasek 提交）\r\n- 修复了当扩展程序替换内容页面的详细信息时，详细信息窗格显示为空的问题，该问题发生在 #51231 中，当时系统会初始化新内容并脱离之前的详细信息\n- 修复了从命令面板启动的应用程序的启动失败问题，通过防止它们继承其 Windows App SDK 运行时-dire","body":"# PowerToys Preview v0.102.2862.0\r\n\nThis is a preview-channel build for the **PowerToys 0.102 release train**, produced from the `stable` branch. It follows v0.102.2851.0; the notes below describe changes since that preview, not the complete 0.102 versus 0.101 changelog. This is not the final stable release.\r\n\n## Highlights\r\n\n- **Advanced Paste**: Added a headless CLI for built-in and saved custom actions, with file, stdin, and clipboard workflows.\r\n- **Command Palette**: Added a full-screen preview picker for compact-mode vertical positioning.\r\n- **Command Palette**: Fixed startup failures in launched apps caused by an inherited Windows App SDK runtime-directory override.\r\n- **Command Palette**: Fixed blank details panes when extensions replace a content page's details.\r\n- **New+**: Fixed context-menu memory leaks and improved template destination and path handling.\r\n- **Settings**: Preserved module enablement preferences when modules cannot load or settings reads fail.\r\n\n## Advanced Paste\r\n\n- Added a headless CLI to run built-in and saved custom actions without opening the UI, with file, stdin, or clipboard input and file, clipboard, or text-only stdout output; AI actions use providers configured in Settings and honor existing policies in #50834 by @MuyuanMS and @Copilot\r\n- Updated the Advanced Paste CLI for System.CommandLine 2.0, preserving existing commands, aliases, output formats, and help-like option values in #51230 by @LegendaryBlair and @Copilot\r\n\n## Command Palette\r\n\n- Replaced compact mode's vertical-position slider with a full-screen preview picker supporting drag, scroll, and keyboard controls, while reserving room for expanded search results in #51011 by @jiripolasek\r\n- Fixed blank details panes when extensions replace a content page's details, initializing new content and detaching the previous details in #51231\r\n- Fixed startup failures in applications launched from Command Palette by preventing them from inheriting its Windows App SDK runtime-dire","release_url":"https://github.com/microsoft/PowerToys/releases/tag/v0.102.2862.0"},{"tag":"v0.102.2851.0","prerelease":true,"published_at":"2026-10-12T15:17:06Z","date":"2026-10-12","zh":"# PowerToys 预览版 v0.102.2851.0\n\n这是 **PowerToys 0.102 发布系列** 的预览通道版本，基于 `stable` 分支构建。 该版本继 v0.102.2814.0 之后发布；下文所述内容仅描述自该预览版以来的变更，而非 0.102 与 0.101 版本间的完整变更日志。此版本并非最终稳定版。\n\n## 亮点\r\n\n- **Quick Accent**：新增了可搜索的字符参考指南，包含 Unicode 描述并支持单击复制。\n- **ZoomIt**：当音频输入不可用时，通过实时音频步调控制和受限缓冲区，提高了录制可靠性。\n\n## 通用信息\r\n\n- @Copilot 在 #51065 中引入的更严格的分析器策略 **未包含在此预览版中**：该策略已在本构建之前在稳定版中完全撤销。CA1824、CA1720 和 MVVMTK0049 仍保留上一版预览版的警告策略。\r\n- 修复了 @LegendaryBlair 和 @Copilot 在 #51179 中提到的官方构建版本中“命令面板工具包”默认资源语言元数据的问题\n\n## 无边界鼠标\r\n\n- 移除了未使用的 Windows 兼容性依赖项，仅保留了“无边界鼠标”所需的包（由 @Copilot 在 #50883 中实现）\n\n## 快速重音\r\n\n- 在“设置”中添加了可搜索的字符参考指南，用于浏览语言映射、查看 Unicode 描述以及复制字符，所选语言集将优先显示（由 @daverayment 和 @Copilot 提交的 #49394 问题）\n\n## ZoomIt\r\n\n- 改进了在无音频输入时屏幕录制的可靠性，通过实时音频步进和有限缓冲实现，由 @foxmsft 在 #50934 中实现\n\n## 需要最终审核的更改\r\n\n直接稳定版提交 ef2d7537d507 完全回滚了 #51065，以恢复之前的分析器警告策略。#51179 中 Toolkit 元数据修复仍被保留。这是对一个中间阶段、未发布的更改的回滚，并非从之前的预览版中移除功能。","body":"# PowerToys Preview v0.102.2851.0\r\n\nThis is a preview-channel build for the **PowerToys 0.102 release train**, produced from the `stable` branch. It follows v0.102.2814.0; the notes below describe changes since that preview, not the complete 0.102 versus 0.101 changelog. This is not the final stable release.\r\n\n## Highlights\r\n\n- **Quick Accent**: Added a searchable character reference guide with Unicode descriptions and click-to-copy support.\r\n- **ZoomIt**: Improved recording reliability when audio inputs are unavailable, with real-time audio pacing and bounded buffering.\r\n\n## General\r\n\n- The stricter analyzer policy introduced in #51065 by @Copilot **is not included in this preview**: it was fully reverted on stable before this build. CA1824, CA1720, and MVVMTK0049 retain the previous preview's warning policy.\r\n- Fixed the Command Palette Toolkit's default resource language metadata in official builds in #51179 by @LegendaryBlair and @Copilot\r\n\n## Mouse Without Borders\r\n\n- Removed unused Windows compatibility dependencies and retained only the packages Mouse Without Borders needs in #50883 by @Copilot\r\n\n## Quick Accent\r\n\n- Added a searchable character reference guide in Settings to browse language mappings, view Unicode descriptions, and copy characters, with selected language sets shown first in #49394 by @daverayment and @Copilot\r\n\n## ZoomIt\r\n\n- Improved screen-recording reliability when audio inputs are unavailable, with real-time audio pacing and bounded buffering in #50934 by @foxmsft\r\n\n## Changes needing final review\r\n\nDirect stable commit ef2d7537d507 fully reverts #51065 to restore the previous analyzer warning policy. The Toolkit metadata fix in #51179 remains included. This is a rollback of an intermediate, unpublished change, not removal of a feature from the previous preview.","release_url":"https://github.com/microsoft/PowerToys/releases/tag/v0.102.2851.0"},{"tag":"v0.102.2814.0","prerelease":true,"published_at":"2026-10-09T09:30:02Z","date":"2026-10-09","zh":"# PowerToys 预览版 v0.102.2814.0\n\n这是 **PowerToys 0.102 发布系列** 的预览通道版本，基于 `stable` 分支构建。 该版本继 v0.102.2803.0 之后发布；下文所述内容仅描述自该预览版以来的变更，而非 0.102 与 0.101 版本之间的完整变更日志。此版本并非最终稳定版。\n\n## 亮点\r\n\n- **鼠标按钮锁定**：新增可选的左键、右键和中键锁定功能，以便在无需按住按钮的情况下继续拖拽和选择操作。\n- **灯开关**：新增用于状态查询、主题切换和计划任务控制的命令行界面（CLI），并支持 JSON 输出以实现自动化。\r\n- **设置**：新增命令行工具，用于检查模块状态，并在 PowerToys 关闭时保存启用/禁用设置的更改。\n- **命令面板**：修复了将打包应用拖拽至 Dock 时显示其加载图标的问题。\n- **快速重音**：恢复了字符列表溢出时的水平滚动条。\r\n- **快捷键指南**：优化了启动和索引功能，包括修复了快速重新打开导致的崩溃以及首次激活时的闪烁问题。\n- **设置**：将欢迎页面的动画 GIF 替换为静音循环播放的 H.264 视频，并添加了备用图片。\r\n- **ZoomIt**：修复了 DSC 配置，使其使用实际基于注册表的设置，并向正在运行的实用程序通知更改。\n\n## 命令面板\n\n- 修复了将打包应用拖放到 Dock 上的问题，确保固定条目能正确启动，且在加载时显示其图标（由 @jiripolasek 在 #51018 中提交）\r\n\n## Light Switch\n\n- 添加了一个命令行工具，用于查询状态、设置或切换已配置的主题目标，以及启用或禁用正在运行的 Light Switch 服务上的计划任务，并提供 JSON 输出以支持自动化（#50459）\n\n## 鼠标按钮锁定\r\n\n- 添加了可选的鼠标按钮锁定功能，支持左键、右键和中键，这样在长按后仍可继续拖动和选择，而无需持续按住按钮（由 @MuyuanMS 和 @owenpkent 提交的 #49279 问题）\n\n## 快速重音\r\n\n- 恢复了字符列表溢出时的水平滚动条，以便“快速重音”功能能显示当前位置，且不会裁剪滚动条","body":"# PowerToys Preview v0.102.2814.0\r\n\nThis is a preview-channel build for the **PowerToys 0.102 release train**, produced from the `stable` branch. It follows v0.102.2803.0; the notes below describe changes since that preview, not the complete 0.102 versus 0.101 changelog. This is not the final stable release.\r\n\n## Highlights\r\n\n- **Mouse Button Lock**: Added opt-in left, right, and middle button locking so dragging and selection can continue without holding a button down.\r\n- **Light Switch**: Added a CLI for status, theme switching, and schedule control, with JSON output for automation.\r\n- **Settings**: Added a CLI to inspect module states and save enable/disable changes while PowerToys is closed.\r\n- **Command Palette**: Fixed dragging packaged apps onto the dock and displaying their loaded icons.\r\n- **Quick Accent**: Restored the horizontal scrollbar for overflowing character lists.\r\n- **Shortcut Guide**: Improved startup and indexing, including fixes for rapid-reopen crashes and first-activation flicker.\r\n- **Settings**: Replaced animated welcome-page GIFs with muted, looping H.264 videos and a fallback image.\r\n- **ZoomIt**: Fixed DSC configuration to use actual registry-backed settings and notify the running utility of changes.\r\n\n## Command Palette\r\n\n- Fixed dragging packaged apps onto the dock so pinned entries launch correctly and their icons appear when loaded in #51018 by @jiripolasek\r\n\n## Light Switch\r\n\n- Added a CLI to query status, set or toggle configured theme targets, and enable or disable schedules on the running Light Switch service, with JSON output for automation in #50459\r\n\n## Mouse Button Lock\r\n\n- Added opt-in Mouse Button Lock for left, right, and middle buttons so dragging and selection can continue after a long press without continuously holding a button in #49279 by @MuyuanMS and @owenpkent\r\n\n## Quick Accent\r\n\n- Restored the horizontal scrollbar for overflowing character lists so Quick Accent shows the current position without clipping the scrol","release_url":"https://github.com/microsoft/PowerToys/releases/tag/v0.102.2814.0"}]},{"full":"EKKOLearnAI/ekko-studio","url":"https://github.com/EKKOLearnAI/ekko-studio","desc":"Ekko Studio is a local-first AI workspace for multi-agent chat, coding, and visual workflows, available on desktop and t","lang":"TypeScript","stars":11407,"topics":["agent","ai-agent","chat-ui","coding-agents","dashboard","ekko-studio","hermes","hermes-agent","hermes-studio","hermes-web-ui","llm","multi-agent","multi-model","multi-platform","self-hosted","typescript","vue3","web-ui","workflow-automation"],"cats":["ai"],"primary":"ai","tags":["web"],"categoryConfidence":"rule","tag":"v0.7.35","prerelease":false,"published_at":"2026-10-14T03:01:37Z","dat
