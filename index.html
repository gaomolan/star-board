<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>⭐ Star 动态看板</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#666;--card:#f6f7f9;--border:#e3e5e8;--accent:#0969da;--green:#1a7f37;--amber:#9a6700}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--card:#161b22;--border:#30363d;--accent:#4493f8;--green:#3fb950;--amber:#d29922}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}header.top{padding:26px 0 6px}h1{font-size:24px;margin:0 0 4px}.meta{color:var(--muted);font-size:13px}
.filters{position:sticky;top:0;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;z-index:10}
.filters input,.filters select{background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filters input{flex:1;min-width:150px}h2{font-size:18px;margin:26px 0 12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:16px;word-break:break-all}.card h3 a{color:var(--fg);text-decoration:none}.card h3 a:hover{color:var(--accent)}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;margin:0 6px 4px 0;border:1px solid var(--border);white-space:nowrap}
.badge.stable{color:var(--green);border-color:var(--green)}.badge.beta{color:var(--amber);border-color:var(--amber)}.badge.commit{color:var(--muted)}.badge.ruleset{color:var(--accent);border-color:var(--accent)}
.badge.category{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--bg));font-weight:600}.badge.tag{color:var(--muted);border-color:var(--border);background:var(--card)}
.rowmeta{color:var(--muted);font-size:13px;margin:6px 0}.rowmeta.desc{word-break:break-word}
.zh{white-space:pre-wrap;word-break:break-word;margin:8px 0;font-size:14px}
details{margin-top:8px}details summary{cursor:pointer;color:var(--accent);font-size:14px}
details pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;color:var(--muted);max-height:400px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}.grid .card{margin-bottom:0}.grid .card h3{font-size:15px}
.empty{color:var(--muted);padding:24px;text-align:center}details.group{margin-bottom:10px}details.group>summary{cursor:pointer;font-size:16px;font-weight:600;padding:10px 2px;list-style:none}details.group>summary::-webkit-details-marker{display:none}details.group>summary:before{content:"▸ ";color:var(--muted)}details.group[open]>summary:before{content:"▾ "}.timeline{position:relative;margin:6px 0 0 6px;padding-left:22px;border-left:2px solid var(--border)}.titem{position:relative;padding-bottom:16px}.titem .dot{position:absolute;left:-29px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--border)}.titem .dot.stable{background:var(--green)}.titem .dot.beta{background:var(--amber)}.tmonth{font-weight:700;font-size:15px;margin:20px 0 12px}.tmonth:first-child{margin-top:6px}.titem .thead{font-size:15px;font-weight:600;word-break:break-all}.titem .thead a{color:var(--fg);text-decoration:none}.titem .thead a:hover{color:var(--accent)}.nrow{padding:10px 2px;border-bottom:1px solid var(--border);font-size:14px;word-break:break-all}.nrow a{color:var(--fg);text-decoration:none;font-weight:600}.nrow a:hover{color:var(--accent)}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 14px}.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--muted)}.stat b{color:var(--fg);font-size:16px}.relsum{margin-top:8px}.relsum>summary{cursor:pointer;color:var(--accent);font-size:13px}.relsum .zh{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.relsum[open] .zh{display:block;-webkit-line-clamp:unset}footer{color:var(--muted);font-size:12px;text-align:center;padding:28px 0}a{color:var(--accent)}
</style>
</head>

题，并移除列表中重复出现的排序入口。","release_url":"https://github.com/daimiaopeng/coolapk-desktop/releases/tag/v1.35.0-beta.3","releases":[{"tag":"v1.35.0-beta.3","prerelease":true,"published_at":"2026-10-14T08:36:23Z","date":"2026-10-14","zh":null,"body":"# 测试版本更新日志\r\n\n比较范围：正式版 v1.34.1 → 最新提交 5db55dd\r\n\n## 新增\r\n\n- 新增搜索分类拖动排序，支持自动保存和恢复默认顺序，手机与桌面同步生效。\r\n- 新增浅色界面底色设置，提供浅灰、暖米色和自定义颜色，并支持预览。\r\n- 新增“进入详情时展示图片”开关，可在列表保持无图的同时，在动态和问答详情中查看图片。\r\n- 新增动态背景图显示开关，可单独关闭作者背景和装饰图。\r\n- 新增移动端阅读自动隐藏导航：向下阅读时收起首页搜索栏、底部导航或详情操作栏，反向滚动恢复显示。\r\n\n## 优化\r\n\n- 首页和话题页采用连续玻璃导航，背景延伸至顶部状态栏，适配 Android 与 iOS 安全区。\r\n- 优化手机上传和下载页面的统计、筛选、进度及操作布局，长文件名和包名支持换行。\r\n- 上传任务页面增加 CDN 文件上传快捷入口。\r\n- 优化设置页在窄窗口和大字体下的布局，导航栏目与搜索排序设置支持折叠。\r\n\n## 修复\r\n\n- 修复双列信息流在图片加载和翻页时卡片突然换列、跳动的问题；保留左右独立瀑布流，并按较短一列提前加载下一页。\r\n- 修复系统榜等列表首屏不足一屏时无法触发后续分页的问题。\r\n- 修复手机快捷入口图标缺失的问题。\r\n- 修复头条刷新和继续加载时使用错误起点的问题。\r\n- 修复私信待发送图片无法正常预览，以及反馈输入区拖动、图片预览和发送按钮被挤压的问题。\r\n- 修复详情评论已点赞状态未正确显示主题色的问题。\r\n- 修复话题简介文字与背景对比不足的问题。\r\n- 修复话题点评页“我的打分”入口显示与跳转问题，并移除列表中重复出现的排序入口。","release_url":"https://github.com/daimiaopeng/coolapk-desktop/releases/tag/v1.35.0-beta.3"},{"tag":"v1.34.1","prerelease":false,"published_at":"2026-10-13T15:56:17Z","date":"2026-10-13","zh":"# v1.34.1 更新日志\n\n## 优化\n- 调整桌面右侧评论栏的默认宽度，随内容区域自适应；打开评论时隐藏首页榜单与热门话题侧栏。\r\n- 右侧评论改为默认关闭，首次升级时同步关闭，之后保留用户手动选择。\n- 加强文本处理与外部链接打开的安全校验。\n\n## 修复\n- 恢复 PC 模式设置页的左侧分类栏和页面标题，移动模式保留分类下拉菜单。\r\n- 修复 Linux 跟随系统主题的识别与切换问题。\n- 修复部分 Android 设备图标显示为方框的问题。\n- 修复 Android 实况播放能力被误判为不支持的问题。\n- 修复移动端文字选择菜单遮挡选区、影响拖动选择的问题。\r\n- 修复复制图片失败时意外将图片链接写入剪贴板的问题，并改善图片格式兼容性。\n- 修复首页“新机”栏目“更多”入口误跳转产品详情的问题。","body":"# v1.34.1 更新日志\r\n\n## 优化\r\n- 调整桌面右侧评论栏的默认宽度，随内容区域自适应；打开评论时隐藏首页榜单与热门话题侧栏。\r\n- 右侧评论改为默认关闭，首次升级时同步关闭，之后保留用户手动选择。\r\n- 加强文本处理与外部链接打开的安全校验。\r\n\n## 修复\r\n- 恢复 PC 模式设置页的左侧分类栏和页面标题，移动模式保留分类下拉菜单。\r\n- 修复 Linux 跟随系统主题的识别与切换问题。\r\n- 修复部分 Android 设备图标显示为方框的问题。\r\n- 修复 Android 实况播放能力被误判为不支持的问题。\r\n- 修复移动端文字选择菜单遮挡选区、影响拖动选择的问题。\r\n- 修复复制图片失败时意外将图片链接写入剪贴板的问题，并改善图片格式兼容性。\r\n- 修复首页“新机”栏目“更多”入口误跳转产品详情的问题。","release_url":"https://github.com/daimiaopeng/coolapk-desktop/releases/tag/v1.34.1"},{"tag":"v1.34.0","prerelease":false,"published_at":"2026-10-13T02:39:56Z","date":"2026-10-13","zh":null,"body":"# v1.34.0 更新日志\r\n\n## 新增\r\n\n- **话题评分与点评：** 话题页新增评分分布、评分维度、近期评分趋势和用户点评，可按星级或详细评分筛选；动态详情补充评分信息。\r\n- **数码分类浏览：** 新增主分类与子分类目录，支持网格或列表查看商品，并使用分类提供的排序选项。\r\n- **分类表情与收藏管理：** 表情面板新增酷安表情、系统 Emoji、酷币、牛牛、最近使用和收藏分类。登录后可添加、删除和排序收藏表情，并在发动态或评论时插入。\r\n- **Windows 10 动态磁贴开发预览：** 可选择推荐、热榜、快讯或精选作为内容来源，最多轮播 5 条；启动设置页提供启用说明。\r\n- **性能诊断日志：** 增加卡顿与性能指标记录，用于排查性能问题；不记录正文、用户输入或媒体地址。\r\n- **通用文件下载：** 右键链接或音视频资源可下载文件；图片保存和下载可复用已加载或缓存的资源。\r\n- **桌面动态与评论布局：** 新增独立的“点击动态进入详情页”和“评论显示在右侧”开关。右侧评论统一适用于动态列表、话题页和动态详情页；宽窗口下支持拖动分隔线调节宽度，并记住位置。分栏详情页支持切换回复、点赞和转发列表。\r\n- **搜索入口与筛选：** 个人主页新增搜索该用户动态的入口；动态和综合搜索增加动态排序选项。\r\n- **关于页新增 QQ 交流群入口。**\r\n\n## 优化\r\n\n- **搜索结果处理：** 优化综合搜索结果解析和动态搜索参数；接口首屏没有结果时会继续补查，避免漏掉后续结果。\r\n- **手机端布局：** 调整快捷入口、侧栏和更多服务页面的手机布局，改善底部导航与安全区附近的遮挡。\r\n- **评论侧栏样式：** 动态详情复用话题评论栏的布局，统一排序、楼主筛选、输入框和评论列表样式。\r\n- **设置分类导航：** 全平台改用带图标的卡片下拉菜单，当前分类高亮显示，窄窗口也能访问全部设置；移除内容区重复的分类标题。\r\n- **Windows 窄窗口返回：** 将返回入口移至固定标题栏，浏览长页面时无需滚回顶部即可返回。\r\n\n## 修复\r\n\n- **楼中楼回复跳顶：** 点击楼层回复时改用浮层输入框，避免自动滚到顶部；发送成功后只更新对应楼层，保留已加载评论和展开状态，不再重新加载整份评论列表。\r\n- **通知评论定位：** 点击评论通知可进入所属动态并定位到对应回复。\r\n- **原图保存格式：** 修正保存原图时的格式处理，避免将动图的静态预览误作原图保存。\r\n- **首页栏目加载：** 栏目配置加载失败时保留已有栏目；没有已有数据时提供基础栏目并支持重试。\r\n- **iOS 草稿标识：** 兼容缺少 `crypto.randomUUID` 的环境，避免创建发布草稿标识失败。\r\n- **显示与编辑问题：** 修复图文草稿滚动跳顶、消息图片窄屏溢出、Android 回复弹层状态栏遮罩不同步，以及评论用户链接颜色显示问题。","release_url":"https://github.com/daimiaopeng/coolapk-desktop/releases/tag/v1.34.0"}]},{"full":"ArvinLovegood/go-stock","url":"https://github.com/ArvinLovegood/go-stock","desc":"🦄🦄🦄AI赋能股票分析：AI加持的股票分析/选股工具。股票行情获取，AI热点资讯分析，AI资金/财务分析，涨跌报警推送。支持A股，港股，美股。支持市场整体/个股情绪分析，AI辅助选股等。数据全部保留在本地。支持DeepSeek，Ope","lang":"Go","stars":7836,"topics":["ai-tools","deepseek","golang","lmstudio","naiveui","ollama","openai","stock","wails"],"cats":["finance"],"primary":"finance","tags":[],"categoryConfidence":"rule","tag":"v2026.10.14.2-release","prerelease":false ":null,"body":"# Aira Community 3.7.4 (1000531)\n\n这是 **Community 未签名 HAP**，包名 `org.aira.browser`。不是华为应用市场里的 Official 商店包（`com.aira.browser`）。\n\n下载后需要你自己用 `org.aira.browser` 的 HarmonyOS 签名材料签名，再侧载安装。未签名包不能直接装到设备上。\n\n## 安装\n\n1. 用 DevEco Studio 打开本仓库的 `AiraBrowser/`，为 `org.aira.browser` 配置你自己的签名。\n2. 对这个 HAP 签名（DevEco 或 HarmonyOS `hap-sign-tool`）。\n3. 用 `hdc` 安装到已开启开发者调试的设备。\n\nCommunity 默认没有官方云、华为账号、华为云空间和 IAP。本地浏览、WebDAV 和自建 Personal Server 可用。\n\n## 产物\n\n- 文件：`Aira-community-v3.7.4-1000531-default-unsigned.hap`\n- 包名：`org.aira.browser`\n- versionName：`3.7.4`\n- versionCode：`1000531`\n- SHA-256：`0fe301e86261daacc473db9f9d1cd18861d96d8f7a80df0a3c9313cc526a2732`\n\n## 更新日志\n\n### 3.7.4 (1000531)\n\n2026-10-14\n\n这次更新让地址栏的书签搜索更快，并修好了隐私标签、登录和下载上的几个问题。\n\n- 地址栏的书签搜索改用持久化索引，冷启动后打开也能即搜即得。\n- 重开应用后，隐私标签的内容和预览图都能正常恢复，不再只剩空白。\n- 普通模式下退出应用后仍保留登录状态，常用网站不用反复登录。\n- 网页里发起的下载继续交给浏览器完成，不再因为重放一次性链接被服务器拒绝。\n- 修好了网页定位调用偶发失效的问题。\n- 打开的分享网页能正常显示，不再出现空白或误弹下载。\n- 深色主题下，弹窗按钮的底色不再发白。\n\n## Changelog\n\n### 3.7.4 (1000531)\n\n2026-10-14\n\nThis release makes address-bar bookmark search faster, and fixes several private-tab, sign-in, and download issues.\n\n- Address-bar bookmark search now uses a persistent index, so results are ready as soon as you open it, even on a cold start.\n- After reopening the app, private tabs restore their content and preview images instead of coming back blank.\n- Normal-mode sign-in is kept after you leave the app, so frequently used sites no longer ask you to sign in again.\n- Downloads started from a web page are still completed by the browser, instead of replaying one-time links that the server rejects.\n- Fixed occasional failures in web page location requests.\n- Shared pages you open now display correctly, without a blank screen or a download prompt by mistake.\n- In dark theme, dialog button backgrounds no longer appear washed out.","release_url":"https://github.com/mason173/aira-browser/releases/tag/v3.7.4","releases":[{"tag":"v3.7.4","prerelease":false,"published_at":"2026-10-14T07:12:50Z","date":"2026-10-14","zh":null,"body":"# Aira Community 3.7.4 (1000531)\n\n这是 **Community 未签名 HAP**，包名 `org.aira.browser`。不是华为应用市场里的 Official 商店包（`com.aira.browser`）。\n\n下载后需要你自己用 `org.aira.browser` 的 HarmonyOS 签名材料签名，再侧载安装。未签名包不能直接装到设备上。\n\n## 安装\n\n1. 用 DevEco Studio 打开本仓库的 `AiraBrowser/`，为 `org.aira.browser` 配置你自己的签名。\n2. 对这个 HAP 签名（DevEco 或 HarmonyOS `hap-sign-tool`）。\n3. 用 `hdc` 安装到已开启开发者调试的设备。\n\nCommunity 默认没有官方云、华为账号、华为云空间和 IAP。本地浏览、WebDAV 和自建 Personal Server 可用。\n\n## 产物\n\n- 文件：`Aira-community-v3.7.4-1000531-default-unsigned.hap`\n- 包名：`org.aira.browser`\n- versionName：`3.7.4`\n- versionCode：`1000531`\n- SHA-256：`0fe301e86261daacc473db9f9d1cd18861d96d8f7a80df0a3c9313cc526a2732`\n\n## 更新日志\n\n### 3.7.4 (1000531)\n\n2026-10-14\n\n这次更新让地址栏的书签搜索更快，并修好了隐私标签、登录和下载上的几个问题。\n\n- 地址栏的书签搜索改用持久化索引，冷启动后打开也能即搜即得。\n- 重开应用后，隐私标签的内容和预览图都能正常恢复，不再只剩空白。\n- 普通模式下退出应用后仍保留登录状态，常用网站不用反复登录。\n- 网页里发起的下载继续交给浏览器完成，不再因为重放一次性链接被服务器拒绝。\n- 修好了网页定位调用偶发失效的问题。\n- 打开的分享网页能正常显示，不再出现空白或误弹下载。\n- 深色主题下，弹窗按钮的底色不再发白。\n\n## Changelog\n\n### 3.7.4 (1000531)\n\n2026-10-14\n\nThis release makes address-bar bookmark search faster, and fixes several private-tab, sign-in, and download issues.\n\n- Address-bar bookmark search now uses a persistent index, so results are ready as soon as you open it, even on a cold start.\n- After reopening the app, private tabs restore their content and preview images instead of coming back blank.\n- Normal-mode sign-in is kept after you leave the app, so frequently used sites no longer ask you to sign in again.\n- Downloads started from a web page are still completed by the browser, instead of replaying one-time links that the server rejects.\n- Fixed occasional failures in web page location requests.\n- Shared pages you open now display correctly, without a blank screen or a download prompt by mistake.\n- In dark theme, dialog button backgrounds no longer appear washed out.","release_url":"https://github.com/mason173/aira-browser/releases/tag/v3.7.4"},{"tag":"v3.7.1","prerelease":false,"published_at":"2026-10-08T16:37:43Z","date":"2026-10-08","zh":null,"body":"# Aira Community 3.7.1 (1000508)\n\n这是 **Community 未签名 HAP**，包名 `org.aira.browser`。不是华为应用市场里的 Official 商店包（`com.aira.browser`）。\n\n下载后需要你自己用 `org.aira.browser` 的 HarmonyOS 签名材料签名，再侧载安装。未签名包不能直接装到设备上。\n\n## 安装\n\n1. 用 DevEco Studio 打开本仓库的 `AiraBrowser/`，为 `org.aira.browser` 配置你自己的签名。\n2. 对这个 HAP 签名（DevEco 或 HarmonyOS `hap-sign-tool`）。\n3. 用 `hdc` 安装到已开启开发者调试的设备。\n\nCommunity 默认没有官方云、华为账号、华为云空间和 IAP。本地浏览、WebDAV 和自建 Personal Server 可用。\n\n## 产物\n\n- 文件：`Aira-community-v3.7.1-1000508-default-unsigned.hap`\n- 包名：`org.aira.browser`\n- versionName：`3.7.1`\n- versionCode：`1000508`\n- SHA-256：`64559a3693f4bafec87f1465cb1fc0fb46cc19b20714659585b32ed5db95ad0c`\n\n## 更新日志\n\n### 3.7.1 (1000508)\n\n2026-10-09\n\n这次更新修好了广告拦截反复弹出下载确认，也调整了历史记录、搜索返回和下拉刷新。\n\n- 开启内容过滤后，拦截网页里的广告不会再反复弹出下载确认。\n- 历史记录只按条数保留，不再因为时间太久被删掉。\n- 搜索页点返回时，先收起键盘，再退出搜索。\n- 下拉刷新不会再被手势提前取消。\n\n## Changelog\n\n### 3.7.1 (1000508)\n\n2026-10-09\n\nThis release fixes ad blocking repeatedly showing a download confirmation, and adjusts history, search back, and pull to refresh.\n\n- Blocking in-page ads with content filtering on no longer opens download confirmations over and over.\n- History is kept by count only, and is no longer deleted just because it is old.\n- Going back from the search page hides the keyboard first, then leaves search.\n- Pull to refresh is no longer cancelled early by the gesture.","release_url":"https://github.com/mason173/aira-browser/releases/tag/v3.7.1"},{"tag":"v3.6.3","prerelease":false,"published_at":"2026-10-06T18:25:55Z","date":"2026-10-06","zh":null,"body":null,"release_url":"https://github.com/mason173/aira-browser/releases/tag/v3.6.3"}]},{"full":"Kindness-Kismet/AstraGram-Desktop","url":"https://github.com/Kindness-Kismet/AstraGram-Desktop","desc":"An enhanced version of a modern and aesthetically pleasing Telegram client.","lang":"C++","stars":141,"topics":[],"cats":["social"],"primary":"social","tags":["telegram"],"categoryConfidence":"rule","tag":"v7.3.1.5","prerelease":false,"published_at":"2026-10-14T07:10:45Z","date":"2026-10-14","zh":"- 调整了 Windows 上图片和视频的打开行为，现在默认在应用窗口内打开，背景模糊，顶部显示发送者和操作按钮，两侧提供圆形翻页按钮，底部提供带位置计数的缩略图条；可在设置中关闭窗口内查看\n- 新增了窗口内媒体查看器的开合与全屏动画，现在可以看到媒体从聊天缩略图展开并收回，缩略图不在可见区域时则原地淡入淡出；全屏时主窗口保持原位，背景使用暗化的系统模糊，按 Esc 可以返回窗口内\n- 对窗口内媒体查看器的控件进行了改善，这使得小窗口下的布局更紧凑，视频控制条不会遮挡翻页按钮，空间不足时转发和保存会移入更多菜单，视频控制条跟随浅色或深色主题；按钮支持悬停提示，闲置时控件自动隐藏，悬停时保持显示，更多菜单和视频设置菜单点击才会打开\n- 新增了文件夹栏和对话列表顶部的自定义标志，现在可以选择图片并自动适配原有标志大小，也可以让标志跟随主题颜色\n- 调整了视频预览的行为，现在右键菜单提供“查看视频封面”，可大图查看上传者设置的封面或 Telegram 生成的缩略图，替换原有带时间的预览帧网格及其播放入口\n- 修复了关于从设置返回对话的错误，该问题曾导致照片和贴纸在过渡期间停留在占位画面，随后突然出现\n- 修复了关于机器人小程序菜单的错误，该问题曾导致内嵌网页遮住弹出菜单\n- 修复了关于 Windows 应用启动的错误，该问题曾导致应用图标未变化时也刷新整个桌面的图标\n- 调整了留档撤回消息的显示行为，现在开启“半透明显示已删除消息”时，显示强度从 40% 提高到 60%，文字和相册内容更清楚","body":"- Changed how photos and videos open on Windows; they now open inside the app window by default over a blurred backdrop, with sender information and actions at the top, round previous and next buttons, and a thumbnail strip with a position counter; you can turn off this behavior in settings\n- Added opening, closing and full-screen transitions to the in-window media viewer, so you can now follow media as it expands from its chat thumbnail and returns to it, or fades in place when the thumbnail is out of view; full screen keeps the app window in place, uses a dimmed system blur backdrop, and lets you return to the window with Esc\n- Improved the in-window media viewer controls, which now fit small windows, keep video controls clear of navigation buttons, move forward and save into the more menu when space is tight, and give video controls the light or dark app theme; button tooltips explain actions, controls hide when idle and stay visible under the pointer, and the more and video settings menus open on click\n- Added custom logos for the folder sidebar and the top of the chat list, so you can now choose an image fitted to the original logo size and optionally make it follow the theme color\n- Changed how video previews work; the context menu now offers View Video Cover to open the uploader's cover or Telegram-generated thumbnail as a large image, replacing the timestamped frame grid and its playback shortcuts\n- Fixed an issue with returning from settings to a chat that previously caused photos and stickers to remain frozen as placeholders during the transition and then appear abruptly\n- Fixed an issue with menus in bot mini apps that previously caused embedded web pages to cover popup menus\n- Fixed an issue with app startup on Windows that previously caused all desktop icons to refresh even when the app icon had not changed\n- Changed how retained deleted messages look; with semi-transparent display enabled, they now use 60% opacity instead of 40%, making text and album","release_url":"https://github.com/Kindness-Kismet/AstraGram-Desktop/releases/tag/v7.3.1.5","releases":[{"tag":"v7.3.1.5","prerelease":false,"published_at":"2026-10-14T07:10:45Z","date":"2026-10-14","zh":"- 调整了 Windows 上图片和视频的打开行为，现在默认在应用窗口内打开，背景模糊，顶部显示发送者和操作按钮，两侧提供圆形翻页按钮，底部提供带位置计数的缩略图条；可在设置中关闭窗口内查看\n- 新增了窗口内媒体查看器的开合与全屏动画，现在可以看到媒体从聊天缩略图展开并收回，缩略图不在可见区域时则原地淡入淡出；全屏时主窗口保持原位，背景使用暗化的系统模糊，按 Esc 可以返回窗口内\n- 对窗口内媒体查看器的控件进行了改善，这使得小窗口下的布局更紧凑，视频控制条不会遮挡翻页按钮，空间不足时转发和保存会移入更多菜单，视频控制条跟随浅色或深色主题；按钮支持悬停提示，闲置时控件自动隐藏，悬停时保持显示，更多菜单和视频设置菜单点击才会打开\n- 新增了文件夹栏和对话列表顶部的自定义标志，现在可以选择图片并自动适配原有标志大小，也可以让标志跟随主题颜色\n- 调整了视频预览的行为，现在右键菜单提供“查看视频封面”，可大图查看上传者设置的封面或 Telegram 生成的缩略图，替换原有带时间的预览帧网格及其播放入口\n- 修复了关于从设置返回对话的错误，该问题曾导致照片和贴纸在过渡期间停留在占位画面，随后突然出现\n- 修复了关于机器人小程序菜单的错误，该问题曾导致内嵌网页遮住弹出菜单\n- 修复了关于 Windows 应用启动的错误，该问题曾导致应用图标未变化时也刷新整个桌面的图标\n- 调整了留档撤回消息的显示行为，现在开启“半透明显示已删除消息”时，显示强度从 40% 提高到 60%，文字和相册内容更清楚","body":"- Changed how photos and videos open on Windows; they now open inside the app window by default over a blurred backdrop, with sender information and actions at the top, round previous and next buttons, and a thumbnail strip with a position counter; you can turn off this behavior in settings\n- Added opening, closing and full-screen transitions to the in-window media viewer, so you can now follow media as it expands from its chat thumbnail and returns to it, or fades in place when the thumbnail is out of view; full screen keeps the app window in place, uses a dimmed system blur backdrop, and lets you return to the window with Esc\n- Improved the in-window media viewer controls, which now fit small windows, keep video controls clear of navigation buttons, move forward and save into the more menu when space is tight, and give video controls the light or dark app theme; button tooltips explain actions, controls hide when idle and stay visible under the pointer, and the more and video settings menus open on click\n- Added custom logos for the folder sidebar and the top of the chat list, so you can now choose an image fitted to the original logo size and optionally make it follow the theme color\n- Changed how video previews work; the context menu now offers View Video Cover to open the uploader's cover or Telegram-generated thumbnail as a large image, replacing the timestamped frame grid and its playback shortcuts\n- Fixed an issue with returning from settings to a chat that previously caused photos and stickers to remain frozen as placeholders during the transition and then appear abruptly\n- Fixed an issue with menus in bot mini apps that previously caused embedded web pages to cover popup menus\n- Fixed an issue with app startup on Windows that previously caused all desktop icons to refresh even when the app icon had not changed\n- Changed how retained deleted messages look; with semi-transparent display enabled, they now use 60% opacity instead of 40%, making text and album","release_url":"https://github.com/Kindness-Kismet/AstraGram-Desktop/releases/tag/v7.3.1.5"},{"tag":"v7.3.1.4","prerelease":false,"published_at":"2026-10-13T05:11:53Z","date":"2026-10-13","zh":"- 新增了视频预览，现在可以在支持的频道视频右键菜单中打开带时间的缩略图网格，并从任意一帧开始播放\n- 对切换对话进行了改善，这使得对话区和选中的对话行原地淡入淡出，切换后才加载出来的消息也会淡入，不再突然出现\n- 对进入归档、论坛和切换文件夹标签进行了改善，这使得对话列表原地过渡，不再整列左右滑动\n- 对设置页的切换进行了改善，这使得设置页打开时从右侧覆盖窗口，各设置页之间原地淡入淡出，不再左右滑动\n- 调整了设置搜索的方式，现在通过搜索按钮打开悬浮在变暗窗口上的搜索面板，不再显示在标题栏里\n- 调整了左侧文件夹栏的样式，现在不再显示滚动条，滚动照常可用\n- 修复了关于发送消息后立刻插入表情的错误，该问题曾导致表情在输入框中比文字略高","body":"- Added video previews for supported channel videos, so you can now open a grid of timestamped frames from the context menu and start playback from any frame\n- Improved switching chats, which now fades the chat area and the selected chat row in place, and messages that finish loading after the switch fade in instead of popping up\n- Improved opening the archive, forums and folder tabs, which now blends the chat list in place instead of sliding the whole column\n- Improved settings navigation, which now covers the window from the right when settings open and blends between settings pages in place instead of sliding them sideways\n- Changed how settings search works; it now opens from a search button as a floating panel over the dimmed window instead of a field in the title bar\n- Changed how the folder sidebar looks; it no longer shows a scrollbar, and scrolling works as before\n- Fixed an issue with emoji picked right after sending a message that previously caused them to sit slightly above the text line in the input field","release_url":"https://github.com/Kindness-Kismet/AstraGram-Desktop/releases/tag/v7.3.1.4"},{"tag":"v7.3.1.3","prerelease":false,"published_at":"2026-10-12T07:35:49Z","date":"2026-10-12","zh":"- 调整了标签式论坛切换话题的方式，现在顶栏显示当前话题，点击后打开可搜索的精简话题列表，取代原来的顶部、左侧和底部标签\n- 对话题和回复页面进行了改善，这使得输入框悬浮在消息上方，并和置顶栏、翻译栏一起呈现与主聊天相同的磨砂效果\n- 对定时消息页面和快捷回复编辑器进行了改善，这使得输入框悬浮在消息上方，呈现与普通聊天相同的磨砂效果\n- 对表情、贴纸和 GIF 搜索框进行了改善，这使得搜索框获得焦点时就显示清除按钮，可以直接退出空白搜索\n- 调整了默认话题图标的样式，现在使用扁平气泡，不再使用带光泽的渐变\n- 调整了发送中状态图标的样式，现在显示为时钟，不再是带对勾的定位图钉\n- 调整了对话列表中论坛行显示未读话题的方式，现在话题名和最后一条消息后面不再有彩色色块\n- 移除了翻译栏菜单中的 Cocoon 说明，菜单末尾的“这是如何运作的？”入口不再可用\n- 修复了关于定时消息页面和快捷回复编辑器的错误，该问题曾导致长列表打开时停在第一条消息，而不是最新一条\n- 修复了关于定时发送按钮的错误，该问题曾导致日历图标比普通发送按钮大很多\n- 修复了关于复制富文本消息的错误，该问题曾导致表格只被复制成一个单词“Table”\n- 修复了关于频道帖子浏览统计的错误，该问题曾导致应用不在前台时持续占用一个 CPU 核心\n- 修复了关于未读回应和提及按钮的错误，该问题曾导致消息无法显示时按钮反复跳到同一条消息","body":"- Changed how topics are switched in forums shown as tabs; the top bar now shows the current topic and opens a compact searchable topic list instead of top, left or bottom tabs\n- Improved topic and reply views, which now float the composer over the messages and give it and the pinned and translate bars the same frosted look as the main chat\n- Improved the scheduled messages page and the quick reply editor, which now float the composer over the messages with the same frosted look as regular chats\n- Improved the emoji, sticker and GIF search fields, which now show the clear button while focused so you can leave an empty search\n- Changed how default topic icons look; they now use a flat bubble instead of a glossy gradient\n- Changed how the sending status icon looks; it now shows a clock instead of a pin with a check mark\n- Changed how forum rows in the chat list show unread topics; they no longer paint a colored block behind the topic names and the last message\n- Removed the Cocoon credit from the translate bar menu; the \"How does it work?\" item at the end of the menu is no longer available\n- Fixed an issue with the scheduled messages page and the quick reply editor that previously caused long lists to open at the first message instead of the latest one\n- Fixed an issue with the schedule send button that previously caused its calendar icon to look much larger than the regular send button\n- Fixed an issue with copying rich messages that previously caused tables to be copied as the single word \"Table\"\n- Fixed an issue with channel post view tracking that previously caused one CPU core to stay busy while the app was inactive\n- Fixed an issue with the unread reactions and mentions buttons that previously caused them to keep jumping to the same message when it could not be shown","release_url":"https://github.com/Kindness-Kismet/AstraGram-Desktop/releases/tag/v7.3.1.3"}]},{"full":"microsoft/PowerToys","url":"https://github.com/microsoft/PowerToys","desc":"Microsoft PowerToys is a collection of utilities that supercharge productivity and customization on Windows","lang":"C","stars":139296,"topics":["advanced-paste","color-picker","command-palette","desktop","fancyzones","keyboard-manager","microsoft-powertoys","powerrename","powertoys","windows","windows-10","windows-11"],"cats":["system"],"primary":"system","tags":["windows"],"categoryConfidence":"override","tag":"v0.102.2862.0","prerelease":true,"published_at":"2026-10-14T06:37:56Z","date":"2026-10-14","zh":"# PowerToys 预览版 v0.102.2862.0\n\n这是 **PowerToys 0.102 发布系列** 的预览通道版本，基于 `stable` 分支构建。 该版本继 v0.102.2851.0 之后发布；下文所述内容仅描述自该预览版以来的变更，而非 0.102 与 0.101 版本间的完整变更日志。此版本并非最终稳定版。\n\n## 亮点\r\n\n- **高级粘贴**：为内置和已保存的自定义操作添加了无界面命令行界面（CLI），支持文件、标准输入（stdin）和剪贴板工作流。\n- **命令面板**：为紧凑模式的垂直布局添加了全屏预览选择器。\r\n- **命令面板**：修复了因继承自 Windows App SDK 的运行时目录覆盖导致的已启动应用启动失败问题。\n- **命令面板**：修复了当扩展程序替换内容页面的详细信息时，详细信息窗格显示为空的问题。\r\n- **New+**：修复了上下文菜单的内存泄漏问题，并改进了模板目标和路径的处理。\n- **设置**：当模块无法加载或设置读取失败时，保留模块启用偏好设置。\n\n## 高级粘贴\r\n\n- 添加了无界面命令行工具（CLI），可在不打开用户界面的情况下运行内置和已保存的自定义操作，支持文件、标准输入（stdin）或剪贴板输入，以及文件、剪贴板或纯文本标准输出（stdout）；AI 操作使用“设置”中配置的提供程序，并遵循 @MuyuanMS 和 @Copilot 在 #50834 中提出的现有策略\r\n- 更新了“高级粘贴”CLI 以适配 System.CommandLine 2.0，保留了现有命令、别名、输出格式以及 @LegendaryBlair 和 @Copilot 在 #51230 中提出的类似帮助文档的选项值\n\n## 命令面板\r\n\n- 将紧凑模式中的垂直位置滑块替换为支持拖动、滚动和键盘控制的全屏预览选择器，同时为展开的搜索结果预留空间（参见 #51011，由 @jiripolasek 提交）\r\n- 修复了当扩展程序替换内容页面的详细信息时，详细信息窗格显示为空的问题，该问题发生在 #51231 中，当时系统会初始化新内容并脱离之前的详细信息\n- 修复了从命令面板启动的应用程序的启动失败问题，通过防止它们继承其 Windows App SDK 运行时-dire","body":"# PowerToys Preview v0.102.2862.0\r\n\nThis is a preview-channel build for the **PowerToys 0.102 release train**, produced from the `stable` branch. It follows v0.102.2851.0; the notes below describe changes since that preview, not the complete 0.102 versus 0.101 changelog. This is not the final stable release.\r\n\n## Highlights\r\n\n- **Advanced Paste**: Added a headless CLI for built-in and saved custom actions, with file, stdin, and clipboard workflows.\r\n- **Command Palette**: Added a full-screen preview picker for compact-mode vertical positioning.\r\n- **Command Palette**: Fixed startup failures in launched apps caused by an inherited Windows App SDK runtime-directory override.\r\n- **Command Palette**: Fixed blank details panes when extensions replace a content page's details.\r\n- **New+**: Fixed context-menu memory leaks and improved template destination and path handling.\r\n- **Settings**: Preserved module enablement preferences when modules cannot load or settings reads fail.\r\n\n## Advanced Paste\r\n\n- Added a headless CLI to run built-in and saved custom actions without opening the UI, with file, stdin, or clipboard input and file, clipboard, or text-only stdout output; AI actions use providers configured in Settings and honor existing policies in #50834 by @MuyuanMS and @Copilot\r\n- Updated the Advanced Paste CLI for System.CommandLine 2.0, preserving existing commands, aliases, output formats, and help-like option values in #51230 by @LegendaryBlair and @Copilot\r\n\n## Command Palette\r\n\n- Replaced compact mode's vertical-position slider with a full-screen preview picker supporting drag, scroll, and keyboard controls, while reserving room for expanded search results in #51011 by @jiripolasek\r\n- Fixed blank details panes when extensions replace a content page's details, initializing new content and detaching the previous details in #51231\r\n- Fixed startup failures in applications launched from Command Palette by preventing them from inheriting its Windows App SDK runtime-dire","release_url":"https://github.com/microsoft/PowerToys/releases/tag/v0.102.2862.0","releases":[{"tag":"v0.102.2862.0","prerelease":true,"published_at":"2026-10-14T06:37:56Z","date":"2026-10-14","zh":"# PowerToys 预览版 v0.102.2862.0\n\n这是 **PowerToys 0.102 发布系列** 的预览通道版本，基于 `stable` 分支构建。 该版本继 v0.102.2851.0 之后发布；下文所述内容仅描述自该预览版以来的变更，而非 0.102 与 0.101 版本间的完整变更日志。此版本并非最终稳定版。\n\n## 亮点\r\n\n- **高级粘贴**：为内置和已保存的自定义操作添加了无界面命令行界面（CLI），支持文件、标准输入（stdin）和剪贴板工作流。\n- **命令面板**：为紧凑模式的垂直布局添加了全屏预览选择器。\r\n- **命令面板**：修复了因继承自 Windows App SDK 的运行时目录覆盖导致的已启动应用启动失败问题。\n- **命令面板**：修复了当扩展程序替换内容页面的详细信息时，详细信息窗格显示为空的问题。\r\n- **New+**：修复了上下文菜单的内存泄漏问题，并改进了模板目标和路径的处理。\n- **设置**：当模块无法加载或设置读取失败时，保留模块启用偏好设置。\n\n## 高级粘贴\r\n\n- 添加了无界面命令行工具（CLI），可在不打开用户界面的情况下运行内置和已保存的自定义操作，支持文件、标准输入（stdin）或剪贴板输入，以及文件、剪贴板或纯文本标准输出（stdout）；AI 操作使用“设置”中配置的提供程序，并遵循 @MuyuanMS 和 @Copilot 在 #50834 中提出的现有策略\r\n- 更新了“高级粘贴”CLI 以适配 System.CommandLine 2.0，保留了现有命令、别名、输出格式以及 @LegendaryBlair 和 @Copilot 在 #51230 中提出的类似帮助文档的选项值\n\n## 命令面板\r\n\n- 将紧凑模式中的垂直位置滑块替换为支持拖动、滚动和键盘控制的全屏预览选择器，同时为展开的搜索结果预留空间（参见 #51011，由 @jiripolasek 提交）\r\n- 修复了当扩展程序替换内容页面的详细信息时，详细信息窗格显示为空的问题，该问题发生在 #51231 中，当时系统会初始化新内容并脱离之前的详细信息\n- 修复了从命令面板启动的应用程序的启动失败问题，通过防止它们继承其 Windows App SDK 运行时-dire","body":"# PowerToys Preview v0.102.2862.0\r\n\nThis is a preview-channel build for the **PowerToys 0.102 release train**, produced from the `stable` branch. It follows v0.102.2851.0; the notes below describe changes since that preview, not the complete 0.102 versus 0.101 changelog. This is not the final stable release.\r\n\n## Highlights\r\n\n- **Advanced Paste**: Added a headless CLI for built-in and saved custom actions, with file, stdin, and clipboard workflows.\r\n- **Command Palette**: Added a full-screen preview picker for compact-mode vertical positioning.\r\n- **Command Palette**: Fixed startup failures in launched apps caused by an inherited Windows App SDK runtime-directory override.\r\n- **Command Palette**: Fixed blank details panes when extensions replace a content page's details.\r\n- **New+**: Fixed context-menu memory leaks and improved template destination and path handling.\r\n- **Settings**: Preserved module enablement preferences when modules cannot load or settings reads fail.\r\n\n## Advanced Paste\r\n\n- Added a headless CLI to run built-in and saved custom actions without opening the UI, with file, stdin, or clipboard input and file, clipboard, or text-only stdout output; AI actions use providers configured in Settings and honor existing policies in #50834 by @MuyuanMS and @Copilot\r\n- Updated the Advanced Paste CLI for System.CommandLine 2.0, preserving existing commands, aliases, output formats, and help-like option values in #51230 by @LegendaryBlair and @Copilot\r\n\n## Command Palette\r\n\n- Replaced compact mode's vertical-position slider with a full-screen preview picker supporting drag, scroll, and keyboard controls, while reserving room for expanded search results in #51011 by @jiripolasek\r\n- Fixed blank details panes when extensions replace a content page's details, initializing new content and detaching the previous details in #51231\r\n- Fixed startup failures in applications launched from Command Palette by preventing them from inheriting its Windows App SDK runtime-dire","release_url":"https://github.com/microsoft/PowerToys/releases/tag/v0.102.2862.0"},{"tag":"v0.102.2851.0","prerelease":true,"published_at":"2026-10-12T15:17:06Z","date":"2026-10-12","zh":"# PowerToys 预览版 v0.102.2851.0\n\n这是 **PowerToys 0.102 发布系列** 的预览通道版本，基于 `stable` 分支构建。 该版本继 v0.102.2814.0 之后发布；下文所述内容仅描述自该预览版以来的变更，而非 0.102 与 0.101 版本间的完整变更日志。此版本并非最终稳定版。\n\n## 亮点\r\n\n- **Quick Accent**：新增了可搜索的字符参考指南，包含 Unicode 描述并支持单击复制。\n- **ZoomIt**：当音频输入不可用时，通过实时音频步调控制和受限缓冲区，提高了录制可靠性。\n\n## 通用信息\r\n\n- @Copilot 在 #51065 中引入的更严格的分析器策略 **未包含在此预览版中**：该策略已在本构建之前在稳定版中完全撤销。CA1824、CA1720 和 MVVMTK0049 仍保留上一版预览版的警告策略。\r\n- 修复了 @LegendaryBlair 和 @Copilot 在 #51179 中提到的官方构建版本中“命令面板工具包”默认资源语言元数据的问题\n\n## 无边界鼠标\r\n\n- 移除了未使用的 Windows 兼容性依赖项，仅保留了“无边界鼠标”所需的包（由 @Copilot 在 #50883 中实现）\n\n## 快速重音\r\n\n- 在“设置”中添加了可搜索的字符参考指南，用于浏览语言映射、查看 Unicode 描述以及复制字符，所选语言集将优先显示（由 @daverayment 和 @Copilot 提交的 #49394 问题）\n\n## ZoomIt\r\n\n- 改进了在无音频输入时屏幕录制的可靠性，通过实时音频步进和有限缓冲实现，由 @foxmsft 在 #50934 中实现\n\n## 需要最终审核的更改\r\n\n直接稳定版提交 ef2d7537d507 完全回滚了 #51065，以恢复之前的分析器警告策略。#51179 中 Toolkit 元数据修复仍被保留。这是对一个中间阶段、未发布的更改的回滚，并非从之前的预览版中移除功能。","body":"# PowerToys Preview v0.102.2851.0\r\n\nThis is a preview-channel build for the **PowerToys 0.102 release train**, produced from the `stable` branch. It follows v0.102.2814.0; the notes below describe changes since that preview, not the complete 0.102 versus 0.101 changelog. This is not the final stable release.\r\n\n## Highlights\r\n\n- **Quick Accent**: Added a searchable character reference guide with Unicode descriptions and click-to-copy support.\r\n- **ZoomIt**: Improved recording reliability when audio inputs are unavailable, with real-time audio pacing and bounded buffering.\r\n\n## General\r\n\n- The stricter analyzer policy introduced in #51065 by @Copilot **is not included in this preview**: it was fully reverted on stable before this build. CA1824, CA1720, and MVVMTK0049 retain the previous preview's warning policy.\r\n- Fixed the Command Palette Toolkit's default resource language metadata in official builds in #51179 by @LegendaryBlair and @Copilot\r\n\n## Mouse Without Borders\r\n\n- Removed unused Windows compatibility dependencies and retained only the packages Mouse Without Borders needs in #50883 by @Copilot\r\n\n## Quick Accent\r\n\n- Added a searchable character reference guide in Settings to browse language mappings, view Unicode descriptions, and copy characters, with selected language sets shown first in #49394 by @daverayment and @Copilot\r\n\n## ZoomIt\r\n\n- Improved screen-recording reliability when audio inputs are unavailable, with real-time audio pacing and bounded buffering in #50934 by @foxmsft\r\n\n## Changes needing final review\r\n\nDirect stable commit ef2d7537d507 fully reverts #51065 to restore the previous analyzer warning policy. The Toolkit metadata fix in #51179 remains included. This is a rollback of an intermediate, unpublished change, not removal of a feature from the previous preview.","release_url":"https://github.com/microsoft/PowerToys/releases/tag/v0.102.2851.0"},{"tag":"v0.102.2814.0","prerelease":true,"published_at":"2026-10-09T09:30:02Z","date":"2026-10-09","zh":"# PowerToys 预览版 v0.102.2814.0\n\n这是 **PowerToys 0.102 发布系列** 的预览通道版本，基于 `stable` 分支构建。 该版本继 v0.102.2803.0 之后发布；下文所述内容仅描述自该预览版以来的变更，而非 0.102 与 0.101 版本之间的完整变更日志。此版本并非最终稳定版。\n\n## 亮点\r\n\n- **鼠标按钮锁定**：新增可选的左键、右键和中键锁定功能，以便在无需按住按钮的情况下继续拖拽和选择操作。\n- **灯开关**：新增用于状态查询、主题切换和计划任务控制的命令行界面（CLI），并支持 JSON 输出以实现自动化。\r\n- **设置**：新增命令行工具，用于检查模块状态，并在 PowerToys 关闭时保存启用/禁用设置的更改。\n- **命令面板**：修复了将打包应用拖拽至 Dock 时显示其加载图标的问题。\n- **快速重音**：恢复了字符列表溢出时的水平滚动条。\r\n- **快捷键指南**：优化了启动和索引功能，包括修复了快速重新打开导致的崩溃以及首次激活时的闪烁问题。\n- **设置**：将欢迎页面的动画 GIF 替换为静音循环播放的 H.264 视频，并添加了备用图片。\r\n- **ZoomIt**：修复了 DSC 配置，使其使用实际基于注册表的设置，并向正在运行的实用程序通知更改。\n\n## 命令面板\n\n- 修复了将打包应用拖放到 Dock 上的问题，确保固定条目能正确启动，且在加载时显示其图标（由 @jiripolasek 在 #51018 中提交）\r\n\n## Light Switch\n\n- 添加了一个命令行工具，用于查询状态、设置或切换已配置的主题目标，以及启用或禁用正在运行的 Light Switch 服务上的计划任务，并提供 JSON 输出以支持自动化（#50459）\n\n## 鼠标按钮锁定\r\n\n- 添加了可选的鼠标按钮锁定功能，支持左键、右键和中键，这样在长按后仍可继续拖动和选择，而无需持续按住按钮（由 @MuyuanMS 和 @owenpkent 提交的 #49279 问题）\n\n## 快速重音\r\n\n- 恢复了字符列表溢出时的水平滚动条，以便“快速重音”功能能显示当前位置，且不会裁剪滚动条","body":"# PowerToys Preview v0.102.2814.0\r\n\nThis is a preview-channel build for the **PowerToys 0.102 release train**, produced from the `stable` branch. It follows v0.102.2803.0; the notes below describe changes since that preview, not the complete 0.102 versus 0.101 changelog. This is not the final stable release.\r\n\n## Highlights\r\n\n- **Mouse Button Lock**: Added opt-in left, right, and middle button locking so dragging and selection can continue without holding a button down.\r\n- **Light Switch**: Added a CLI for status, theme switching, and schedule control, with JSON output for automation.\r\n- **Settings**: Added a CLI to inspect module states and save enable/disable changes while PowerToys is closed.\r\n- **Command Palette**: Fixed dragging packaged apps onto the dock and displaying their loaded icons.\r\n- **Quick Accent**: Restored the horizontal scrollbar for overflowing character lists.\r\n- **Shortcut Guide**: Improved startup and indexing, including fixes for rapid-reopen crashes and first-activation flicker.\r\n- **Settings**: Replaced animated welcome-page GIFs with muted, looping H.264 videos and a fallback image.\r\n- **ZoomIt**: Fixed DSC configuration to use actual registry-backed settings and notify the running utility of changes.\r\n\n## Command Palette\r\n\n- Fixed dragging packaged apps onto the dock so pinned entries launch correctly and their icons appear when loaded in #51018 by @jiripolasek\r\n\n## Light Switch\r\n\n- Added a CLI to query status, set or toggle configured theme targets, and enable or disable schedules on the running Light Switch service, with JSON output for automation in #50459\r\n\n## Mouse Button Lock\r\n\n- Added opt-in Mouse Button Lock for left, right, and middle buttons so dragging and selection can continue after a long press without continuously holding a button in #49279 by @MuyuanMS and @owenpkent\r\n\n## Quick Accent\r\n\n- Restored the horizontal scrollbar for overflowing character lists so Quick Accent shows the current position without clipping the scrol","release_url":"https://github.com/microsoft/PowerToys/releases/tag/v0.102.2814.0"}]},{"full":"1c7/chinese-independent-developer","url":"https://github.com/1c7/chinese-independent-developer","desc":"👩🏿‍💻👨🏾‍💻👩🏼‍💻👨🏽‍💻👩🏻‍💻中国独立开发者项目列表 -- 分享大家都在做什么","lang":"—","stars":61798,"topics":["china","indie","indie-developer"],"cats":["learning"],"primary":"learning","tags":[],"categoryConfidence":"override","tag":null,"prerelease":false,"published_at":"2026-10-14T06:18:41Z","date":"2026-10-14","zh":null,"body":null,"release_url":null,"releases":[]},{"full":"Ajaxc/WeChatList","url":"https://github.com/Ajaxc/WeChatList","desc":"微信文章导出","lang":"HTML","stars":260,"topics":[],"cats":["data"],"primary":"data","tags":["wechat"],"categoryConfidence":"override","tag":"2.5.2","prerelease":false,"published_at":"2026-10-14T05:51:57Z","date":"2026-10 lished_at":"2026-10-08T17:10:00Z","date":"2026-10-08","zh":"🆕 新增功能\n• 更新至 12.10.6\n• 新增 MD3 风格播放器：支持 LRCLIB 歌词、播放队列、迷你播放器、平滑切换至全屏播放器以及“返回”手势\n• 应用图标选择界面（感谢 avjx2d6）\n• 在 exteraless 设置中点击徽标即可弹出更新窗口\n• 打开和粘贴链接时移除跟踪信息（感谢 Inugram）\n• 从 AyuGram 导入已删除消息数据库，并导出自己的数据库\n• AyuMoments：分版块设置、不保存存档聊天消息的选项、反向正则表达式过滤器\n• 通过个人资料 ID 行中的按钮查看账号注册日期和加入聊天室日期\n• 贴纸侧边显示时间\n• 回复转发消息时，可查看转发者及其来源\n• 在“在线状态”显示为相对时间时，个人资料中显示精确的上线时间\n• 计算器：e=和π=的提示，任意底数的对数，支持所有货币 @calcmulabot\n• 动态消息：新增“添加新频道”切换按钮\n• 在本地高级版中，“所有聊天”文件夹可拖动\n• 富文本消息中的 tg://emoji 链接\n• 从文件夹邀请窗口直接进入聊天\n• 长按设置项时，会弹出包含描述和“复制链接”功能的迷你窗口\n• 设置界面已重新组织： “聊天”已分为“菜单”、“媒体”和“隐藏”，而翻译、固定聊天和 Glyph 已移至“基本”\n• 设置搜索可找到更多项目（exteraless）\n• Glyph 设置仅在 Nothing 手机上显示（感谢 ellerotta）\n• 支持 SVG 格式的图标包\n• 应用图标上的“安全模式”快捷方式可立即生效\n\n⚙️ 已修复\n• 推送：如果 FCM 或 UnifiedPush 未返回令牌，则会自动启用内置服务（包括在 microG 环境下）\n• 通知中的头像\n• 在其他播放器中播放的音乐会在语音和圈子结束后继续播放\n• 回复已删除的消息及滑动回复。相册中的引用功能现仅限第一张照片\n• 幽灵模式：@标记和回复在已读后不再显示\n• 多项性能优化：聊天列表、论坛主题、个人资料、媒体、菜单打开速度\n• 点击“下载”时、在动画媒体中以及聊天列表顶部会出现崩溃\n• 顶部栏在","body":"🆕 Новое\n• Обновление до 12.10.6\n• Новый плеер в стиле MD3: тексты песен с LRCLIB, очередь, мини-плеер, плавный переход в полноэкранный плеер и жест «назад»\n• Экран выбора иконки приложения (thx avjx2d6)\n• Окно обновлений по нажатию на логотип в настройках exteraless\n• Удаление трекинга из ссылок при открытии и вставке (thx Inugram)\n• Импорт базы удалённых сообщений из AyuGram и экспорт своей\n• AyuMoments: настройки по разделам, опция не сохранять сообщения из архивных чатов, обратные regex-фильтры\n• Дата регистрации аккаунта и вступления в чат по кнопке в строке ID профиля\n• Время сбоку на стикерах\n• В ответе на пересланное сообщение видно, кто переслал и откуда\n• Точное время захода в профиле при относительном «был в сети»\n• Калькулятор: подсказка для e= и π=, логарифмы по любому основанию, все валюты @calcmulabot\n• Лента: переключатель «Добавлять новые каналы»\n• В локальном премиуме папку «Все чаты» можно двигать\n• Ссылки tg://emoji в rich-сообщениях\n• Переход в чат из окна приглашения в папку\n• Мини-окно с описанием и «Копировать ссылку» при долгом нажатии на настройку\n• Настройки пересобраны: «Чаты» разделены на «Меню», «Медиа» и «Скрытие», а перевод, закреплённые чаты и Glyph перенесены в «Основные»\n• Поиск по настройкам находит больше пунктов exteraless\n• Настройки Glyph показываются только на телефонах Nothing (thx ellerotta)\n• Поддержка иконпаков в формате SVG\n• Ярлык «Безопасный режим» на иконке приложения срабатывает сразу\n\n⚙️ Исправлено\n• Пуши: если FCM или UnifiedPush не выдали токен, сама включается встроенная служба (в том числе с microG)\n• Аватарки в уведомлениях\n• Музыка в других плеерах продолжается после голосовых и кружков\n• Ответ на удалённое сообщение и свайп для ответа. Цитата в альбоме теперь только у первого фото\n• Призрак: значки @ и ответы не возвращаются после прочтения\n• Много ускорений: список чатов, темы форумов, профиль, медиа, открытие меню\n• Вылеты при нажатии на «Загрузки», в анимированных медиа и в шапке списка чатов\n• Шапка при ж","release_url":"https://github.com/exteraless/exteraless/releases/tag/v12.10.6-beta14"},{"tag":"v12.10.5-beta13.1","prerelease":false,"published_at":"2026-09-30T17:11:03Z","date":"2026-09-30","zh":null,"body":null,"release_url":"https://github.com/exteraless/exteraless/releases/tag/v12.10.5-beta13.1"}]},{"full":"Aethersailor/Custom_OpenClash_Rules","url":"https://github.com/Aethersailor/Custom_OpenClash_Rules","desc":"面向 OpenClash 用户的配置、订阅转换模板、YAML、规则、覆写模块、脚本与中文教程。","lang":"Shell","stars":6618,"topics":["clash","clash-meta","gfwlist","openclash","openwrt","ruleset","vless"],"cats":["rules"],"primary":"rules","tags":["proxy"],"categoryConfidence":"rule","tag":null,"prerelease":false,"published_at":"2026-10-13T19:43:41Z","date":"2026-10-13","zh":null,"body":null,"release_url":null,"releases":[]},{"full":"JushiZen/Nimbus.Player","url":"https://github.com/JushiZen/Nimbus.Player","desc":"云幕 Nimbus Player: 产品介绍与问题反馈","lang":"—","stars":126,"topics":["anime","bilibili","danmaku","emby","htpc","jellyfin","media-center","media-player","mpv","nimbus-player","plex","smb","subtitles","tmdb","video-player","webdav","windows"],"cats":["media"],"primary":"media","tags":["windows"],"categoryConfidence":"override","tag":null,"prerelease":false,"published_at":"2026-10-13T18:39:09Z","date":"2026-10-13","zh":null,"body":null,"release_url":null,"releases":[]},{"full":"Inginnng/EditHere","url":"https://github.com/Inginnng/EditHere","desc":"EditHere — 截图、写下意见、直接调整布局，把修改意图一次交给 AI。","lang":"C++","stars":477,"topics":[],"cats":["dev"],"primary":"dev","tags":[],"categoryConfidence":"rule","tag":"v0.11.1","prerelease":false,"published_at":"2026-10-13T17:56:17Z","date":"2026-10-13","zh":"**简体中文** · English\n\n本次更新统一桌面与 Web 的操作图标，让同一功能在不同界面中保持一致，常用操作更容易辨认。\n\n- **一套图标，统一风格**：共用 67 个 SVG 操作图标，61 个采用 Lucide 1.55.0，6 个为 EditHere 自有或改绘图形。线宽、圆角、留白与状态遵循同一规范，品牌图和品牌文字继续沿用现有素材。图标随程序内置，无需联网加载。\n- **确认三项专用图形**：长截图使用长画面与上下箭头（`scroll-frame-arrows`），圆角使用平滑连续的大圆角轮廓（`corner-one-large`），大爆炸使用组件拆出的图形（`explode-blocks`）。\n- **裁去图标保持对称**：上、下、左、右四个方向采用配对的断线与圆弧，间距和旋转关系一致，修复原先自动虚线造成的不对称。\n- **不同操作更容易区分**：项目、图片、JSON 文件、JSON 内容和反馈目录分别使用对应图形；添加批注、放大、撤销、恢复默认、应用设置和组件布局也明确区分。\n- **图标与实际状态一致**：新图片载入后同步批注显隐图标与提示；长截图停止后恢复四向移动指示。统一浅色、深色、选中和禁用状态，固定深色截图工具条保留清晰的浅色图标。\n- 保留独立 HTML 图标方案页，可查看实际按钮尺寸、明暗效果、功能对应关系与备选方案。\n- **发布页提供 Web 版包**：本版发布资产新增 `EditHere-web.zip`（离线单文件网页版）与 `EditHere-web-agent.zip`（供 Agent 宿主内嵌批注使用，需 Node.js 20+）。\n\n---","body":"## English\n\nThis update unifies action icons across desktop and Web interfaces so the same function is easier to recognize wherever it appears.\n\n- **One consistent icon set**: 67 shared SVG action icons, including 61 from Lucide 1.55.0 and 6 original or adapted EditHere designs. Stroke width, rounded geometry, spacing and states follow the same specification. Existing brand artwork and lettering are retained. Icons are bundled with the application and do not require network access.\n- **Three confirmed designs**: scrolling capture uses a tall frame with vertical arrows (`scroll-frame-arrows`); rounded corners use a smooth continuous contour (`corner-one-large`); Explode uses a component separating from a group (`explode-blocks`).\n- **Symmetric trim icons**: the top, bottom, left and right variants use paired broken lines and arcs with consistent spacing and rotation. This fixes the asymmetry caused by automatic dash placement.\n- **Clearer action meanings**: projects, images, JSON files, JSON text and feedback folders have their own symbols. Adding annotations, zooming, undoing, resetting, application settings and component layout are also distinct.\n- **Icons match the actual state**: loading an image resets annotation visibility icons and labels together; stopping scrolling capture restores the four-direction movement indicator. Light, dark, selected and disabled states are consistent, while fixed dark capture toolbars retain readable light icons.\n- The standalone HTML icon review page remains available for comparing actual button sizes, light and dark backgrounds, function mappings and alternatives.\n- **Web packages on the release page**: this release also ships `EditHere-web.zip` (offline single-file web edition) and `EditHere-web-agent.zip` (for annotation inside Agent hosts; requires Node.js 20+).\n\n## What's Changed\n* 0.11.1：共享操作图标统一，发布页连带两种 Web 包 by @Inginnng in https://github.com/Inginnng/EditHere/pull/13\n\n**Full Changelog**: https://github.com/Inginnng/EditHer","release_url":"https://github.com/Inginnng/EditHere/releases/tag/v0.11.1","releases":[{"tag":"v0.11.1","prerelease":false,"published_at":"2026-10-13T17:56:17Z","date":"2026-10-13","zh":"**简体中文** · English\n\n本次更新统一桌面与 Web 的操作图标，让同一功能在不同界面中保持一致，常用操作更容易辨认。\n\n- **一套图标，统一风格**：共用 67 个 SVG 操作图标，61 个采用 Lucide 1.55.0，6 个为 EditHere 自有或改绘图形。线宽、圆角、留白与状态遵循同一规范，品牌图和品牌文字继续沿用现有素材。图标随程序内置，无需联网加载。\n- **确认三项专用图形**：长截图使用长画面与上下箭头（`scroll-frame-arrows`），圆角使用平滑连续的大圆角轮廓（`corner-one-large`），大爆炸使用组件拆出的图形（`explode-blocks`）。\n- **裁去图标保持对称**：上、下、左、右四个方向采用配对的断线与圆弧，间距和旋转关系一致，修复原先自动虚线造成的不对称。\n- **不同操作更容易区分**：项目、图片、JSON 文件、JSON 内容和反馈目录分别使用对应图形；添加批注、放大、撤销、恢复默认、应用设置和组件布局也明确区分。\n- **图标与实际状态一致**：新图片载入后同步批注显隐图标与提示；长截图停止后恢复四向移动指示。统一浅色、深色、选中和禁用状态，固定深色截图工具条保留清晰的浅色图标。\n- 保留独立 HTML 图标方案页，可查看实际按钮尺寸、明暗效果、功能对应关系与备选方案。\n- **发布页提供 Web 版包**：本版发布资产新增 `EditHere-web.zip`（离线单文件网页版）与 `EditHere-web-agent.zip`（供 Agent 宿主内嵌批注使用，需 Node.js 20+）。\n\n---","body":"## English\n\nThis update unifies action icons across desktop and Web interfaces so the same function is easier to recognize wherever it appears.\n\n- **One consistent icon set**: 67 shared SVG action icons, including 61 from Lucide 1.55.0 and 6 original or adapted EditHere designs. Stroke width, rounded geometry, spacing and states follow the same specification. Existing brand artwork and lettering are retained. Icons are bundled with the application and do not require network access.\n- **Three confirmed designs**: scrolling capture uses a tall frame with vertical arrows (`scroll-frame-arrows`); rounded corners use a smooth continuous contour (`corner-one-large`); Explode uses a component separating from a group (`explode-blocks`).\n- **Symmetric trim icons**: the top, bottom, left and right variants use paired broken lines and arcs with consistent spacing and rotation. This fixes the asymmetry caused by automatic dash placement.\n- **Clearer action meanings**: projects, images, JSON files, JSON text and feedback folders have their own symbols. Adding annotations, zooming, undoing, resetting, application settings and component layout are also distinct.\n- **Icons match the actual state**: loading an image resets annotation visibility icons and labels together; stopping scrolling capture restores the four-direction movement indicator. Light, dark, selected and disabled states are consistent, while fixed dark capture toolbars retain readable light icons.\n- The standalone HTML icon review page remains available for comparing actual button sizes, light and dark backgrounds, function mappings and alternatives.\n- **Web packages on the release page**: this release also ships `EditHere-web.zip` (offline single-file web edition) and `EditHere-web-agent.zip` (for annotation inside Agent hosts; requires Node.js 20+).\n\n## What's Changed\n* 0.11.1：共享操作图标统一，发布页连带两种 Web 包 by @Inginnng in https://github.com/Inginnng/EditHere/pull/13\n\n**Full Changelog**: https://github.com/Inginnng/EditHer","release_url":"https://github.com/Inginnng/EditHere/releases/tag/v0.11.1"},{"tag":"v0.11.0","prerelease":false,"published_at":"2026-10-13T16:45:57Z","date":"2026-10-13","zh":"**简体中文** · English\r\n\n为了降低EditHere的使用难度，同时简化使用方法，本次更新新增了Web版本的EditHere，可以直接在各类IDE侧边呼出，直接进行批注并反馈AI，同时实现了配套skills，适合用于快速使用EditHere功能。但Web版本EditHere尚未完整适配截图，其截图功能存在部分不足，并且依赖于Agent唤起，如需快速截图批注仍推荐桌面程序版本。\r\n\n- **IDE侧边小面板也能方便批注**：针对IDE侧边浏览器常态化为小面板进行适配，顶栏根据可用宽度收紧，批注编辑与组件布局按需展开，适应近似正方形和纵向面板。\r\n- **在 Agent 中完成反馈**：支持 MCP Apps 的宿主可接收图片、打开批注界面并取回结构化反馈。展开到右侧还是显示在对话中由宿主决定；反馈先保存再回传，通信失败可重试，重新打开可恢复已保存草稿。\r\n- **保存按钮按你的选择工作**：可选保存 JSON 文件、复制 JSON 内容、保存项目或查看 JSON 文件；下拉只切换选择，点击主按钮才执行。文件与复制内容一致，可选择是否附带原图，并查看批注数、位移数与体积。\r\n- **接入更方便**：新增网页版安装指南（`web/AI-SETUP.md`）与本地预览脚本（`web/preview.cjs`）；首次接入把指南和安装包一起交给 Agent 即可。\r\n- 图片反馈保持桌面兼容的 JSON 结构、批注顺序和坐标精度。Web 和 Web Agent 分别打包；桌面与 Web 的入口和平台限制仍以各包说明为准。\r\n- **发布资产提供 Web 版包**：`EditHere-web.zip` 是离线单文件网页版，双击即可使用，不需要 Node.js；`EditHere-web-agent.zip` 供支持 MCP Apps 的宿主内嵌批注，需要 Node.js 20+。\r\n\n---","body":"## English\r\n\nThis update improves Web and Agent annotation, feedback delivery, saving and setup.\r\n\n- **Annotate comfortably in a small panel**: existing brand assets are retained, the toolbar adapts to available width, and annotation editing and component layout expand when needed. Square and portrait panels leave more room for the image.\r\n- **Complete feedback inside an Agent**: hosts supporting MCP Apps can receive an image, show the annotation interface and retrieve structured feedback. The host controls whether it opens in the conversation or a side panel. Feedback is saved before delivery, failed delivery can be retried, and reopening restores saved drafts.\r\n- **The save button follows your choice**: choose Save JSON file, Copy JSON content, Save project or View JSON file. The menu changes the selection; the main button performs it. Files and copied content match, with an option to include the source image and counts and size information.\r\n- **Easier setup**: added the Web installation guide (`web/AI-SETUP.md`) and a local preview script (`web/preview.cjs`); for first-time setup, hand the guide and the package to your Agent.\r\n- Removed the standalone HTML download and 1:1 buttons; offline editing uses the standalone HTML from the distribution. Added visual tutorials and recovery guidance for feedback, clipboard and image issues.\r\n- Image feedback retains the desktop-compatible JSON structure, annotation order and coordinate precision. Web and Web Agent are packaged separately; entry points and platform limits remain documented in each package.\r\n- **Web packages are now attached to this release**: `EditHere-web.zip` is the standalone single-file web edition (open it directly, no Node.js needed); `EditHere-web-agent.zip` provides the MCP Apps connector for supported hosts and requires Node.js 20+.\r\n\n## What's Changed\r\n* 0.11.0：Web 版编辑器与 MCP Apps 批注 by @Inginnng in https://github.com/Inginnng/EditHere/pull/12\r\n\n## New Contributors\r\n* @Inginnng made their first con","release_url":"https://github.com/Inginnng/EditHere/releases/tag/v0.11.0"},{"tag":"v0.10.5","prerelease":false,"published_at":"2026-10-10T08:52:10Z","date":"2026-10-10","zh":"**简体中文** · English\n\n本次更新修复由 AI 工具启动的 EditHere 可能随调用方一起被关闭的问题，并让标注完成后的反馈在回执中断时也能取回。\n\n- **批注窗口不再中途消失**：以前由 AI 工具启动的 EditHere 仍受调用方约束，调用方退出时会被一起关闭，批注窗口随之消失、已写出的反馈也难以确认。现在桌面程序独立启动，并在打开界面前确认已脱离调用方；调用方不允许独立启动时，会提示先手动打开 EditHere 再重试，不再无提示地失败。\n- **反馈不再因为回执中断而丢失**：桌面程序已写好反馈、命令行回执却在返回途中断开时，连接器改为读取这次会话的反馈文件、核对无误后照常返回结果，并说明此时只代表反馈已保存。\n- 取消、超时和被拒绝的请求仍按原样报告，不会因为磁盘上有同名文件就被当成成功；文件缺失、被截断、不是普通文件或内容不完整时明确失败，并提示 EditHere 中的编辑内容仍然保留。\n- 连接器进程重启后，先读取发起时返回的反馈文件路径、确认是否已有完整反馈，再决定要不要重新发起标注，避免重复批注。\n- 增加标注会话的开始、提交、完成与正常退出日志，便于区分「没有提交」和「提交后通信中断」。日志不记录任何批注内容，也不会自动上传。\n\n---","body":"## English\n\nThis update fixes EditHere being closed together with the AI tool that launched it, and recovers the finished annotation feedback when the command receipt is interrupted.\n\n- **The annotation window no longer disappears mid-session**: EditHere launched by an AI tool used to stay bound to its caller, so quitting the caller closed it too, taking the annotation window with it and making the written feedback hard to confirm. The desktop now starts independently and confirms it has left the caller before showing its window. When the caller does not permit that, EditHere asks you to open it manually and retry instead of failing silently.\n- **Feedback is no longer lost to an interrupted receipt**: if the desktop has already written the feedback file but the CLI receipt never arrives, the connector now reads this session's feedback file, checks it and returns the result as usual, noting that this only confirms the feedback was saved.\n- Cancelled, timed-out and otherwise rejected requests still report their original outcome; a file with the same name on disk never turns them into a success. Missing, truncated or non-regular files, and structurally incomplete feedback, still fail, and you are told that your edits in EditHere are preserved.\n- After a connector restart, the feedback path returned when the session started is read first, to see whether a complete feedback file already exists before starting another annotation, avoiding duplicate work.\n- Added session logs for start, feedback commit, completion and normal exit, telling \"never submitted\" apart from \"submitted but the connection dropped\". The logs never contain annotation text and are never uploaded automatically.\n\n**Full Changelog**: https://github.com/Inginnng/EditHere/compare/v0.10.4...v0.10.5","release_url ","url":"https://github.com/7723mod/NPatch","desc":"NPatch是一个复刻自LSPatch，以LSPosed为基础的免root的Xposed框架","lang":"Kotlin","stars":2502,"topics":["lspatch","rootless","xposed"],"cats":["system"],"primary":"system","tags":["android"],"categoryConfidence":"override","tag":"v1.0.9","prerelease":false,"published_at":"2026-10-12T12:22:42Z","date":"2026-10-12","zh":"## 英语\n\n### 🛡️ 加载器与签名绕过\n\n- **崩溃修复**：修复了启动时因无效 JNI 本地引用导致的崩溃（#139）；在 SECCOMP 模式下跳过原生 `openat` 重定向以避免重复重写；HIGH 级别现共享 360 保护兼容性回退机制。\n- **在管理器关闭时启动**：当管理器未运行时，加载器仅等待 800 毫秒后便从本地快照启动，而非在 2 秒的绑定过程中停滞。超时后，它会向 ConfigProvider 查询最新的模块范围，因此新增或移除的模块无需等待下次启动即可生效。 查询失败不再覆盖快照。\n- **极致级别 `svc` 插桩**：现已支持手动编写的内联 `svc #0` 系统调用（打包工具和反作弊机制用于绕过 libc 钩子），仅限 arm64 架构且需手动启用。\n- **崩溃日志桥接**：已恢复模块和内核崩溃日志，诊断导出功能可通过 Shizuku 捕获 logcat 信息。\n\n### 🔧 管理器修复\n\n- 修复了在受限环境中模块扫描结果丢失的问题，该问题可能导致已配置的模块被清除。\n- 恢复了 Companion 激活推送以及独立于 Shizuku 的双轨推送。\n- 修复了打包多个选定 APK 时出现白屏的问题；现在，选择多个基础 APK 时会显示选择菜单。\n\n### 🎨 管理器 UI：Miuix\n\n- **Miuix 0.9.4**：管理器 UI 从 COUI 迁移至稳定的 Miuix 0.9.4 组件库，导航功能迁移至 miuix-nav，因此滑动返回操作更加流畅且一致。\n- **应用详情页**：在“管理”界面点击应用后，现将打开按状态/操作/系统/危险区域分类的专用详情页，取代了在小屏幕上会被截断的弹出菜单。加载器版本、模块数量和签名绕过级别均直接显示在页面上。\n- **对话框与背景优化**：对话框按钮在长文本语言环境下不再出现排版错位，次级页面采用纯色背景，因此自定义背景图片不再透出。\n- **持久通知**：支持可选的持久通知和开机启动功能","body":"## English\n\n### 🛡️ Loader & Signature Bypass\n\n- **Crash Fixes**: Fixed an invalid JNI local reference crash on launch (#139); skip the native `openat` redirect in SECCOMP mode to avoid double rewriting; HIGH level now shares the 360-protection compatibility fallback.\n- **Start with Manager Closed**: When the Manager is not running, the loader starts from the local snapshot after waiting only 800 ms instead of stalling on a 2 s bind. On timeout it asks ConfigProvider for the latest module scope, so added/removed modules take effect without waiting for the next launch. A failed query no longer overwrites the snapshot.\n- **EXTREME Level `svc` Instrumentation**: Hand-written inline `svc #0` syscalls (used by packers and anti-cheat to bypass libc hooks) are now covered, arm64 only and opt-in.\n- **Crash Log Bridge**: Module and core crash logs are restored, and diagnostic export can capture logcat through Shizuku.\n\n### 🔧 Manager Fixes\n\n- Fixed module scan results being lost in restricted environments, which could wipe configured modules.\n- Restored Companion activation push and Shizuku-independent dual-track push.\n- Fixed a white screen when packaging multiple selected APKs; multiple base APKs now offer a selection menu.\n\n### 🎨 Manager UI: Miuix\n\n- **Miuix 0.9.4**: The Manager UI moves from COUI to the stable Miuix 0.9.4 component library, with navigation migrated to miuix-nav so swipe-back is smooth and consistent.\n- **App Detail Page**: Tapping an app in Manage now opens a dedicated detail page grouped by status / actions / system / danger zone, replacing the popup menu that got clipped on small screens. Loader version, module count and signature bypass level are shown right on the page.\n- **Dialog & Background Polish**: Dialog buttons no longer break awkwardly in longer languages, and secondary pages use a solid background so a custom background image no longer bleeds through.\n- **Keep-alive Notification**: Optional persistent notification and start-on-boot support","release_url":"https://github.com/7723mod/NPatch/releases/tag/v1.0.9","releases":[{"tag":"v1.0.9","prerelease":false,"published_at":"2026-10-12T12:22:42Z","date":"2026-10-12","zh":"## 英语\n\n### 🛡️ 加载器与签名绕过\n\n- **崩溃修复**：修复了启动时因无效 JNI 本地引用导致的崩溃（#139）；在 SECCOMP 模式下跳过原生 `openat` 重定向以避免重复重写；HIGH 级别现共享 360 保护兼容性回退机制。\n- **在管理器关闭时启动**：当管理器未运行时，加载器仅等待 800 毫秒后便从本地快照启动，而非在 2 秒的绑定过程中停滞。超时后，它会向 ConfigProvider 查询最新的模块范围，因此新增或移除的模块无需等待下次启动即可生效。 查询失败不再覆盖快照。\n- **极致级别 `svc` 插桩**：现已支持手动编写的内联 `svc #0` 系统调用（打包工具和反作弊机制用于绕过 libc 钩子），仅限 arm64 架构且需手动启用。\n- **崩溃日志桥接**：已恢复模块和内核崩溃日志，诊断导出功能可通过 Shizuku 捕获 logcat 信息。\n\n### 🔧 管理器修复\n\n- 修复了在受限环境中模块扫描结果丢失的问题，该问题可能导致已配置的模块被清除。\n- 恢复了 Companion 激活推送以及独立于 Shizuku 的双轨推送。\n- 修复了打包多个选定 APK 时出现白屏的问题；现在，选择多个基础 APK 时会显示 d signature bypass level are shown right on the page.\n- **Dialog & Background Polish**: Dialog buttons no longer break awkwardly in longer languages, and secondary pages use a solid background so a custom background image no longer bleeds through.\n- **Keep-alive Notification**: Optional persistent notification and start-on-boot support","release_url":"https://github.com/7723mod/NPatch/releases/tag/v1.0.9"},{"tag":"v1.0.8","prerelease":false,"published_at":"2026-09-27T08:23:19Z","date":"2026-09-27","zh":null,"body":null,"release_url":"https://github.com/7723mod/NPatch/releases/tag/v1.0.8"},{"tag":"Canary-762","prerelease":true,"published_at":"2026-08-21T07:29:00Z","date":"2026-08-21","zh":null,"body":null,"release_url":"https://github.com/7723mod/NPatch/releases/tag/Canary-762"}]},{"full":"x554960766/wechat-mp-tools","url":"https://github.com/x554960766/wechat-mp-tools","desc":"微信公众号采集、视频号高清视频解析、抖音全能下载、小红书下载、快手、B站批量下载","lang":"Python","stars":199,"topics":[],"cats":["data"],"primary":"data","tags":["wechat"],"categoryConfidence":"rule","tag":"v2.2.0","prerelease":false,"published_at":"2026-10-12T12:00:22Z","date":"2026-10-12","zh":"**完整更新日志**：https://github.com/x554960766/wechat-mp-tools/compare/v2.1.0...v2.2.0","body":"**Full Changelog**: https://github.com/x554960766/wechat-mp-tools/compare/v2.1.0...v2.2.0","release_url":"https://github.com/x554960766/wechat-mp-tools/releases/tag/v2.2.0","releases":[{"tag":"v2.2.0","prerelease":false,"published_at":"2026-10-12T12:00:22Z","date":"2026-10-12","zh":"**完整更新日志**：https://github.com/x554960766/wechat-mp-tools/compare/v2.1.0...v2.2.0","body":"**Full Changelog**: https://github.com/x554960766/wechat-mp-tools/compare/v2.1.0...v2.2.0","release_url":"https://github.com/x554960766/wechat-mp-tools/releases/tag/v2.2.0"},{"tag":"v2.1.0","prerelease":false,"published_at":"2026-10-10T05:47:01Z","date":"2026-10-10","zh":"**完整更新日志**：https://github.com/x554960766/wechat-mp-tools/compare/v2.0.9...v2.1.0","body":"**Full Changelog**: https://github.com/x554960766/wechat-mp-tools/compare/v2.0.9...v2.1.0","release_url":"https://github.com/x554960766/wechat-mp-tools/releases/tag/v2.1.0"},{"tag":"v2.0.9","prerelease":false,"published_at":"2026-09-29T10:12:47Z","date":"2026-09-29","zh":null,"body":null,"release_url":"https://github.com/x554960766/wechat-mp-tools/releases/tag/v2.0.9"}]},{"full":"1zumiii/AppOpsNext","url":"https://github.com/1zumiii/AppOpsNext","desc":"Modern Android 15+ AppOps manager powered by Shizuku.","lang":"Kotlin","stars":70,"topics":[],"cats":["system"],"primary":"system","tags":["android"],"categoryConfidence":"override","tag":"v1.6.5-beta2","prerelease":true,"published_at":"2026-10-12T11:51:58Z","date":"2026-10-12","zh":"## 简体中文\r\n\n本测试版基于 1.6.5-beta1，主要改进多选、批量操作、刷新和访问监测的交互，并修复若干问题。本版本支持覆盖安装 1.6.0 和 1.6.5-beta1。\r\n\n### 新增与改进\r\n\n- 批量操作确认时显示目标模式和待修改项目清单。清单较长时默认折叠，可展开查看。\r\n- 批量操作结果新增“仅失败”筛选。失败项显示简短原因，可展开查看细节。\r\n- 模板“管理权限”、权限历史“选择要查看的权限”和访问监测的监测点列表中，已选项目优先显示，其余项目保持原有顺序。列表打开期间，勾选或取消选择不会改变排列顺序。\r\n- 模板“管理权限”显示已选数量，搜索无结果时显示提示，入口移至规则列表上方。\r\n- 应用页和“权限变更监听者”页面支持下拉刷新。监听者页面的说明移至信息按钮。\r\n- 搜索框新增清空按钮。权限历史的应用筛选支持按应用名和包名搜索。\r\n- 监测记录支持按应用和权限筛选，可与允许、拒绝筛选组合使用。\r\n- “按权限查看”中，模式为“忽略”的项目补充显示对应运行时权限的授权状态。\r\n- 优化部分 Android 16 设备上的权限修改流程。同一应用的同一项权限在确认需要兼容处理后，后续修改优先使用该方式，减少重复失败的尝试。\r\n\n### 修复\r\n\n- 修复 beta1 中权限详情页从后台返回时不刷新的问题。\r\n- 修复取消批量操作确认后已选项目被清空的问题。\r\n- 修复屏幕旋转后已选项目丢失的问题。\r\n- 没有权限规则的模板不再允许套用，并显示提示。\r\n- 修复监听者数据较多时“权限变更监听者”页面无法加载的问题。\r\n- 修复访问监测的应用搜索无结果时页面空白的问题。","body":"## English\r\n\nThis beta is based on 1.6.5-beta1. It improves interaction in multi-select, batch operations, refreshing and the access monitor, and fixes several issues. It can be installed over 1.6.0 and 1.6.5-beta1.\r\n\n### New and improved\r\n\n- Batch confirmations now show the target mode and the list of items to change. Long lists are collapsed by default and can be expanded.\r\n- Batch results add a Failures only filter. Failed items show a short reason, with details available on expansion.\r\n- Template Manage permissions, Choose permissions to show in Permission history, and the monitoring points list in Access monitor now show selected items first, with the rest in their original order. Checking or unchecking items while the list is open does not change the order.\r\n- Template Manage permissions shows the selected count and a message when a search has no results. Its entry moved above the rules list.\r\n- The Apps page and the Permission change listeners page support pull to refresh. The listeners page explanation moved behind the info button.\r\n- Search fields have a clear button. The app filter in Permission history supports searching by app name and package name.\r\n- Monitor log can be filtered by app and permission, in combination with the allowed and denied filters.\r\n- In the By permission view, items in Ignore mode also show whether the corresponding runtime permission is granted.\r\n- Improved permission changes on some Android 16 devices. Once a permission of an app is confirmed to need compatibility handling, later changes to the same permission of that app use that method first, avoiding repeated failed attempts.\r\n\n### Fixed\r\n\n- Fixed permission details not refreshing when returning from the background, introduced in beta1.\r\n- Fixed selections being cleared after cancelling a batch confirmation.\r\n- Fixed selections being lost after rotating the screen.\r\n- Templates without permission rules can no longer be applied and show a notice instead.\r\n- Fixed the Permission","release_url":"https://github.com/1zumiii/AppOpsNext/releases/tag/v1.6.5-beta2","releases":[{"tag":"v1.6.5-beta2","prerelease":true,"published_at":"2026-10-12T11:51:58Z","date":"2026-10-12","zh":"## 简体中文\r\n\n本测试版基于 1.6.5-beta1，主要改进多选、批量操作、刷新和访问监测的交互，并修复若干问题。本版本支持覆盖安装 1.6.0 和 1.6.5-beta1。\r\n\n### 新增与改进\r\n\n- 批量操作确认时显示目标模式和待修改项目清单。清单较长时默认折叠，可展开查看。\r\n- 批量操作结果新增“仅失败”筛选。失败项显示简短原因，可展开查看细节。\r\n- 模板“管理权限”、权限历史“选择要查看的权限”和访问监测的监测点列表中，已选项目优先显示，其余项目保持原有顺序。列表打开期间，勾选或取消选择不会改变排列顺序。\r\n- 模板“管理权限”显示已选数量，搜索无结果时显示提示，入口移至规则列表上方。\r\n- 应用页和“权限变更监听者”页面支持下拉刷新。监听者页面的说明移至信息按钮。\r\n- 搜索框新增清空按钮。权限历史的应用筛选支持按应用名和包名搜索。\r\n- 监测记录支持按应用和权限筛选，可与允许、拒绝筛选组合使用。\r\n- “按权限查看”中，模式为“忽略”的项目补充显示对应运行时权限的授权状态。\r\n- 优化部分 Android 16 设备上的权限修改流程。同一应用的同一项权限在确认需要兼容处理后，后续修改优先使用该方式，减少重复失败的尝试。\r\n\n### 修复\r\n\n- 修复 beta1 中权限详情页从后台返回时不刷新的问题。\r\n- 修复取消批量操作确认后已选项目被清空的问题。\r\n- 修复屏幕旋转后已选项目丢失的问题。\r\n- 没有权限规则的模板不再允许套用，并显示提示。\r\n- 修复监听者数据较多时“权限变更监听者”页面无法加载的问题。\r\n- 修复访问监测的应用搜索无结果时页面空白的问题。","body":"## English\r\n\nThis beta is based on 1.6.5-beta1. It improves interaction in multi-select, batch operations, refreshing and the access monitor, and fixes several issues. It can be installed over 1.6.0 and 1.6.5-beta1.\r\n\n### New and improved\r\n\n- Batch confirmations now show the target mode and the list of items to change. Long lists are collapsed by default and can be expanded.\r\n- Batch results add a Failures only filter. Failed items show a short reason, with details available on expansion.\r\n- Template Manage permissions, Choose permissions to show in Permission history, and the monitoring points list in Access monitor now show selected items first, with the rest in their original order. Checking or unchecking items while the list is open does not change the order.\r\n- Template Manage permissions shows the selected count and a message when a search has no results. Its entry moved above the rules list.\r\n- The Apps page and the Permission change listeners page support pull to refresh. The listeners page explanation moved behind the info button.\r\n- Search fields have a clear button. The app filter in Permission history supports searching by app name and package name.\r\n- Monitor log can be filtered by app and permission, in combination with the allowed and denied filters.\r\n- In the By permission view, items in Ignore mode also show whether the corresponding runtime permission is granted.\r\n- Improved permission changes on some Android 16 devices. Once a permission of an app is confirmed to need compatibility handling, later changes to the same permission of that app use that method first, avoiding repeated failed attempts.\r\n\n### Fixed\r\n\n- Fixed permission details not refreshing when returning from the background, introduced in beta1.\r\n- Fixed selections being cleared after cancelling a batch confirmation.\r\n- Fixed selections being lost after rotating the screen.\r\n- Templates without permission rules can no longer be applied and show a notice instead.\r\n- Fixed the Permission","release_url":"https://github.com/1zumiii/AppOpsNext/releases/tag/v1.6.5-beta2"},{"tag":"v1.6.5-beta1","prerelease":true,"published_at":"2026-10-07T13:13:08Z","date":"2026-10-07","zh":"## 简体中文\r\n\n本测试版基于 1.6.0，新增按权限查看和全选功能，并修复部分 Android 16 设备上的运行时权限修改失败问题。可直接覆盖安装 1.6.0，已保存的模板和设置不受影响。\r\n\n### 兼容性说明\r\n\n部分 Android 16 设备会限制相机、麦克风和位置等运行时权限的 AppOps 修改。遇到此类限制时，AppOpsNext 通过设置兼容撤销标记（REVOKED_COMPAT）实现“忽略”。\r\n\n这种方式保留应用已获得的权限，不会结束应用进程。系统权限页面可能仍显示为“已允许”。\r\n\n在此类设备上，受影响的权限不支持“拒绝”模式。选择“拒绝”时，AppOpsNext 会自动改用“忽略”。\r\n\n### 新增与改进\r\n\n- 应用页新增“按应用”和“按权限”两个标签页。选择一项权限后，可查看各应用的权限模式，支持单项修改和多选批量修改。\r\n- 应用页、应用详情页和权限详情页的多选模式新增“全选”。全选仅作用于当前显示的项目，搜索或筛选前的选择会保留。\r\n- 为权限列表中的常见权限补充图标映射。\r\n\n### 修复\r\n\n修复部分 Android 16 设备上从“拒绝”自动改用“忽略”后，修改仍然失败的问题。此修复适用于单项修改、批量操作和模板应用。\r\n\n### 验证范围\r\n\n按权限查看功能目前仅在 ASUS AI2302（Android 15）上验证。反馈者已在 realme RMX3370（Android 16）上确认兼容撤销标记生效。","body":"## English\r\n\nThis beta is based on 1.6.0. It adds a by-permission view and Select all, and fixes runtime permission changes that fail on some Android 16 devices. It can be installed over 1.6.0 without affecting saved templates or settings.\r\n\n### Compatibility notes\r\n\nSome Android 16 devices restrict AppOps changes for runtime permissions such as camera, microphone and location. When these restrictions apply, AppOpsNext uses the compatibility revocation flag (REVOKED_COMPAT) to enforce Ignore.\r\n\nThis method preserves the app's granted permission and does not terminate its process. The system permission settings may still show the permission as allowed.\r\n\nDeny is unavailable for the affected permissions on these devices. Selecting Deny automatically falls back to Ignore.\r\n\n### New and improved\r\n\n- Added By app and By permission tabs to the Apps page. Selecting a permission shows each app's permission mode, with support for individual and batch changes.\r\n- Added Select all to multi-select mode on the Apps page, app details and permission details. It applies only to currently displayed items and preserves selections made before a search or filter.\r\n- Added dedicated icons for common permissions in permission lists.\r\n\n### Fixed\r\n\nFixed permission changes that still failed after falling back from Deny to Ignore on some Android 16 devices. The fix applies to individual changes, batch operations and template application.\r\n\n### Verification scope\r\n\nThe by-permission view has currently been verified only on an ASUS AI2302 running Android 15. A reporter confirmed that the compatibility revocation flag takes effect on a realme RMX3370 running Android 16.\r\n\nSHA-256 (AppOpsNext-v1.6.5-beta1.apk): `ab35efeae54502efd94ddd069533f1c24cdf68ca914f5c6b000701007c975d86`","release_url":"https://github.com/1zumiii/AppOpsNext/releases/tag/v1.6.5-beta1"},{"tag":"v1.6.0","prerelease":false,"published_at":"2026-09-25T16:57:11Z","date":"2026-09-25","zh":null,"body":null,"release_url":"https://github.com/1zumiii/AppOpsNext/releases/tag/v1.6.0"}]},{"full":"t59688/newsnook","url":"https://github.com/t59688/newsnook","desc":"你的开箱即用，唯一资讯，RSS，LinuxDO  新闻，知乎APP","lang":"TypeScript","stars":304,"topics":["android","app","ios","news","rss"],"cats":["reading"],"primary":"reading","tags":["android","rss","ios"],"categoryConfidence":"override","tag":"v1.8.12-beta.6","prerelease":true,"published_at":"2026-10-12T06:10:00Z","date":"2026-10-12","zh":null,"body":"## 有所闻 NewsNook v1.8.12-beta.6\n\n### 阅读与媒体\n- 列表与正文更一致地使用文章预览图，缓存也会带上封面。\n- 没有封面时显示编辑风格占位图，避免空白卡片。\n- 从阅读页返回时滚动位置恢复更稳， 后的异步操作重新附着播放器。\n- 新增 Android 原站视频全屏支持，完善横屏、返回键与退出全屏恢复。\n- 优化播放器长标题显示，可滚动查看完整标题。\n\n### 订阅与站点\n- RSSHub 自动探测覆盖最多 20 条候选路由、每条最多 8 个同类实例，并控制并发与超时。\n- 失败时继续探测其他可用实例，逐条显示结果；探测超时提供明确提示。\n\n### 其它\n- 增加播放器、RSSHub 及 Android 全屏相关回归测试。\n- 版本号 1.8.12-beta.4；本版本为 Beta 测试版。\n\n**Full Changelog**: https://github.com/t59688/newsnook/compare/v1.8.12-beta.3...v1.8.12-beta.4\n\n**Full Changelog**: https://github.com/t59688/newsnook/compare/v1.8.12-beta.3...v1.8.12-beta.4","release_url":"https://github.com/t59688/newsnook/releases/tag/v1.8.12-beta.4"}]},{"full":"crimera/piko-newx","url":"https://github.com/crimera/piko-newx","desc":"New X on Android compatible piko builds","lang":"Python","stars":482,"topics":[],"cats":["social"],"primary":"social","tags":["android"],"categoryConfidence":"override","tag":"v3.56.1","prerelease":false,"published_at":"2026-10-12T01:13:43Z","date":"2026-10-12","zh":"### 🐛 错误修复\n* **Twitter - newx：** 在个人资料照片网格后显示页面背景 (94d42e6)\n* **Twitter：** 从默认补丁中移除“以图片形式分享”补丁 (02c906f)","body":"### 🐛 Bug Fixes\n* **Twitter - newx:** show the page background behind the profile Photos grid (94d42e6)\n* **Twitter:** remove share as image patch from the default patches (02c906f)","release_url":"https://github.com/crimera/piko-newx/releases/tag/v3.56.1","releases":[{"tag":"v3.56.1","prerelease":false,"published_at":"2026-10-12T01:13:43Z","date":"2026-10-12","zh":"### 🐛 错误修复\n* **Twitter - newx：** 在个人资料照片网格后显示页面背景 (94d42e6)\n* **Twitter：** 从默认补丁中移除“以图片形式分享”补丁 (02c906f)","body":"### 🐛 Bug Fixes\n* **Twitter - newx:** show the page background behind the profile Photos grid (94d42e6)\n* **Twitter:** remove share as image patch from the default patches (02c906f)","release_url":"https://github.com/crimera/piko-newx/releases/tag/v3.56.1"},{"tag":"v3.56.0","prerelease":false,"published_at":"2026-10-11T09:35:04Z","date":"2026-10-11","zh":"### ✨ 新功能\n* **Twitter：** 在下载通知中添加缩略图 (3bb54b6)","body":"### ✨ New Features\n* **Twitter:** add thumbnail on download notification (3bb54b6)","rele
