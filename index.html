ess.\n- **Three confirmed designs**: scrolling capture uses a tall frame with vertical arrows (`scroll-frame-arrows`); rounded corners use a smooth continuous contour (`corner-one-large`); Explode uses a component separating from a group (`explode-blocks`).\n- **Symmetric trim icons**: the top, bottom, left and right variants use paired broken lines and arcs with consistent spacing and rotation. This fixes the asymmetry caused by automatic dash placement.\n- **Clearer action meanings**: projects, images, JSON files, JSON text and feedback folders have their own symbols. Adding annotations, zooming, undoing, resetting, application settings and component layout are also distinct.\n- **Icons match the actual state**: loading an image resets annotation visibility icons and labels together; stopping scrolling capture restores the four-direction movement indicator. Light, dark, selected and disabled states are consistent, while fixed dark capture toolbars retain readable light icons.\n- The standalone HTML icon review page remains available for comparing actual button sizes, light and dark backgrounds, function mappings and alternatives.\n- **Web packages on the release page**: this release also ships `EditHere-web.zip` (offline single-file web edition) and `EditHere-web-agent.zip` (f","release_url":"https://github.com/Inginnng/EditHere/releases/tag/v0.11.1"},{"full":"daimiaopeng/coolapk-desktop","url":"https://github.com/daimiaopeng/coolapk-desktop","desc":"酷安跨平台桌面版","lang":"Vue","stars":1599,"tag":"v1.34.1","prerelease":false,"published_at":"2026-10-13T15:56:17Z","date":"2026-10-13","zh":null,"release_url":"https://github.com/daimiaopeng/coolapk-desktop/releases/tag/v1.34.1"},{"full":"appshubcc/Bettbox","url":"https://github.com/appshubcc/Bettbox","desc":"Another Better Mihomo Client","lang":"Go","stars":4080,"tag":"v1.19.5","prerelease":false,"published_at":"2026-10-13T15:00:27Z","date":"2026-10-13","zh":"- 全新的导航栏以及多平台全局主题：『无界』，关键词：简洁，素雅，精致，留白\r\n- 全新的首页联动开关以及自定义，桌面端侧边 n[bot] 发布于 https://github.com/z-mio/parse_hub_bot/pull/31\r\n* 💄 style(admin)：将 Cookie 状态列改为彩色按钮，点击查看详情，由 @devin-ai-integration[bot] 发布于 https://github.com/z-mio/parse_hub_bot/pull/32\r\n* ✨ 功能(admin)：告警“管理 Cookie”自动勾选对应 Cookie，调整表格对齐由 @devin-ai-integration[bot] 发布于 https://github.com/z-mio/parse_hub_bot/pull/33\r\n* fix(parser)：当作品不可用时不再重试，且不计入 Cookie 失败次数，由 @devin-ai-integration[bot] 发布于 https://github.com/z-mio/parse_hub_bot/pull/34\r\n* ⬆️ chore(deps)：将 parsehub 升级至 2.3.2，由 @devin-ai-integration[bot] 提交于 https://github.com/z-mio/parse_hub_bot/pull/35\r\n* 🐛 fix(config)：当配置文件被单独挂载时保存会报 EBUSY 错误，改回直接覆盖写入，由 @devin-ai-integration[bot] 发布于 https://github.com/z-mio/parse_hub_bot/pull/37\r\n* chore(deps)：将 parsehub 升级至 2.3.3，由 @devin-ai-integration[bot] 发布于 https://github.com/z-mio/parse_hub_bot/pull/38\r\n* 功能：访客模式解析 由 @devin-ai-integration[bot] 发布于 https://github.com/z-mio/parse_hub_bot/pull/39\r\n* 功能：图文/多媒体富文本发送 + 富文本布局开关，由 @devin-ai-integration[bot] 发布于 https://github.com/z-mio/parse_hub_bot/pull/40\r\n* 💄 style(help)：将平台表改为四列布局，全部左对齐，由 @devin-ai-integration[bot] 提交于 https://github.com/z-mio/parse_hub_bot/pull/41\r\n\r\n## 新贡献者\n* @devin-ai-integration[bot] 在 https://github.com/z-mio/parse_hub_bot/pull/26 完成了首次贡献\r\n\r\n**完整变更日志**：https://github.com/z-mio/parse_hub_bot/compare/v2.1.16...v2.2.0","release_url":"https://github.com/z-mio/parse_hub_bot/releases/tag/v2.2.0"},{"full":"7723mod/NPatch","url":"https://github.com/7723mod/NPatch","desc":"NPatch是一个复刻自LSPatch，以LSPosed为基础的免root的Xposed框架","lang":"Kotlin","stars":2500,"tag":"v1.0.9","prerelease":false,"published_at":"2026-10-12T12:22:42Z","date":"2026-10-12","zh":"## 英语\n\n### 🛡️ 加载器与签名绕过\n\n- **崩溃修复**：修复了启动时因无效 JNI 本地引用导致的崩溃（#139）；在 SECCOMP 模式下跳过本机 `openat` 重定向以避免重复重写；HIGH 级别现共享 360 保护兼容性回退机制。\n- **在管理器关闭时启动**：当管理器未运行时，加载器仅等待 800 毫秒后便从本地快照启动，而非在 2 秒的绑定过程中停滞。超时后，它会向 ConfigProvider 查询最新的模块范围，因此新增或移除的模块无需等待下次启动即可生效。 查询失败时不再覆盖快照。\n- **极致级别 `svc` 插桩**：现已支持手动编写的内联 `svc #0` 系统调用（打包工具和反作弊机制用于绕过 libc 钩子），仅限 arm64 架构且需手动启用。\n- **崩溃日志桥接**：已恢复模块和内核崩溃日志，诊断导出功能可通过 Shizuku 捕获 logcat 日志。\n\n### 🔧 管理器修复\n\n- 修复了在受限环境中模块扫描结果丢失的问题，该问题可能导致已配置的模块被清除。\n- 恢复了 Companion 激活推送以及独立于 Shizuku 的双轨推送。\n- 修复了打包多个选定 APK 时出现白屏的问题；现在打包多个基础 APK 时会提供选择菜单。\n\n### 🎨 管理器 UI：Miuix\n\n- **Miuix 0.9.4**：管理器 UI 从 COUI 迁移至稳定的 Miuix 0.9.4 组件库，导航功能迁移至 miuix-nav，因此滑回操作更加流畅且一致。\n- **应用详情页**：在“管理”界面点击应用后，现将打开按状态/操作/系统/危险区域分类的专属详情页，取代了在小屏幕上会被截断的弹出菜单。加载器版本、模块数量和签名绕过级别均直接显示在页面上。\n- **对话框与背景优化**：对话框按钮在长语言环境下不再出现排版错位，次级页面采用纯色背景，因此自定义背景图片不再透出。\n- **保持运行通知**：支持可选的持久通知和开机启动功能，使管理器在后台保持运行。\n\n---\n\n## 中文\n\n### 🛡️ 加载器与签名绕过\n\n- **崩溃修复**：修复了启动时必然闪退的 JNI 无效本地引用问题（#139）；在 SECCOMP 模式下跳过原生 `openat` 重定向，避免双重重写；HIGH 等级同样应用 360 加固兼容性降级。\n- **管理器关闭时的启动**：当管理器不在后台时，仅等待 800 毫秒即使用本地快照启动，不再卡在 2 秒绑定过程中；超时后向 ConfigProvider 获取最新模块范围，新增或移除的模块无需等到下次启动才生效；查询失败时不再覆盖快照。\n- **EXTREME 级别 `svc` 插桩**：通过手动内联 `svc #0` 系统调用，弥补了反作弊代码中绕过 libc 钩子的盲区（仅限 arm64，需手动启用）。\n- **崩溃日志桥接**：恢复模块与内核的崩溃日志，诊断导出支持通过 Shizuku 抓取 logcat。\n\n### 🔧 Manager 修复\n\n- 修复了受限环境下模块扫描结果丢失的问题，该问题曾导致已配置的模块被清空。\n- 恢复了 Companion 激活推送，并支持不依赖 Shizuku 的 ContentProvider 双轨推送。\n- 修复多选 APK 打包时出现白屏的问题；检测到多个 Base APK 时提供菜单引导。\n\n### 🎨 Manager 界面：Miuix\n\n- **Miuix 0.9.4**：Manager 界面从 COUI 切换至 Miuix 0.9.4 正式版，导航迁移至 miuix-nav，侧滑返回操作更流畅且一致。\n- **应用详情页**：在管理页面点击应用后，将跳转至独立详情页，按状态／操作／系统／危险操作进行分组，取代了在小屏幕上会被裁切的弹出菜单；Loader 版本、模块数量、签名绕过等级直接显示在页面上。\n- **对话框与背景细节**：在语言较长的情况下，对话框按钮不再因换行而挤在一起；二级页面改用纯色背景，自定义背景图不再透出。\n- **消息保持活跃的常驻通知**：新增可选的常驻通知和开机自启功能，使 Manager 更不容易被后台回收。","release_url":"https://github.com/7723mod/NPatch/releases/tag/v1.0.9"},{"full":"EKKOLearnAI/ekko-studio","url":"https://github.com/EKKOLearnAI/ekko-studio","desc":"Ekko Studio is a local-first AI workspace for multi-agent chat, coding, and visual workflows, available on desktop and t","lang":"TypeScript","stars":11403,"tag":"v1.0.7","prerelease":false,"published_at":"2026-10-12T12:19:22Z","date":"2026-10-12","zh":"Ekko Studio Android v1.0.7\n\n- 版本：1.0.7\n- 版本号（versionCode）：159\n- 构建类型：云端加固版（cloud）\n- 包名：com.ekkostudio.ai\n- 架构：arm64-v8a\n- 安装包：E can be expanded.\n- Batch results add a Failures only filter. Failed items show a short reason, with details available on expansion.\r\n- Template Manage permissions, Choose permissions to show in Permission history, and the monitoring points list in Access monitor now show selected items first, with the rest in their original order. Checking or unchecking items while the list is open does not change the order.\r\n- Template Manage permissions shows the selected count and a message when a search has no results. Its entry moved above the rules list.\n- The Apps page and the Permission change listeners page support pull to refresh. The listeners page explanation moved behind the info button.\r\n- Search fields have a clear button. The app filter in Permission history supports searching by app name and package name.\n- Monitor log can be filtered by app and permission, in combination with the allowed and denied filters.\n- In the By permission view, items in Ignore mode also show whether the corresponding runtime permission is granted.\r\n- Improved permission changes on some Android 16 devices. Once a permission of an app is confirmed to need compatibility handling, later changes to the same permission of that app use that method first, avoiding repeated failed attempts.\n\n### Fixed\r\n\r\n- Fixed permission details not refreshing when returning from the background, introduced in beta1.\n- Fixed selections being cleared after cancelling ","release_url":"https://github.com/1zumiii/AppOpsNext/releases/tag/v1.6.5-beta2"},{"full":"t59688/newsnook","url":"https://github.com/t59688/newsnook","desc":"你的开箱即用，唯一资讯，RSS，LinuxDO  新闻，知乎APP","lang":"TypeScript","stars":304,"tag":"v1.8.12-beta.6","prerelease":true,"published_at":"2026-10-12T06:10:00Z","date":"2026-10-12","zh":null,"release_url":"https://github.com/t59688/newsnook/releases/tag/v1.8.12-beta.6"},{"full":"crimera/piko-newx","url":"https://github.com/crimera/piko-newx","desc":"New X on Android compatible piko builds","l pendatalab/MinerU","url":"https://github.com/opendatalab/MinerU","desc":"Transforms complex documents like PDFs and Office docs into LLM-ready markdown/JSON for your Agentic workflows.","lang":"Python","stars":81676,"tag":"mineru-4.0.12-released","prerelease":false,"published_at":"2026-10-11T02:21:42Z","date":"2026-10-11","zh":"## 更新内容 / 变更说明\n\n**新增功能**\n- V1 API：自部署 API 与 Router 新增了 `/v1/tasks` 异步便捷接口和 `/v1/file_parse` 同步封装，支持一次性提交文件、查询状态以及获取 JSON/ZIP 结果；与 `/v1/parse/jobs` 共用任务 ID / V1 API: 在自部署 API 服务器和路由器中新增异步 `/v1/tasks` 及同步 `/v1/file_parse` 便捷接口，支持单次请求提交文件、查询状态，并获取 JSON/ZIP 结果，且与现有解析任务 ID 共享\n- 上传复用：支持 SHA-256 预检及现有 `file_id` 的复用；原始字节入口在缓存命中时可提前返回，客户端示例见 `scripts/http_task_example.sh` / 上传复用：支持 SHA-256 预检及现有 `file_id` 引用；当缓存命中时，原始字节入口可在读取正文前响应，客户端示例见 `scripts/http_task_example.sh`\n\n**改进 / Improvements**\n- 路由器：根据健康状态、解析能力及未完成任务负载进行调度，在负载均衡时采用轮询机制；完善跨 worker 的输入复制、任务预占以及失败/取消/终止后的负载释放 / Router: 根据 worker 健康状态、解析能力及未完成任务负载进行调度，在负载相等的 worker 之间轮询，并改进跨 worker 输入复制、任务预占和负载释放\n- 资源保留：API 与 Router 默认在 24 小时后回收过期资源；可通过 `--retention-seconds` 或 `MINERU_API_RETENTION_SECONDS` 配置，设为 `0` 禁用自动回收 / 保留：API 服务器和路由器默认会在 24 小时后回收过期资源；可通过配置 `--retention-seconds` 或 `MINERU_API_RETENTION_SECONDS` 进行调整，设置为 `0` 可禁用自动回收\n- 模型生命周期：识别致命引擎错误并返回 `503 engine_dead`，托管 worker 支持代际恢复和退避机制，防止过期响应污染新 worker / 模型生命周期：检测致命引擎错误并返回 `503 engine_dead`，通过退避机制恢复托管 worker 的代际状态，并拒绝过期响应\n- Torch CPU：根据显式线程配置、有效 CPU 配额及现有上限限制运算符线程，并将限制传播至后续工作线程 / Torch CPU: cap operator threads using explicit settings, effective CPU quotas and existing lower limits, and apply the selected limit to subsequent worker threads\n- API 文档：Swagger/ReDoc 使用本地资源，支持离线访问、Bearer 授权及反向代理路径前缀 / API documentation: serve Swagger/ReDoc assets locally, with offline access, Bearer authorization and reverse-proxy path prefixes\n\n**修复 / Fixes**\n- Router：任务保留期从跨 worker 副本清理完成后开始；过期回收及 worker 移除不再减少调用方的累计用量；非法输出格式在 worker 调度前返回请求错误 / 路由器：在跨 worker 输入清理完成后开始计算任务保留期；在收集和移除 worker 过程中保留每个所有者的生命周期使用量；并在 worker 选择前拒绝无效的输出格式\n- PDF：修复原生文本中中日韩边界标点和生成空格的处理，统一 Python/Rust 路径；补充扫描件路由和原生表格模型回退的回归测试 / PDF：修复 Python/Rust 路径中中日韩边界标点及生成空格的处理问题，并针对扫描件路由和原生表格模型回退提供回归测试覆盖 /\n- 版面分析：恢复 PP-DocLayoutV2 的模型分类阈值，统一 Torch/ONNX 输出过滤与阅读顺序候选有效性 / Layout: restore PP-DocLayoutV2 model class thresholds and align Torch/ONNX output filtering with reading-order candidate validity\n- Office：通过 DocVortex 公共解析接口保留 DOCX/PPTX 表格内的富文本超链接 / Office: preserve rich-text hyperlinks in DOCX/PPTX tables through public DocVortex parsing interfaces\n\n**依赖 / Dependencies**\n- docvortex 最低版本提升至 0.5.16（`>=0.5.16,<1`）/ 要求 docvortex>=0.5.16,<1\n- 新增 fastapi-offline（`>=1.7.7,<2`）/ 新增 fastapi-offline>=1.7.7,<2\n\n**升级说明 / Upgrade Notes**\n- 便捷接口位于 V1 命名空间；同步等待超时时返回 `202` 状态码及任务引用，任务将继续执行，客户端可继续查询结果 / Convenience endpoints use the V1 namespace; synchronous wait timeouts return `202` with task references while the task continues, so","release_url":"https://github.com/opendatalab/MinerU/releases/tag/mineru-4.0.12-released"},{"full":"AstrBotDevs/AstrBot","url":"https://github.com/AstrBotDevs/AstrBot","desc":"AI Agent Assistant & development framework that integrates lots of IM platforms, LLMs, plugins and AI feature, and can b","lang":"Python","stars":41843,"tag":"v4.29.0-beta.2","prerelease":false,"published_at":"2026-10-10T16:19:27Z","date":"2026-10-10","zh":"## [4.29.0-beta.2] - 2026-10-11\n\n此预发布版本包含自 **v4.29.0-beta.1** 以来的变更。\n\n### 主要新增功能\n\n- WebUI：在选中模型的旁边以及“模型/备用模型”菜单中添加了模型设置快捷方式。使用该模型的每个配置文件中的更改都会立即保存。（#10321）\n- WebUI：新增了控制台日志搜索和关键词高亮功能，为技能添加了源代码标记，在 ChatUI 中支持分阶段图像预览，并会记住上次打开的“数据与日志”标签页。（#10327、#10339、#10376、#10251）\n- WebUI：在机器人编辑器中，通过侧边抽屉新增了配置文件编辑功能。（#10310）\n- Docker：在容器内部集成了用于密码重置的 `astrbot` CLI。（#10442）\n\n### 主要优化\n\n- WebUI：通过延迟加载 VAD、Monaco、翻译内容和 ApexCharts，并启用 gzip 响应，显著降低了初始加载开销并提升了加载速度。（#10413）\n- WebUI：在滚动时保持内容边框和角点固定，在桌面端右侧和底部添加了 6px 间距，并在内容窗格滚动时固定配置/设置标题栏和分区导航。（#10480）\n- 计算机使用：明确了本地权限访问模式；当无法使用本地隔离时，保持执行和文件访问控制可见；并将设置指南链接至整合后的 Agent Sandbox 指南。(#10444, #10445, #10487)\n- 文档：更新了中文和英文版的插件及内置 AI 指南，包含最新工作流、故障排除和本地化截图；更新了 Slack 及 Lark/飞书的设置说明。(#10487, #10353, #10400)\n\n### 主要修复\n\n- Agent：停止会话现可终止其后台代理任务，并防止主代理延迟唤醒。仅清理一次会话等待器，并将异步工具生成器保留在同一任务中。（#10323、#10347、#10474）\n- 代理：当后台任务结果未交付给用户时会发出警告，并避免记录没有匹配平台的 cron 发送。（#10398, #10468）\n- 核心：在上下文摘要失败后及时回退，将命令组名称按完整单词进行匹配，维护一个可编辑的系统默认角色，并在删除角色文件夹时保留子文件夹。（#10436, #10372, #10287, #10361）\n- 提供程序：保留了流输入为空的 Anthropic 工具调用，将自定义服务器工具与已注册工具合并，用 `gemini-embedding-001` 替换了已停用的 Gemini 嵌入默认值，并处理了 Dify 流中的 CRLF 分隔符。 (#10432, #10437, #10393, #10392)\n- 图片：拒绝未解析和非标准图片引用（而非伪造本地路径），保留了音频/视频/文件的待处理路径处理机制，并在非严格有效载荷组装过程中跳过无效图片。增加了对超大 Base64 有效载荷和长 Windows 路径的容错处理。(#10434)\n- 音频：对无法解析的语音附件进行降级处理而不导致轮次失败，避免阻塞格式探测，并在请求结束后关闭 FishAudio TTS 客户端。（#10337, #10055, #10358）\n- 平台：修复了 Telegram 中的 UTF-16 偏移量问题和机器人提及不区分大小写的问题，并将 Telegram 令牌默认设为空。保留了 Slack 中的代码块、引用、列表、链接和提及，并在上传前解析了远程 Slack 文件。将 Discord 视频组件作为附件发送，并防止了自我回复循环。 (#10367, #10399, #10365, #10380, #10447, #10448, #10355, #10423, #10425)\n- WebUI：在发送聊天消息时强制执行会话所有权，以唯一名称存储附件，恢复了插件 README 中的锚点，并修正了深色模式下的日志搜索和默认个人资料本地化问题。 (#10346, #10356, #10341, #10351, #10296)\n- WebUI：更新了导航和提供商图标，修正了配置页面中“测试聊天”按钮的主题颜色，并更新了插件提交链接及标签。 复用了徽标令牌，并刷新了过期的平台缓存。(#10304, #10332, #10309, #10471, #10294)\n\n### 导航与配置变更\n\n- 侧边栏：核心条目归类于“系统”下；“角色”、“知识库”、“计划任务”、“子代理协调”和“插件视图”则显示在“扩展”下。版本号显示在侧边栏页脚处。（#10304, #10307）\n- 配置：将管理员和白名单设置移至**访问控制**，并将“平台”重命名为“平台与消息”。(#10321)\n- 配置：将文本转图像渲染设置从“系统设置”移至配置配置文件的**“扩展”**部分。每个配置文件现在都有独立的文本转图像设置。(#10306)\n- 外观：移除了“自定义侧边栏”功能。(#10480)\n- 文档：改进了“使用方法”部分的指南。(#10487)\n\n## 中文\n\n本预发布版本包含自 **v4.29.0-beta.1** 以来的变更。\n\n### 主要新增功能\n\n- WebUI：在模型选择器旁以及模型、回退模型菜单中新增设置入口，修改后会立即影响引用该模型的所有配置文件。 (#10321)\n- WebUI：新增控制台日志搜索与关键词高亮功能、技能来源标识、ChatUI 待发送图片预览，并记住「数据与日志」页面上次打开的标签页。 (#10327, #10339, #10376, #10251)\n- WebUI：支持在机器人编辑器的侧边抽屉中编辑配置文件。 (#10310)\n- Docker：镜像内包含 `astrbot` CLI，可在容器中重置密码。 (#10442)\n\n### 主要优化\n\n- WebUI：延迟加载 VAD、Monaco、多语言资源及 ApexCharts，并启用 gzip 响应，大幅降低了首屏加载开销，提高了加载速度","release_url":"https://github.com/AstrBotDevs/AstrBot/releases/tag/v4.29.0-beta.2"},{"full":"crimera/piko","url":"https://github.com/crimera/piko","desc":"mo function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function ago(ts){if(!ts)return "";var s=Math.floor((Date.now()-new Date(ts).getTime())/1000);if(s<0)return "刚刚";if(s<3600)return Math.floor(s/60)+" 分钟前";if(s<86400)return Math.floor(s/3600)+" 小时前";if(s<86400*30)return Math.floor(s/86400)+" 天前";if(s<86400*365)return Math.floor(s/86400/30)+" 个月前";return Math.floor(s/86400/365)+" 年前";}

function badge(r){if(r.isCommit||!r.tag)return "<span class=\"badge commit\">📝 仅提交</span>";return r.prerelease?"<span class=\"badge beta\">🧪 测试版</span>":"<span class=\"badge stable\">✅ 正式版</span>";}

function renderAll(){var mode=document.getElementById("fSort").value;var list=DATA.all.filter(matchFilters);var box=document.getElementById("all");var h="",i;if(mode==="name"){list.sort(function(a,b){var x=a.full.toLowerCase(),y=b.full.toLowerCase();return x<y?-1:(x>y?1:0);});for(i=0;i<list.length;i++){h+=nameRow(list[i]);}}else{var groups=[[],[],[],[]];for(i=0;i<list.length;i++){groups[sectionOf(list[i])].push(list[i]);}for(i=0;i<4;i++){if(!groups[i].length)continue;h+="<details class=\"group\""+(i===0?" open":"")+"><summary>"+SECTIONS[i].icon+" "+SECTIONS[i].name+"（"+groups[i].length+"）</summary>";h+="<div class=\"timeline\">"+groups[i].map(tlItem).join("")+"</div></details>";}}if(!list.length){h="<div class=\"empty\">没有匹配的项目</div>";}box.innerHTML=h;document.getElementById("allCount").textContent="（"+list.length+" / "+DATA.all.length+"）";}
